<style>
@import url('/fonts/fonts.css');
:root{--ink:#141416;--paper:#fff;--fog:#f5f5f2;--dim:#727278;--line:rgba(20,20,22,.14);--cue:#4bff9a;--ok:#17603a;--bad:#a02a20;--warn:#8a5a00}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;text-decoration:none;cursor:pointer;font-weight:600;min-height:34px;font-size:13px;white-space:nowrap}.btn:hover{background:var(--ink);color:#fff}

.chk{display:flex;gap:6px;align-items:center;font-size:13px}

.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(20,20,22,.3);vertical-align:-1px;margin-right:6px}
.note{font-size:12.5px;color:#4a4a50;margin:0}.find{font-size:12.5px;display:flex;gap:8px;align-items:flex-start}.find i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--dim)}.find.fail i{background:var(--bad)}.readbox{background:#f3fff8;border:1px solid #bfe9d0;border-radius:14px;padding:12px}.find.warn i{background:#d9a300}.find.info i{background:var(--ok)}.rvround{border-top:1px solid #d6efe0;padding-top:8px;display:grid;gap:6px}.rvhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}.mtrow{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0;border-top:1px solid #eeede8}.mth{width:56px;height:42px;border-radius:8px;overflow:hidden;background:#f4f3ef}.mth svg{width:100%;height:100%;display:block}.mth.empty{border:1px dashed #c7c7c2;background:none}.mtb{display:grid;gap:4px;font-size:12.5px;min-width:0}.mtlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:300px;overflow:auto;padding:4px 0}.mtc{display:grid;gap:3px;border:1px solid #e3e2dc;border-radius:10px;background:#fff;padding:4px;cursor:pointer;text-align:left;font:inherit;font-size:11px}.mtc .mth{width:100%;height:58px}.mtc:hover,.mtc:focus-visible{border-color:#141416}.skrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;padding:4px 0;border-top:1px solid #eeede8}.skrow>b{min-width:52px}.skr{display:flex;gap:4px;align-items:center;font-size:11.5px;color:#4a4a50}.skr input{width:84px}.inks{display:inline-flex;gap:4px;align-items:center}.inks button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c7c7c2;cursor:pointer;padding:0}.inks button[aria-pressed=true]{box-shadow:0 0 0 2px #141416}#ktools [data-k][aria-pressed=true]{background:#141416;color:#fff}#canvas [data-logo]{cursor:move}.rvjudges{font-size:11.5px;color:#727278;font-variant-numeric:tabular-nums;margin-left:auto;margin-right:10px}.rvscore{font-variant-numeric:tabular-nums;font-weight:700;color:#8a6a00}.rvscore.ok{color:var(--ok)}.rvcrit{display:grid;gap:3px}.rvcrit span{position:relative;font-size:11.5px;padding:2px 6px;border-radius:6px;background:#fff;overflow:hidden;display:flex;justify-content:space-between}.rvcrit span i{position:absolute;inset:0 auto 0 0;background:#dff3e7}.rvcrit span>em,.rvcrit span>b{position:relative;font-style:normal}.rvverdict{font-size:13px;font-weight:600;margin:0;padding:6px 8px;border-radius:8px;background:#fff}.rvverdict.ok{color:var(--ok)}.rvverdict.warn{color:#8a6a00}.dim{color:#727278}
.empty{max-width:560px;margin:40px auto;padding:22px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:50}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);max-height:none}#canvas svg{max-height:62vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app">
  <div class="bar">
    <div class="ttl"><b id="ttl">Pattern</b><span id="sub">Loading…</span></div>
    <div class="seg" role="group" aria-label="What to show" id="modeSeg"><button type="button" data-t="0" aria-pressed="true">Product</button><button type="button" data-t="0.45" aria-pressed="false">Exploded</button><button type="button" data-t="1" aria-pressed="false">Cutting layout</button></div>

    <button class="btn q" type="button" id="editBtn" aria-pressed="false" title="Edit the pieces: points, notches, seam allowance, grain">Edit pieces</button>
    <button class="btn q hidden" type="button" id="lastBtn" aria-pressed="false" title="The shoe on its last in 3D: draw a seam on it, and see the pieces flattened off it">On the last</button>

  </div>
  <div class="wrap" id="main">
    <div class="stage">
      <div class="scrub"><span class="mono">Product</span><input type="range" id="t" min="0" max="1" step="0.01" value="0" aria-label="From the product to the pattern pieces"><span class="mono">Pattern</span><span class="lbl" id="tLbl">On the product</span></div>
      <div class="scrub hidden" id="etools" role="toolbar" aria-label="Edit the piece"><select class="t" id="ePiece" aria-label="Piece"></select><button class="btn sm q" type="button" data-e="undo" title="Undo (Ctrl+Z)">Undo</button><button class="btn sm q" type="button" data-e="redo" title="Redo (Ctrl+Shift+Z)">Redo</button><button class="btn sm q" type="button" data-e="add" title="A point halfway to the next">Add point</button><button class="btn sm q" type="button" data-e="del" title="Delete the chosen points (Delete)">Delete point</button><button class="btn sm q" type="button" data-e="notch" title="A notch at the chosen point (N)">Notch</button><button class="btn sm q" type="button" data-e="reset">Reset piece</button><span class="lbl" id="eHint">Click a point; Shift-click a second to measure a run</span></div>
      <div class="scrub hidden" id="ltools" role="toolbar" aria-label="On the last"><button class="btn sm go" type="button" data-l="draw">Draw a seam</button><button class="btn sm q hidden" type="button" data-l="undo">Undo point</button><button class="btn sm q hidden" type="button" data-l="cancel">Cancel</button><select class="t hidden" id="lPiece" aria-label="Piece to cut"></select><button class="btn sm go hidden" type="button" data-l="cut">Cut it along the seam</button><button class="btn sm q" type="button" data-l="sketch" aria-pressed="false" title="Draw on the last by hand: lines on the sides show on the flat views too">Sketch on it</button><button class="btn sm q hidden" type="button" data-l="skundo">Undo line</button><button class="btn sm q" type="button" data-l="side">Outside</button><button class="btn sm q" type="button" data-l="other">Inside</button><button class="btn sm q" type="button" data-l="top">Top</button><span class="lbl" id="lHint">Drag to turn the last</span></div>
      <div class="scrub hidden" id="ktools" role="toolbar" aria-label="Sketch"><button class="btn sm q" type="button" data-k="pen" aria-pressed="true">Pen</button><button class="btn sm q" type="button" data-k="erase" aria-pressed="false">Eraser</button><button class="btn sm q" type="button" data-k="shape" aria-pressed="false" title="Reshape any line: yours, a seam, or the model's own (drag its dot)">Reshape</button><button class="btn sm q" type="button" data-k="seam" aria-pressed="false" title="Make a line you drew into a seam that cuts the piece it crosses">Make a seam</button><button class="btn sm q" type="button" data-k="place" aria-pressed="false" title="Drag a paper sketch to line it up under its view">Move sketch</button><span class="inks" role="group" aria-label="Ink"><button type="button" data-ink="#3a3a3c" aria-label="Graphite" style="background:#3a3a3c"></button><button type="button" data-ink="#c2410c" aria-label="Red" style="background:#c2410c"></button><button type="button" data-ink="#2a6df4" aria-label="Blue" style="background:#2a6df4"></button><button type="button" data-ink="#17603a" aria-label="Green" style="background:#17603a"></button></span><select class="t" id="kSize" aria-label="Line"><option value="0.015">Fine</option><option value="0.03" selected>Medium</option><option value="0.06">Bold</option></select><button class="btn sm q" type="button" data-ka="undo" disabled>Undo</button><select class="t hidden" id="kReach" aria-label="How much of the line follows"><option value="0.25">Bend close</option><option value="0.8" selected>Bend soft</option><option value="2">Bend wide</option></select><button class="btn sm q hidden" type="button" data-ka="smooth">Smooth</button><button class="btn sm q hidden" type="button" data-ka="unseam" title="The seam goes back to a hand line, and the piece is whole again">Back to a sketch</button><select class="t hidden" id="kModel" aria-label="The model's line"></select><button class="btn sm go hidden" type="button" data-ka="fit" title="The model's line moves to where your line is, and the shoe is drafted again">Make it the model's line</button><button class="btn sm q hidden" type="button" data-ka="del">Delete</button><select class="t hidden" id="kPiece" aria-label="Piece to cut"></select><button class="btn sm go hidden" type="button" data-ka="cut">Cut the piece along it</button><span class="lbl" id="kHint"></span></div>
      <div id="canvas" aria-live="polite"></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<script type="module">
import { garmentPattern, applyEdits, simplifyClosed, runLength, plushPattern, cleanPlush, plushDefaults, layoutOf, explodeAt, assembled, offsetOf, boundsOf, areaOf, fabricName, cutWords, fillGrams } from '/lab/lab-pattern.js';
import { STYLES } from '/lab/lab-flats.js';
import { footwearPattern, cleanFootwear, sizeRun, hideArea } from '/lab/lab-footwear.js';
import { shellOf, onSurface, cutOutline } from '/lab/lab-last-shell.js';
import { footwearViews, viewsLayout, viewsMarkup, sketchPoint, warpOf } from '/lab/lab-footwear-views.js';
import { INKS, hitStroke, simplify, strokesSvg } from '/lab/lab-sketch.js';
import { plushViews, plushLayout } from '/lab/lab-plush-views.js';
import { logoChecks, LOGO_TECHNIQUES, LOGO_VIEWS, MARKS } from '/lab/lab-logos.js';
import { bend, smooth, nearest, insertAt, handlesOf, modelLines, moveLine, fitLine } from '/lab/lab-lines.js';
import { partLooks } from '/lab/lab-looks.js';
import { materialSvg } from '/lab/lab-swatches.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN=()=>{try{return localStorage.getItem('fb.admin.token')||localStorage.getItem('fb.client.token')||''}catch{return ''}};
async function api(path,o={}){const r=await fetch(path,{method:o.method||(o.body?'POST':'GET'),headers:{Authorization:'Bearer '+TOKEN(),...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong'),{status:r.status});return j}
const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const CID=new URLSearchParams(location.search).get('concept')||'',HOST=()=>{try{return parent!==window?parent.FBDesign:null}catch{return null}};
const FILL={upper:'#e6d8c3',overlay:'#d9c2a3',foam:'#f3efc9',stiffener:'#dcdfe6',rubber:'#bdbdb8',eva:'#e8e8e2',elastic:'#cfd6c8',self:'#e9e4d8',pile:'#efe2cf',leather:'#d8c3a8',rib:'#d6e4ef',lining:'#e6dcef',fusing:'#f1efe6',pocketing:'#e3ecdf',board:'#dcdcdc',knit:'#e0e9d6',contrast:'#f3d3cc',felt:'#f1e2b8'};
let PAT0=null,EDIT=false,EP=null,SELP=[],SEAM={a:null,b:null},EH=[],EHI=-1,DRAG=null,D=null,PAT=null,SPEC=null,SIZE='M',T=0,ANIM=0,SEL=null,DIRTY=false,RD=null,RDBUSY=false,RV=null,PICURL='',SHOWPIC=true;
const r3=v=>Math.round(v*1000)/1000,P=pts=>'M'+pts.map(q=>`${r3(q[0])} ${r3(q[1])}`).join(' L')+' Z';
function build(){PAT0=D.kind==='footwear'?footwearPattern(SPEC,Number(SIZE)):D.kind==='plush'?plushPattern(SPEC):D.kind==='garment'&&D.flat?garmentPattern(D.flat,SIZE):null;if(PAT0&&D.kind==='garment'&&SPEC.sa)PAT0={...PAT0,sa:SPEC.sa};PAT=PAT0?applyEdits(PAT0,SPEC.edits):null}

// ---------- the drawing ----------
// t < 1: the pieces on the product, lifted off and spread (the exploded view), flying flat; t = 1: the cutting layout, every piece it takes
// each cloth's width from the material on its part (cm in the library), and its name on the cutting layout
const clothWidths=()=>Object.fromEntries(MATS.filter(k=>k.kind==='fabric'&&Number(k.spec?.widthCm)>20).map(k=>[k.part,Math.round(k.spec.widthCm/2.54)]));
function drawPieces(){
  if(!PAT){$('#canvas').innerHTML='';return}
  if(EDIT)return drawEditor();
  if(LASTV)return drawLast();
  const lay=layoutOf(PAT,{width:Number(SPEC.width)||58,widths:clothWidths()});let body='',bb;
  if(T>=.999){
    let y0=0;const items=[];
    for(const g of lay){body+=`<text x="0" y="${r3(y0-.5)}" font-size=".55" font-weight="700" fill="#141416">${esc(g.name)}${(m=>m?` · ${esc(m.name)}`:'')(MATS.find(x=>x.part===g.fabric))}</text><text x="${r3(g.width)}" y="${r3(y0-.5)}" font-size=".42" text-anchor="end" fill="#727278">${g.width} in wide · ${g.length} in · ${g.yards} yd · ${g.efficiency}% used</text><rect x="0" y="${r3(y0)}" width="${g.width}" height="${r3(g.length)}" fill="#fff" stroke="#c7c7c2" stroke-width=".04" stroke-dasharray=".3 .2"/>`;
      for(const it of g.items){const q=it.piece,tf=pts=>pts.map(([x,y])=>[(it.flip?-x+(it.b.x0+it.b.x1):x)+it.x,y+it.y+y0]),sew=tf(q.sew),cut=tf(offsetOf(q.sew,q.sa??PAT.sa)),gr=tf(q.grain),b=boundsOf(sew),fs=Math.min(.55,Math.max(.22,b.w/12));
        const ink=inkOn(q);body+=`<g data-pid="${esc(q.id)}" class="pc"><path d="${P(cut)}" fill="${fillOf(q)}" stroke="${SEL===q.id?'#17603a':'#141416'}" stroke-width="${SEL===q.id?.09:.05}"/><path d="${P(sew)}" fill="none" stroke="${ink}" stroke-width=".03" stroke-dasharray=".2 .12"/>`
          +`<path d="M${r3(gr[0][0])} ${r3(gr[0][1])} L${r3(gr[1][0])} ${r3(gr[1][1])}" stroke="#17603a" stroke-width=".05" marker-start="url(#ga)" marker-end="url(#ga)"/>`
          +tf(q.notches).map(n=>`<circle cx="${r3(n[0])}" cy="${r3(n[1])}" r=".12" fill="#141416"/>`).join('')
          +(q.fold?`<path d="M${r3(it.x)} ${r3(b.y0)} L${r3(it.x)} ${r3(b.y1)}" stroke="#a02a20" stroke-width=".05" stroke-dasharray=".35 .18"/>`:'')
          +(it.n===0?`<text x="${r3((b.x0+b.x1)/2)}" y="${r3((b.y0+b.y1)/2)}" text-anchor="middle" font-size="${r3(fs)}" font-weight="700" fill="${ink}">${esc(q.name)}</text><text x="${r3((b.x0+b.x1)/2)}" y="${r3((b.y0+b.y1)/2+fs*1.2)}" text-anchor="middle" font-size="${r3(fs*.75)}" fill="${ink}" opacity=".75">${esc(cutWords(q))}</text>`:`<text x="${r3((b.x0+b.x1)/2)}" y="${r3((b.y0+b.y1)/2)}" text-anchor="middle" font-size="${r3(fs*.75)}" fill="${ink}" opacity=".75">${esc(q.name)} ${it.n+1}/${q.cut}</text>`)+`</g>`;items.push(...cut)}
      y0+=g.length+2.4}
    bb=boundsOf(items.length?items:[[0,0],[10,10]]);bb={x0:-.5,y0:-1.4,x1:Math.max(...lay.map(g=>g.width))+.5,y1:y0}
  }else if(D.kind==='footwear'&&T<.02){
    // the shoe as tech flats: outside, inside, top and bottom (src/lab-footwear-views.js); the concept's picture over the outside
    const lv=viewsLayout(footwearViews(PAT,looks())),pic=PICURL&&SHOWPIC&&SPEC.picture?SPEC.picture:null;
    if(pic){const k=(PAT.last.length+.3)/Math.max(1,pic.x1-pic.x0),tx=pic.toeLeft?pic.x1*k-.1:-pic.x0*k-.1;body+=`<g transform="translate(${r3(tx)} ${r3(-pic.y1*k+(PAT.ground||0))})${pic.toeLeft?' scale(-1 1)':''}" opacity=".9"><image href="${PICURL}" x="0" y="0" width="${r3(pic.imgW*k)}" height="${r3(pic.imgH*k)}" preserveAspectRatio="none"/></g>`}
    LV=lv;
    body+=`<g id="flats">${viewsMarkup(lv,{faint:pic?0:-1})}</g>`+ulMarkup(lv);
    body+=reshapeMarkup(lv)+logoBoxes(lv);if(SEL)body+=`<style>#flats [data-pid="${SEL}"]{stroke:#17603a;stroke-width:.07}</style>`;
    bb={x0:lv.box.x0-.6,y0:lv.box.y0-.6,x1:lv.box.x1+.6,y1:lv.box.y1+.4}
  }else if(D.kind==='plush'&&T<.02){
    // the plush as tech flats: front, back and side, stuffed and sewn (src/lab-plush-views.js)

function plushReadBox(){if(!D.concept.hasImage)return'';return`<section class="readbox" id="readBox"><h4>From the concept's picture</h4>${RDBUSY?'<p class="note">Reading the plush in the picture…</p>':RD?`<p class="note">${RD.source==='vision'?'Read by eye (AI), over the concept\'s words':'From the concept\'s words'}${RD.why?`: ${esc(RD.why)}`:''}</p>${RD.changes.length?RD.changes.map(c=>`<div class="find info"><i></i><span><b>${esc(PLABEL[c.key]||c.key)}</b>: ${esc(pshow(c.key,c.from))} → ${esc(pshow(c.key,c.to))}</span></div>`).join(''):'<p class="note">The plush already matches the picture.</p>'}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn go sm" type="button" id="useRead">Use it</button><button class="btn q sm" type="button" id="dropRead">Not now</button></div>`:`<p class="note">Read the shape, the height, the ears, arms, legs and tail, the pile, the eyes and the colours from the picture, and draft the pattern to them.</p><button class="btn go sm" type="button" id="readPic" style="justify-self:start">Read the plush from the picture</button>`}</section>`}
// a photo-real picture of it as patterned: the tech flats go to the image model, and the sample it draws becomes the concept's picture
let RENDERING=false;
// the tech flats into the tech pack, once the concept is one (its outside and inside are the pack's lateral and medial, a plush's front and back)
function packBox(){if(!D.concept.productId)return'';return`<section id="packBox"><h4>The tech pack</h4><p class="note">Send the tech flats (every view), the pattern's notes and the materials to the tech pack. Save the pattern first: the pack takes what is saved.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn go sm" type="button" id="toPack">Send to the tech pack</button><a class="btn q sm" href="/tech-packs/${esc(D.concept.productId)}" target="_top">Open the tech pack</a></div></section>`}
function renderBox(){return packBox()+`<section class="readbox" id="renderBox"><h4>See it made</h4><p class="note">A photo-real picture of the ${D.kind==='plush'?'plush':'shoe'} as it is patterned now, in the materials on its parts, drawn from its tech flats. It becomes the concept's picture${D.concept.status==='approved'?' (and the concept goes back to draft)':''}.</p><button class="btn go sm" type="button" id="renderIt" style="justify-self:start"${RENDERING?' disabled':''}>${RENDERING?'Drawing it…':'Make it photo-real'}</button></section>`}
async function renderIt(){RENDERING=true;paintSide();try{const r=await api(`/v1/lab/concepts/${CID}/pattern/render`,{body:{spec:SPEC}});D.concept.hasImage=true;if(r.backToDraft)D.concept.status='draft';toast('The photo-real picture is the concept\'s picture now'+(r.backToDraft?': the concept is back to draft':''));HOST()?.pictureChanged?.()}catch(err){toast(err.message)}finally{RENDERING=false;paintSide()}}
async function readPicture(){RDBUSY=true;paintSide();try{RD=await api(`/v1/lab/concepts/${CID}/pattern/from-picture`,{method:'POST',body:{}})}catch(err){RD=null;toast(err.message)}finally{RDBUSY=false;paintSide()}}
// the developer's review: a second AI checks the four views against the picture round by round (src/lab-shoe-review.js); the page follows it
async function startReview(){RV={status:'running',rounds:[],starting:true};paintSide();try{const r=await api(`/v1/lab/concepts/${CID}/pattern/review`,{method:'POST',body:{spec:SPEC}});RV={status:'running',rounds:[],id:r.id,reviewer:r.reviewer};paintSide();pollReview(r.id)}catch(err){RV=null;paintSide();toast(err.message)}}
async function pollReview(id){while(RV&&RV.id===id&&RV.status==='running'){await new Promise(r=>setTimeout(r,1200));if(!RV||RV.id!==id)return;try{const j=await api(`/v1/lab/concepts/${CID}/pattern/review/${id}`);RV={...j,reviewer:RV.reviewer};paintSide()}catch(err){RV=null;paintSide();toast(err.message);return}}}
function revBox(){const crit=r=>`<div class="rvround"><div class="rvhead"><b>Round ${r.n}</b>${(r.judges||[]).length>1?`<span class="rvjudges">${r.judges.map(j=>`${esc(j.name)} ${j.score}`).join(' · ')}</span>`:''}<span class="rvscore${r.score>=(RV.bar||90)?' ok':''}">${r.score}/100</span></div>${r.disagree?`<div class="find warn"><i></i><span>The judges are ${Math.max(...r.judges.map(j=>j.score))-r.score} points apart: worth a look by a person</span></div>`:''}${(r.missed||[]).length?`<p class="note dim">${esc(r.missed.join(' and '))} could not answer this round</p>`:''}${r.summary?`<p class="note">${esc(r.summary)}</p>`:''}<div class="rvcrit">${r.criteria.map(c=>`<span title="${esc(c.note)}"><i style="width:${c.score}%"></i><em>${esc(c.label)}</em><b>${c.score}</b></span>`).join('')}</div>${r.changes?.length?r.changes.map(c=>`<div class="find info"><i></i><span><b>${esc(LABEL[c.key.replace(/^colours\..*/,'colours')]||c.key)}</b>: ${esc(show(c.key.replace(/^colours\..*/,'colours'),c.key.startsWith('colours.')?{[c.key.slice(8)]:c.from}:c.from))} → ${esc(show(c.key.replace(/^colours\..*/,'colours'),c.key.startsWith('colours.')?{[c.key.slice(8)]:c.to}:c.to))}${c.why?` <span class="dim">· ${esc(c.why)}</span>`:''}${(c.judges||[]).length?` <span class="dim">(${c.judges.length>1?'both':esc(c.judges[0])})</span>`:''}</span></div>`).join(''):''}${(r.conflicts||[]).map(x=>`<div class="find warn"><i></i><span><b>${esc(LABEL[x.field.replace(/^colours\..*/,'colours')]||x.field)}</b>: ${x.asks.map(a=>`${esc(a.name)} says ${esc(a.value)}`).join(', ')}: left as it is, for a person</span></div>`).join('')}</div>`;
  if(!RV)return`<section class="readbox" id="revBox"><h4>Developer check</h4><p class="note">Claude and ChatGPT, each briefed as a footwear developer, compare the four views with the concept's picture on their own and score them out of 100; the stricter score stands. The shoe is changed where they agree, round after round, until it clears 90 or needs a person. Nothing is kept until you use it.</p><button class="btn go sm" type="button" id="revStart" style="justify-self:start">Check against the picture</button></section>`;
  const out=RV.outline,o=out?`${(out.changes||[]).length?`<p class="note"><b>The outline</b> (measured, no AI):</p>${out.changes.map(c=>`<div class="find info"><i></i><span><b>${esc(LABEL[c.key]||c.key)}</b>: ${esc(show(c.key,c.from))} → ${esc(show(c.key,c.to))}</span></div>`).join('')}`:''}${(out.checks||[]).map(c=>`<div class="find ${c.ok===false?'warn':c.ok?'info':''}"><i></i><span>${esc(c.label)}: ${esc(c.detail)}</span></div>`).join('')}`:'';
  if(RV.status==='running')return`<section class="readbox" id="revBox" aria-busy="true"><h4>Developer check</h4>${o}${RV.rounds.map(crit).join('')}<p class="note">${RV.starting?'Starting…':RV.reviewer===false?'Measuring the outline…':`The developer is looking at round ${RV.rounds.length+1}…`}</p></section>`;
  if(RV.status==='failed')return`<section class="readbox" id="revBox"><h4>Developer check</h4><p class="note">${esc(RV.error||'The review could not finish')}</p><button class="btn go sm" type="button" id="revStart">Try again</button></section>`;
  const verdict=RV.result==='passed'?'ok':RV.result==='needs-person'?'warn':'';
  return`<section class="readbox" id="revBox"><h4>Developer check</h4><p class="rvverdict ${verdict}" id="revVerdict">${esc(RV.note||'')}</p>${o}${RV.rounds.map(crit).join('')}${(RV.beyondDrawing||[]).length?`<p class="note"><b>For a person</b> (the drawing cannot show it):</p>${RV.beyondDrawing.map(b=>`<div class="find warn"><i></i><span>${esc(b)}</span></div>`).join('')}`:''}<div style="display:flex;gap:8px;flex-wrap:wrap">${(RV.changes||[]).length?`<button class="btn go sm" type="button" id="revUse">Use it (${RV.changes.length} change${RV.changes.length===1?'':'s'})</button>`:''}<button class="btn q sm" type="button" id="revDrop">${(RV.changes||[]).length?'Not now':'Close'}</button></div></section>`}

${D.concept.hasImage?revBox():''}${renderBox()}${matsBox()}${logosBox()}${sketchBox()}

    ${VIEWKEYS().map(v=>{const u=UL[v];return`<div class="skrow"><b>${VNAME[v]}</b><span class="dim">${by(v)} line${by(v)===1?'':'s'}</span>${by(v)?`<button class="btn sm q" type="button" data-skclear="${v}">Clear</button>`:''}<label class="btn sm q" title="A photo or scan of a hand drawing, laid under this view">${u?'Replace paper sketch':'Paper sketch…'}<input type="file" accept="image/*" data-ulv="${v}" class="hidden"></label>${u?`<button class="btn sm q" type="button" data-ulrm="${v}">Remove it</button><label class="skr">Size<input type="range" min="2" max="24" step=".1" value="${u.place.w}" data-ulw="${v}" aria-label="Size of the paper sketch under the ${VNAME[v].toLowerCase()} view"></label><label class="skr">Show<input type="range" min=".05" max="1" step=".05" value="${u.place.opacity}" data-ulo="${v}" aria-label="How strongly the paper sketch shows"></label>`:''}</div>`}).join('')}</section>`}
$('#side').addEventListener('click',e=>{const tr=e.target.closest('[data-trace]');if(tr){const l=modelLines(PAT).find(x=>x.key===tr.dataset.trace);if(!l)return;const id=skId();setSketches([...(SPEC.sketches||[]),{id,on:'lateral',pts:l.pts.map(q=>[q[0],q[1],1]),c:INKS.blue,size:.03}]);if(!SK.on)$('#skBtn').click();SK.tool='shape';SK.sel=id;skTools();drawPieces();toast(`The ${l.label.toLowerCase()} is traced on the outside as a blue hand line: bend it, make it a seam, or make it the model's line again`);return}
  const c=e.target.closest('[data-skclear]');if(c){setSketches((SPEC.sketches||[]).filter(k=>k.on!==c.dataset.skclear));toast(`The ${VNAME[c.dataset.skclear].toLowerCase()}'s lines are cleared: Undo brings them back`);return}
  const r=e.target.closest('[data-ulrm]');if(r){const v=r.dataset.ulrm;api(`/v1/lab/concepts/${CID}/pattern/underlays/${v}`,{method:'DELETE'}).then(()=>{delete UL[v];drawPieces();paintSide();toast('Paper sketch removed')}).catch(err=>toast(err.message))}});
$('#side').addEventListener('change',async e=>{const f=e.target.closest('[data-ulv]');if(f&&f.files?.[0]){const v=f.dataset.ulv,file=f.files[0];if(file.size>15e6){toast('That picture is over 15 MB');return}
    const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)}),it=LV?.items.find(i=>i.key===v),b=it?{x:Math.round((it.box.x0-it.dx)*1000)/1000,y:Math.round((it.box.y0-it.dy)*1000)/1000,w:Math.round((it.box.x1-it.box.x0)*1000)/1000}:{x:0,y:0,w:11};
    toast('Laying the sketch under the view…');try{await api(`/v1/lab/concepts/${CID}/pattern/underlays/${v}`,{method:'PUT',body:{image:data,place:{...(UL[v]?.place||b),opacity:UL[v]?.place.opacity||.55}}});await loadUnderlays();if(!SK.on)$('#skBtn').click();toast(`The sketch is under the ${VNAME[v].toLowerCase()} view: Move sketch to line it up`)}catch(err){toast(err.message)}return}
  const w=e.target.closest('[data-ulw],[data-ulo]');if(w){const v=w.dataset.ulw||w.dataset.ulo,u=UL[v];if(!u)return;u.place={...u.place,[w.dataset.ulw?'w':'opacity']:Number(w.value)};drawPieces();api(`/v1/lab/concepts/${CID}/pattern/underlays/${v}`,{method:'PATCH',body:{place:u.place}}).catch(err=>toast(err.message))}});

// footwear: the size picker lists the size run, the sample size first chosen
function fwSizes(){const run=sizeRun(SPEC).map(r=>r.size);if(!run.some(v=>String(v)===String(SIZE)))SIZE=SPEC.size;const all=[...new Set([...run,SPEC.size])].sort((a,b)=>a-b);$('#size').classList.remove('hidden');$('#size').innerHTML=all.map(v=>`<option value="${v}"${String(v)===String(SIZE)?' selected':''}>Size ${v}</option>`).join('')}
async function boot(){
  if(!/^[0-9a-f-]{36}$/i.test(CID)){$('#main').innerHTML='<div class="empty"><b>Open a concept in Design to see its pattern.</b></div>';return}
  try{D=await api(`/v1/lab/concepts/${CID}/pattern`)}catch(err){$('#main').innerHTML=`<div class="empty"><b>The pattern could not be opened.</b><p class="note">${esc(err.message)}</p></div>`;return}
  $('#ttl').textContent=D.concept.name;
  if(D.kind==='soon'||D.kind==='none'){$('#sub').textContent='Pattern';$('#modeSeg').classList.add('hidden');$$('#play,#size,#dxf,#svgDl').forEach(x=>x.classList.add('hidden'));
    $('#main').innerHTML=`<div class="empty"><b>${D.kind==='soon'?esc(D.soon):'The Lab cannot draft a pattern for this piece yet.'}</b><p class="note">${D.kind==='soon'?'Until then the tech pack carries its specification, and you can draw it on the Picture.':'Set what the piece is on the Flat front (the style), and its pattern pieces appear here.'}</p></div>`;return}
  SPEC=D.spec;SIZE=D.flat?.size||'M';if(D.kind==='plush'||D.kind==='footwear')logoHrefs().then(()=>drawPieces());MATS=matsOf([...(D.materials||[]),...(D.allMaterials||[])]);if((D.parts||[]).length)mLib().then(()=>paintSide()).catch(()=>{});const S=D.flat?STYLES[D.flat.style]:null;
  if(D.kind==='plush'){$('#skBtn').classList.remove('hidden');loadUnderlays();if(D.concept.hasImage&&!D.saved)setTimeout(readPicture,50)}
  if(D.kind==='footwear'){SIZE=SPEC.size;fwSizes();l3Refresh();$('#lastBtn').classList.remove('hidden');$('#skBtn').classList.remove('hidden');loadUnderlays();if(D.concept.hasImage){loadPic();if(!D.saved)setTimeout(readPicture,50)}}
  else if(D.kind==='garment'&&!S?.oneSize)$('#size').innerHTML=D.options.sizes.map(s=>`<option${s===SIZE?' selected':''}>${s}</option>`).join('');else $('#size').classList.add('hidden');
  build();$('#sub').textContent=`Pattern · ${PAT.label} · ${PAT.size} · ${PAT.pieces.filter(q=>q.cut>0).length} pieces`;
  T=new URLSearchParams(location.search).get('t')==='1'?1:0;$('#t').value=T;drawPieces();paintSide();
  window.FBPattern={logos:()=>SPEC.logos||[],logoAt:id=>{const g=document.querySelector(`#canvas [data-logo="${id}"]`);if(!g)return null;const r=g.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]},ready:()=>true,dirty:()=>DIRTY,sketches:()=>SPEC.sketches||[],spec:()=>SPEC,lines:()=>modelLines(PAT),handleAt:(view,key)=>{const it=LV?.items.find(i=>i.key===view),l=modelLines(PAT).find(x=>x.key===key),s=$('#canvas svg');if(!it||!l||!s)return null;const q=new DOMPoint(...handleAt(it,l)).matrixTransform(s.getScreenCTM());return[q.x,q.y]},sideAt:(view,pt)=>{const it=LV?.items.find(i=>i.key===view),s=$('#canvas svg');if(!it||!s)return null;const q=new DOMPoint(...viewTf(it)(pt)).matrixTransform(s.getScreenCTM());return[q.x,q.y]},materials:()=>MATS,viewAt:(key,pt)=>{const it=LV?.items.find(i=>i.key===key),s=$('#canvas svg');if(!it||!s)return null;const m=s.getScreenCTM(),q=new DOMPoint(pt[0]+it.dx,pt[1]+it.dy).matrixTransform(m);return[q.x,q.y]},explode:()=>goTo(1,3200),at:t=>{T=t;$('#t').value=t;drawPieces()},pattern:()=>PAT,lastAt:(side,pt)=>{if(!LPROJ)return null;const p=LPROJ.pr(onSurface(LPROJ.sh[side],pt));return[p[0],p[1]]}};
}
boot();
</script>
