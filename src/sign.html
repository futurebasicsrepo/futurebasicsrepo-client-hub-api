<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Review and sign — Future Basics</title><link rel="icon" href="/icons/techpack-v3-192.png" type="image/png"><meta name="theme-color" content="#141416">
  <style>
    @import url('/fonts/fonts.css');
    :root{--ink:#141416;--paper:#fff;--fog:#f5f5f2;--dim:#6e6e75;--line:rgba(20,20,22,.14);--cue:#4bff9a;--ok:#17603a;--bad:#a02a20;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}html{background:var(--fog);scroll-behavior:smooth}body{margin:0;color:var(--ink);font:400 16px/1.55 'Space Grotesk',system-ui,sans-serif;background:var(--fog);min-height:100vh}
    button,input,textarea{font:inherit}.hidden{display:none!important}
    header{height:60px;background:var(--ink);color:#fff;padding:0 clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
    .wm{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}.wm i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cue);margin-left:6px}
    header a{color:#fff;text-decoration:none;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border:1px solid rgba(255,255,255,.3);border-radius:999px}
    main{max-width:780px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(14px,4vw,28px) 150px}
    .meta{font:500 10px/1.35 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.15em;color:var(--dim)}
    h1{font-weight:500;letter-spacing:-.04em;line-height:1;font-size:clamp(30px,7vw,48px);margin:8px 0 6px;text-wrap:balance}
    .sub{color:var(--dim);margin:0 0 18px}
    .banner{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--paper);margin:0 0 18px}.banner b{display:block;font-weight:600}
    .banner.ok{border-color:#9ad9b4;background:#effaf3}.banner.warn{border-color:#e6d27a;background:#fffbea}.banner.bad{border-color:#e6a8a0;background:#fff4f2}
    .parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}.parties div{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
    .parties b{display:block;font-weight:500;font-size:17px;margin-top:2px}.parties small{display:block;color:var(--dim);font-size:13px;white-space:pre-line}
    @media(max-width:560px){.parties{grid-template-columns:1fr}}
    .fee{background:var(--ink);color:#fff;border-radius:22px;padding:20px 22px;margin:0 0 14px;display:grid;gap:4px}.fee .meta{color:#9d9da4}.fee b{font-weight:500;font-size:clamp(30px,8vw,44px);letter-spacing:-.03em;line-height:1}.fee span{color:#cfcfd4}
    .pay{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 20px}.pay h2{margin:0 0 4px;font-size:17px;font-weight:500}.pay p{margin:0 0 10px;color:var(--dim);font-size:14px}
    table{width:100%;border-collapse:collapse;font-size:14.5px}th{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 0;border-bottom:1px solid var(--line)}td{padding:8px 0;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
    .doc{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);margin:0 0 22px}
    .doc section{margin:0 0 22px}.doc section:last-child{margin:0}.doc h3{font-size:17px;font-weight:600;margin:0 0 6px;display:flex;gap:10px;align-items:baseline}.doc h3 small{font:500 10px 'IBM Plex Mono',monospace;color:var(--dim);letter-spacing:.1em}
    .doc p{margin:0 0 10px;color:#26262a;max-width:68ch}.doc ul{margin:0 0 10px;padding-left:20px;color:#26262a}.doc li{margin:0 0 4px}.nope{color:var(--dim);font-size:14px}
    .sign{background:var(--paper);border:1px solid var(--ink);border-radius:24px;padding:clamp(18px,4vw,28px);scroll-margin-top:80px}
    .sign h2{margin:0 0 4px;font-size:24px;font-weight:500;letter-spacing:-.02em}.sign .lead{margin:0 0 16px;color:var(--dim)}
    label.f{display:block;margin:0 0 14px}label.f>span{display:block;font:500 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
    input[type=text],textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--fog);outline:none}input[type=text]:focus,textarea:focus{border-color:var(--ink);background:#fff}
    .hand{font:italic 500 26px/1.2 Georgia,'Times New Roman',serif!important}
    .chk{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--fog);cursor:pointer}.chk input{margin-top:4px;width:20px;height:20px;accent-color:var(--ink);flex:none}.chk span{font-size:14.5px}
    .opt{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}.opt label{flex:1;min-width:130px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--fog)}.opt input{accent-color:var(--ink)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;width:100%;font-size:16px}
    .btn:disabled{opacity:.4;cursor:not-allowed}.btn.light{background:#fff;color:var(--ink);width:auto;padding:11px 18px;font-size:14px}.btn.go{background:var(--cue);border-color:var(--ink);color:var(--ink)}
    .payform .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.payform .two>*,.payform .f{min-width:0}.payform input:not([type=checkbox]),.payform select{width:100%;max-width:100%;box-sizing:border-box}.payform .testnote{background:#fff7d6;border:1px solid #e6d27a;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}.payform .opt{margin:6px 0 12px}.payform small.hint{display:block;color:var(--dim);font-size:13px;margin:-4px 0 12px}.onfile{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}.onfile b{font-weight:500}
    .msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--bad)}
    .linkbtn{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
    .bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(20,20,22,.97);color:#fff;padding:12px clamp(14px,4vw,28px) calc(12px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center;justify-content:space-between}
    .bar b{font-weight:500;font-size:20px;letter-spacing:-.02em}.bar small{display:block;color:#a9a9b0;font-size:12px}.bar .btn{width:auto;background:var(--cue);color:var(--ink);padding:12px 20px;font-size:15px}
    .done{text-align:center;padding:30px 10px}.done h2{font-size:30px;font-weight:500;margin:6px 0}.done p{color:var(--dim);margin:0 0 16px}.tick{width:58px;height:58px;border-radius:50%;background:var(--cue);border:2px solid var(--ink);display:inline-grid;place-items:center;font-size:30px}
    .center{max-width:520px;margin:60px auto;text-align:center;padding:0 18px}.center h1{font-size:34px}
    @media print{header,.bar,.sign,.noprint{display:none!important}body{background:#fff}main{padding:0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<header><span class="wm">Future Basics<i></i></span><a href="#" id="pdfTop" class="noprint hidden" target="_blank" rel="noopener">PDF</a></header>
<div id="state" class="center"><p class="meta">One moment</p><h1>Opening your agreement…</h1></div>
<main id="app" class="hidden"></main>
<div class="bar hidden" id="bar"><div><small>Fixed fee</small><b id="barFee"></b></div><a class="btn" href="#sign" id="barBtn">Review and sign</a></div>
<script>
(()=>{
  const TOKEN=decodeURIComponent(location.pathname.replace(/^\/sign\//,'').replace(/\/$/,''));
  const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const api=async(path,o={})=>{const r=await fetch(`/v1/public/contracts/${encodeURIComponent(TOKEN)}${path}`,{method:o.body?'POST':'GET',headers:o.body?{'content-type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong');e.status=r.status;throw e}return j};
  const paras=t=>String(t||'').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
  const when=d=>d?new Date(d).toLocaleString('en-US',{dateStyle:'long',timeStyle:'short'}):'';
  const day=d=>d?new Date(d).toLocaleDateString('en-US',{dateStyle:'long'}):'';
  const total=r=>r.fee&&r.sections.find(s=>s.kind==='fee');
  function showState(h,p,extra=''){$('#app').classList.add('hidden');$('#bar').classList.add('hidden');const s=$('#state');s.classList.remove('hidden');s.innerHTML=`<p class="meta">Future Basics</p><h1>${esc(h)}</h1><p class="sub">${esc(p)}</p>${extra}`}
  function section(s,i){
    let h=`<section id="s-${esc(s.id)}"><h3><small>${String(i+1).padStart(2,'0')}</small>${esc(s.title)}</h3>`;
    if(s.kind!=='schedule'&&s.body)h+=paras(s.body);
    if(s.kind==='scope'){h+=`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(s.notIncluded&&s.notIncluded.length)h+=`<p class="nope"><b>Not included:</b> ${s.notIncluded.map(esc).join('; ')}</p>`}
    if(s.kind==='timeline')h+=`<table><tbody>${s.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
    if(s.kind==='fee')h+=`<p><b>${esc(s.totalText)}</b></p>`;
    if(s.kind==='schedule'){h+=`<p><b>${esc(s.summary)}</b></p><table><thead><tr><th>Payment</th><th>Due</th><th class="n">Amount</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.when)}</td><td class="n">${esc(r.amountText)}</td></tr>`).join('')}</tbody></table>`+paras(s.body)}
    return h+'</section>';
  }
  function render(c){
    const r=c.rendered,P=r.parties,fee=r.sections.find(s=>s.kind==='fee'),sch=r.sections.find(s=>s.kind==='schedule');
    document.title=`${c.title} — sign`;
    const sigs=`${c.providerSignature?`<p>Signed for ${esc(P.provider.name)} by <b>${esc(c.providerSignature.name)}</b> on ${esc(when(c.providerSignature.at))}.</p>`:''}${c.clientSignature?`<p>Signed for ${esc(P.client.company)} by <b>${esc(c.clientSignature.name)}</b> on ${esc(when(c.clientSignature.at))}.</p>`:''}`;
    let top='';
    if(c.status==='executed')top=`<div class="banner ok"><b>Signed by both parties</b>This is your copy. Download the PDF and keep it with your records.${sigs}</div>`;
    else if(c.status==='signed_by_client')top=`<div class="banner ok"><b>You have signed. Thank you.</b>It becomes final when ${esc(P.provider.name)} signs too. We will email you a copy.${sigs}</div>`;
    else if(c.status==='declined')top=`<div class="banner bad"><b>This agreement was declined</b>If that was a mistake, ask ${esc(P.provider.name)} to send it again.</div>`;
    else if(c.status==='expired')top=`<div class="banner warn"><b>This link has expired</b>Ask ${esc(P.provider.name)} to send a fresh copy of the agreement.</div>`;
    else if(c.expiresAt)top=`<div class="banner"><b>Please review and sign by ${esc(day(c.expiresAt))}</b>Read the agreement below, then sign at the bottom. It takes a couple of minutes.</div>`;
    $('#app').innerHTML=`<p class="meta">Agreement · ${esc(c.number)}</p><h1>${esc(c.title)}</h1><p class="sub">Prepared for ${esc(P.client.company)} by ${esc(P.provider.name)}</p>${top}<div id="payBox"></div>
      <div class="parties"><div><span class="meta">From</span><b>${esc(P.provider.name)}</b><small>${esc(P.provider.address)}</small></div><div><span class="meta">For</span><b>${esc(P.client.company)}</b><small>${esc(P.client.address)}</small></div></div>
      <div class="fee"><span class="meta">Fixed fee</span><b>${esc(fee.totalText)}</b><span>${esc(sch.summary)}</span></div>
      <div class="pay"><h2>What you pay, and when</h2><p>${esc(sch.method==='invoice'?'You receive an invoice for each payment.':sch.autopay?'Paid automatically by '+(sch.method==='ach'?'ACH bank debit':sch.method==='card'?'card':'ACH or card, your choice')+' on file.':'Paid by '+(sch.method==='ach'?'ACH bank debit':sch.method==='card'?'card':'ACH or card')+', requested on each due date.')}</p>
        <table><thead><tr><th>Payment</th><th>Due</th><th class="n">Amount</th></tr></thead><tbody>${sch.rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.when)}</td><td class="n">${esc(x.amountText)}</td></tr>`).join('')}</tbody></table></div>
      <div class="doc" id="doc">${r.sections.map(section).join('')}</div><div id="signBox"></div>`;
    $('#state').classList.add('hidden');$('#app').classList.remove('hidden');
    const pdf=$('#pdfTop');pdf.href=`/v1/public/contracts/${encodeURIComponent(TOKEN)}/pdf`;pdf.classList.remove('hidden');
    if(c.pay)payForm(c);
    if(c.canSign){signForm(c);$('#barFee').textContent=fee.totalText;$('#bar').classList.remove('hidden')}
    else{$('#bar').classList.add('hidden');if(c.status==='executed'||c.status==='signed_by_client')$('#signBox').innerHTML=`<div class="sign done"><div class="tick">✓</div><h2>${c.status==='executed'?'Fully signed':'Waiting for '+esc(P.provider.name)}</h2><p>${c.status==='executed'?'Both parties have signed this agreement.':'You will get an email when it is final.'}</p><a class="btn light" href="${pdf.href}" target="_blank" rel="noopener">Download the PDF</a></div>`}
  }
  // Payment details for automatic payments. The number goes from this page straight to the payment provider, which sends back a one-time token: only the token reaches us.
  const luhn=n=>{const d=String(n).replace(/\D/g,'');if(d.length<12||d.length>19)return false;let t=0;for(let i=0;i<d.length;i++){let x=+d[d.length-1-i];if(i%2){x*=2;if(x>9)x-=9}t+=x}return t%10===0};
  const aba=n=>{const d=String(n).replace(/\D/g,'');if(d.length!==9)return false;const a=[...d].map(Number);return(3*(a[0]+a[3]+a[6])+7*(a[1]+a[4]+a[7])+(a[2]+a[5]+a[8]))%10===0};
  const digits=v=>String(v||'').replace(/\D/g,'');
  // typing helpers: the card number is grouped as people read it, the expiry gets its slash, and every number box takes digits only
  const fmtCard=v=>{const d=digits(v).slice(0,19);return /^3[47]/.test(d)?[d.slice(0,4),d.slice(4,10),d.slice(10,15)].filter(Boolean).join(' '):(d.match(/.{1,4}/g)||[]).join(' ')};
  const fmtExp=(v,back)=>{let d=digits(v).slice(0,6);if(d.length>=5)return d.slice(0,2)+'/'+d.slice(-2);d=d.slice(0,4);if(d.length===1&&+d>1)d='0'+d;return d.length>=3?d.slice(0,2)+'/'+d.slice(2):(d.length===2&&!back?d+'/':d)};
  function payForm(c){
    const p=c.pay,box=$('#payBox'),card=p.kind==='card',what=card?'card':'bank account';
    const sched=`<table><thead><tr><th>Payment</th><th>Due</th><th class="n">Amount</th></tr></thead><tbody>${(p.upcoming||[]).map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.state==='paid'?'Paid':x.falls?day(x.falls+'T12:00:00'):'On delivery')}</td><td class="n">${esc(new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x.amountCents/100))}</td></tr>`).join('')}</tbody></table>`;
    if(p.method){
      box.innerHTML=`<div class="sign payform"><h2>Automatic payments are set up</h2><div class="onfile"><p style="margin:0">Each payment is taken from your <b>${esc(p.method.label)}</b> on its due date. We email a receipt each time${p.paused?'. <b>Automatic payments are paused right now.</b>':'.'}</p><button type="button" class="btn light" id="pChange" style="width:auto">Change ${what}</button></div><div id="pForm" class="hidden"></div></div>`;
      $('#pChange').onclick=()=>{$('#pForm').classList.toggle('hidden');if(!$('#pForm').innerHTML)form($('#pForm'),p,c)};return}
    if(!p.ready){box.innerHTML=`<div class="banner warn"><b>One more step: your ${what}</b>Payment details cannot be taken just yet. We have been told, and will email you the moment you can add them.</div>`;return}
    box.innerHTML=`<div class="sign payform"><h2>Add your ${what}</h2><p class="lead">This is the last step. Your ${what} is used only for the payments in this agreement, shown below. The number goes straight to our payment provider: we never see it or keep it.</p>${sched}${p.testMode&&card?'<p class="testnote"><b>Test mode.</b> Real cards are refused here. Use the test card <b>4111 1111 1111 1111</b>, any future expiry, any 3-digit code and any ZIP.</p>':''}<div id="pForm"></div></div>`;form($('#pForm'),p,c);
  }
  function form(el,p,c){
    const card=p.kind==='card';
    el.innerHTML=`<form id="pf" autocomplete="on" novalidate>${card?`
      <label class="f"><span>Name on card</span><input id="cName" autocomplete="cc-name" required></label>
      <label class="f"><span>Card number</span><input id="cNum" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23" required></label>
      <div class="two"><label class="f"><span>Expiry (MM/YY)</span><input id="cExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="7" required></label><label class="f"><span>Security code</span><input id="cCvc" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123" required></label></div>
      <label class="f"><span>Billing ZIP code</span><input id="cZip" inputmode="numeric" autocomplete="postal-code" maxlength="10" required></label>`:`
      <label class="f"><span>Name on the account</span><input id="bName" autocomplete="name" required></label>
      <div class="two"><label class="f"><span>Routing number (9 digits)</span><input id="bRoute" inputmode="numeric" maxlength="9" required></label><label class="f"><span>Account number</span><input id="bNum" inputmode="numeric" maxlength="17" autocomplete="off" required></label></div>
      <label class="f"><span>Account type</span><select id="bType"><option value="BUSINESS_CHECKING">Business checking</option><option value="BUSINESS_SAVINGS">Business savings</option><option value="PERSONAL_CHECKING">Personal checking</option><option value="PERSONAL_SAVINGS">Personal savings</option></select></label>
      <label class="f"><span>Phone number</span><input id="bPhone" inputmode="tel" autocomplete="tel" required></label>`}
      <label class="chk"><input type="checkbox" id="pAuth"><span>${esc(p.authorization)}</span></label>
      <button class="btn go" id="pGo" disabled>Save ${card?'card':'bank account'}</button><p class="msg" id="pMsg" role="alert"></p></form>`;
    const f=$('#pf'),ready=()=>{$('#pGo').disabled=!$('#pAuth').checked};f.addEventListener('input',ready);f.addEventListener('change',ready);
    // reformat as people type, keeping the cursor next to the digit they just typed (so fixing a digit in the middle works, and the cursor never jumps)
    const only=(id,fn)=>{const el=$(id);if(!el)return;el.addEventListener('input',e=>{
      const back=e.inputType==='deleteContentBackward',pos=el.selectionStart==null?el.value.length:el.selectionStart,before=digits(el.value.slice(0,pos)).length,atEnd=pos>=el.value.length;
      const v=fn(el.value,back);if(v===el.value)return;el.value=v;
      if(atEnd)return;let n=0,i=0;for(;i<v.length&&n<before;i++)if(/\d/.test(v[i]))n++;try{el.setSelectionRange(i,i)}catch{}})};
    only('#cNum',fmtCard);only('#cExp',fmtExp);only('#cCvc',v=>digits(v).slice(0,4));only('#cZip',v=>String(v).replace(/[^\d-]/g,'').slice(0,10));only('#bRoute',v=>digits(v).slice(0,9));only('#bNum',v=>digits(v).slice(0,17));only('#bPhone',v=>digits(v).slice(0,10));
    const fail=m=>{$('#pMsg').textContent=m;$('#pGo').disabled=false;$('#pGo').textContent='Save '+(card?'card':'bank account')};
    f.addEventListener('submit',async e=>{e.preventDefault();$('#pMsg').textContent='';let tokenBody;
      if(card){const num=digits($('#cNum').value),ed=digits($('#cExp').value),m=ed.length===4||ed.length===6?[0,ed.slice(0,2),ed.slice(2)]:null;
        if($('#cName').value.trim().length<2)return fail('Enter the name on the card');if(num.length<13)return fail('A card number has 15 or 16 digits: you have entered '+num.length+'.');if(!luhn(num))return fail('That card number does not look right: check each digit.');if(!m||+m[1]<1||+m[1]>12)return fail('Enter the expiry as MM/YY');
        const yr=m[2].length===2?'20'+m[2]:m[2];if(new Date(+yr,+m[1],1)<=new Date())return fail('That card has expired');if(!/^\d{3,4}$/.test($('#cCvc').value))return fail('Enter the security code from the card');if(!/^\d{5}(-\d{4})?$/.test($('#cZip').value.trim()))return fail('Enter the 5-digit billing ZIP code');
        tokenBody={card:{number:num,expMonth:m[1].padStart(2,'0'),expYear:yr,cvc:$('#cCvc').value,name:$('#cName').value.trim(),address:{postalCode:$('#cZip').value.trim().slice(0,5),country:'US'}}}}
      else{if($('#bName').value.trim().length<2)return fail('Enter the name on the account');if(!aba($('#bRoute').value))return fail('That routing number does not look right: it is the 9 digits at the bottom left of a check');if(!/^\d{4,17}$/.test($('#bNum').value.replace(/\s+/g,'')))return fail('Enter the account number');if($('#bPhone').value.replace(/\D/g,'').length<10)return fail('Enter a phone number with area code');
        tokenBody={bankAccount:{name:$('#bName').value.trim(),routingNumber:$('#bRoute').value.replace(/\D/g,''),accountNumber:$('#bNum').value.replace(/\s+/g,''),accountType:$('#bType').value,phone:$('#bPhone').value.replace(/\D/g,'').slice(-10)}}}
      $('#pGo').disabled=true;$('#pGo').textContent='Saving…';
      try{
        const tr=await fetch(p.tokensUrl,{method:'POST',headers:{'content-type':'application/json','request-id':crypto.randomUUID()},body:JSON.stringify(tokenBody)}).catch(()=>null);tokenBody=null;
        const tj=tr?await tr.json().catch(()=>({})):{};if(!tr||!tr.ok||!tj.value){const said=String((tj.errors&&tj.errors[0]&&(tj.errors[0].detail||tj.errors[0].message))||'').slice(0,160).replace(/\.$/,'');return fail(tr&&tr.status<500?'Those details were not accepted'+(said?' ('+said+')':'')+'. Check them and try again.':'Could not reach the payment service. Try again in a minute.')}
        for(const i of f.querySelectorAll('input'))if(i.type!=='checkbox')i.value='';
        await api('/payment-method',{body:{kind:p.kind,token:tj.value}});const d=await api('');render(d);toast('Saved. Your automatic payments are set up.')}
      catch(x){fail(x.message)}});
  }
  function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#141416;color:#fff;padding:12px 18px;border-radius:10px;z-index:30;font-size:15px';document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
  function signForm(c){
    const sg=c.signer,pl=c.plan;
    $('#signBox').innerHTML=`<form class="sign" id="sign" autocomplete="off"><h2>Sign this agreement</h2><p class="lead">Type your full name to sign. It is your signature, with the same effect as signing on paper.</p>
      <label class="f"><span>Your full name</span><input type="text" id="sName" class="hand" placeholder="${esc(sg.name||'Full name')}" autocapitalize="words" required></label>
      <label class="f"><span>Your title (optional)</span><input type="text" id="sTitle" placeholder="${esc(sg.title||'Owner')}"></label>
      ${pl.method==='either'?`<div class="meta" style="margin-bottom:6px">How would you like to pay?</div><div class="opt"><label><input type="radio" name="m" value="ach"> ACH bank debit</label><label><input type="radio" name="m" value="card"> Card</label></div>`:''}
      ${pl.autopay?`<label class="chk"><input type="checkbox" id="sAuto"><span>I authorize the automatic payments described in the payment schedule. We email a receipt for each one, and I can cancel with three business days' notice.</span></label>`:''}
      <label class="chk"><input type="checkbox" id="sAgree"><span>I have read this agreement and agree to be bound by it.</span></label>
      <label class="chk"><input type="checkbox" id="sEsign"><span>I agree to sign electronically. I understand this has the same effect as a handwritten signature.</span></label>
      <button class="btn go" id="sGo" disabled>Sign the agreement</button><p class="msg" id="sMsg" role="alert"></p>
      <button type="button" class="linkbtn" id="dBtn">Something is not right? Decline or ask for changes</button>
      <div id="dBox" class="hidden"><label class="f"><span>What should change? (optional)</span><textarea id="dWhy" rows="3"></textarea></label><button type="button" class="btn light" id="dGo">Decline this agreement</button></div></form>`;
    const f=$('#sign'),ready=()=>{const need=$('#sName').value.trim().length>=2&&$('#sAgree').checked&&$('#sEsign').checked&&(!pl.autopay||$('#sAuto').checked)&&(pl.method!=='either'||f.querySelector('input[name=m]:checked'));$('#sGo').disabled=!need};
    f.addEventListener('input',ready);f.addEventListener('change',ready);
    f.addEventListener('submit',async e=>{e.preventDefault();$('#sGo').disabled=true;$('#sMsg').textContent='';
      try{const body={name:$('#sName').value,title:$('#sTitle').value,agree:$('#sAgree').checked,esign:$('#sEsign').checked};if(pl.autopay)body.autopay=$('#sAuto').checked;if(pl.method==='either')body.method=f.querySelector('input[name=m]:checked').value;
        const r=await api('/sign',{body});$('#bar').classList.add('hidden');const d=await api('');render(d);window.scrollTo({top:0,behavior:'smooth'})}
      catch(x){$('#sMsg').textContent=x.message;ready()}});
    $('#dBtn').onclick=()=>$('#dBox').classList.toggle('hidden');
    $('#dGo').onclick=async()=>{if(!confirm('Decline this agreement? '+c.rendered.parties.provider.name+' will be told.'))return;try{await api('/decline',{body:{reason:$('#dWhy').value}});showState('You declined this agreement','We have let '+c.rendered.parties.provider.name+' know.')}catch(x){$('#sMsg').textContent=x.message}};
  }
  (async()=>{
    try{const c=await api('');
      if(c.status==='void')return showState('This agreement is no longer open','It was replaced or withdrawn. Ask the sender for the current one.');
      render(c)}
    catch(x){showState(x.status===429?'Please wait a moment':'This link is not valid',x.message)}
  })();
})();
</script>
</body>
</html>
