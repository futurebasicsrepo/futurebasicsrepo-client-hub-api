<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chat with Future Basics</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/chat.css">
<style>
:root{--ink:#141416;--dim:#727278;--line:rgba(20,20,22,.14);--cue:#4bff9a;--fog:#f5f5f2;--bad:#9a2419}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:400 14px/1.45 'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ink);color:#fff}
.top .dot{width:9px;height:9px;border-radius:50%;background:var(--cue);flex:none}.top .dot.wait{background:#ffed90}.top .dot.off{background:#9a9aa0}
.top b{font-weight:600;display:block;line-height:1.2}.top small{display:block;color:#c9c9ce;font-size:12px}
.top .x{margin-left:auto;border:0;background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}.top .x:hover{background:rgba(255,255,255,.14)}
.top .x:focus-visible,.link:focus-visible,.go:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
#thread{flex:1;min-height:0;display:flex;flex-direction:column}
.strip{padding:10px 14px;border-top:1px solid var(--line);background:var(--fog);font-size:13px}.strip p{margin:0 0 8px}
.strip form{display:flex;gap:8px;flex-wrap:wrap}.strip input{flex:1;min-width:130px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.go{border:0;border-radius:999px;padding:9px 16px;background:var(--cue);color:var(--ink);font-weight:600;cursor:pointer}.go[disabled]{opacity:.5}
.link{border:0;background:none;padding:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 16px 0;background:#fff}
.msg{color:var(--bad);font-size:12.5px;min-height:0}.msg:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.off{padding:28px 20px;text-align:center;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><span class="dot" id="dot"></span><div><b>Future Basics</b><small id="sub">Ask us anything</small></div><button class="x" id="close" type="button" aria-label="Close chat">×</button></div>
<div class="bar hidden" id="bar" style="display:none"><span></span><button class="link" id="person" type="button">Talk to a person</button></div>
<div id="thread"></div>
<div class="strip" id="strip" style="display:none"><p id="stripText">Where can we reach you if you step away?</p><form id="contactForm"><input id="cName" placeholder="Your name" autocomplete="name" aria-label="Your name"><input id="cEmail" type="email" placeholder="you@company.com" autocomplete="email" aria-label="Your email" required><button class="go" type="submit">Send</button></form><p class="msg" id="cMsg" role="status"></p></div>
<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<script>window.FBCHAT_POLL_MS=5000</script>
<script src="/chat.js"></script>
<script>
const $=s=>document.querySelector(s),KEY='fb.chat.token',qs=new URLSearchParams(location.search);
const T={get(){try{return localStorage.getItem(KEY)||''}catch{return ''}},set(v){try{localStorage.setItem(KEY,v)}catch{}}};
const ctx={source:qs.get('source')==='showcase'?'showcase':'site',page:qs.get('page')||'',looking:''};
let STATE={conversation:null,messages:[],signedIn:false,email:'',greeting:'',enabled:true},chat=null,OPEN=false,seen=0;
async function api(path,o={}){const r=await fetch(path,{method:o.body!==undefined?'POST':(o.method||'GET'),headers:{...(o.body!==undefined?{'Content-Type':'application/json'}:{}),...(T.get()?{'x-chat-token':T.get()}:{})},body:o.body!==undefined?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong'),{status:r.status});return j}
const toThread=ms=>({messages:ms.filter(m=>m.author!=='system').map(m=>({id:m.id,author_role:m.author==='visitor'?'client':'staff',author_name:m.author==='visitor'?'':(m.author_name||'Future Basics'),body:m.body,created_at:m.created_at})),events:ms.filter(m=>m.author==='system').map(m=>({id:m.id,title:m.body,createdAt:m.created_at}))});
function paint(){
  const c=STATE.conversation,st=c?c.status:'bot';
  $('#dot').className='dot'+(st==='waiting'?' wait':st==='closed'?' off':'');
  $('#sub').textContent=!STATE.enabled?'Chat is off right now':st==='waiting'?'Waiting for a person':st==='person'?'You are talking with a person':st==='closed'?'This chat was closed':'The assistant will answer, or bring in a person';
  $('#bar').style.display=c&&st==='bot'&&STATE.enabled?'flex':'none';
  $('#strip').style.display=c&&c.needsEmail&&(st==='waiting'||st==='person')?'block':'none';
  if(chat)chat.update(toThread(STATE.messages),{toBottom:false});
  const n=STATE.messages.filter(m=>m.author!=='visitor'&&m.author!=='system').length;
  if(n>seen&&!OPEN)parent.postMessage({type:'fbchat-new'},'*');seen=n;
}
async function send({body}){
  const r=await api('/v1/chat/messages',{body:{body,source:ctx.source,page:ctx.page,looking:ctx.looking,website:$('#hp').value}});
  if(r.token)T.set(r.token);STATE.conversation=r.conversation;STATE.messages=r.messages||STATE.messages;paint();
}
async function refresh(){if(!T.get())return {messages:[],events:[]};try{const r=await api('/v1/chat/messages');STATE.conversation=r.conversation;STATE.messages=r.messages;paint()}catch(x){if(x.status===404){T.set('');STATE.conversation=null;STATE.messages=[]}}return toThread(STATE.messages)}
(async()=>{
  try{const s=await api('/v1/chat/state');STATE={...STATE,...s,messages:s.messages||[]}}catch{}
  if(!STATE.enabled){$('#thread').innerHTML='<div class="off">Chat is off right now. Please email us and we will get back to you.</div>';paint();return}
  chat=FBChat.mount($('#thread'),{id:'vc',viewer:'client',canCompose:true,attach:false,replies:false,placeholder:'Write a message',emptyTitle:'Chat with us',emptyText:STATE.greeting||'Ask us anything.',send,refresh});
  paint();chat.update(toThread(STATE.messages),{toBottom:true});
})();
$('#person').onclick=async()=>{try{const r=await api('/v1/chat/person',{body:{}});STATE.conversation=r.conversation;STATE.messages=r.messages;paint();chat.update(toThread(STATE.messages),{toBottom:true})}catch(x){$('#cMsg').textContent=x.message}};
$('#contactForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#cMsg');m.textContent='';try{const r=await api('/v1/chat/contact',{body:{email:$('#cEmail').value,name:$('#cName').value}});STATE.conversation=r.conversation;paint()}catch(x){m.textContent=x.message}});
$('#close').onclick=()=>parent.postMessage({type:'fbchat-close'},'*');
addEventListener('message',e=>{const d=e.data||{};if(d.type==='fbchat-ctx'){if(d.page!==undefined)ctx.page=String(d.page).slice(0,300);if(d.looking!==undefined)ctx.looking=String(d.looking).slice(0,80)}if(d.type==='fbchat-state'){OPEN=Boolean(d.open);if(OPEN){seen=STATE.messages.filter(m=>m.author!=='visitor'&&m.author!=='system').length;chat&&chat.focus()}}});
</script>
</body>
</html>
