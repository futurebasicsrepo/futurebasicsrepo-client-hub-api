<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Engineering benchmark</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/cue.css">
<style>
@import url('/fonts/fonts.css');
:root{--ink:#141416;--paper:#fff;--fog:#f5f5f2;--dim:#727278;--line:rgba(20,20,22,.14);--cue:#4bff9a;--ok:#17603a;--bad:#a02a20;--warn:#8a5a00}
*{box-sizing:border-box}html{background:var(--fog)}
body{margin:0;color:var(--ink);font:400 14px/1.45 'Space Grotesk',system-ui,sans-serif;background:var(--fog);min-height:100vh}
button,select{font:inherit;color:inherit}.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;min-height:34px;font-size:13px}
.btn.go{background:var(--cue);border-color:var(--cue)}.btn[disabled]{opacity:.45;pointer-events:none}
.mono{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
main{max-width:1100px;margin:0 auto;padding:22px clamp(16px,3vw,32px) 60px;display:grid;gap:18px}main>*{min-width:0}
body>header{height:72px;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20}
.wordmark{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;text-transform:uppercase;letter-spacing:.08em}.brand-logo{display:block;width:200px;max-width:34vw;height:auto;max-height:30px}.brand-suffix{font:500 10px 'IBM Plex Mono',monospace;white-space:nowrap}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}.pagehead h1{margin:0;font-size:26px;letter-spacing:-.01em;text-wrap:balance}.pagehead p{margin:4px 0 0;color:var(--dim);max-width:64ch}
.pagehead .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}select{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;min-height:34px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile b{display:block;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}.tile span{color:var(--dim);font-size:12.5px}
.notes{display:grid;gap:4px;margin-top:12px;color:var(--ink);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}td small{display:block;color:var(--dim);font-size:11.5px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(23,96,58,.35);background:rgba(23,96,58,.06)}.pill.warn{color:var(--warn);border-color:rgba(138,90,0,.35);background:rgba(138,90,0,.06)}.pill.bad{color:var(--bad);border-color:rgba(160,42,32,.35);background:rgba(160,42,32,.06)}
.meter{display:grid;grid-template-columns:repeat(6,14px);gap:2px;margin-top:4px}.meter i{height:6px;border-radius:2px;background:var(--line)}
.status{color:var(--dim);font-size:13px}.err{color:var(--bad)}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><a class="wordmark" href="/home" aria-label="My day"><img class="brand-logo" src="https://thefuturebasics.com/cdn/shop/files/future_basics_true_vector_fixed.svg?v=1775278873&amp;width=360" alt="Future Basics"><span class="brand-suffix">/ Sites &amp; health</span></a></header>
<main>
  <div class="pagehead">
    <div><span class="mono">Design Lab · Engineering</span><h1>Engineering benchmark</h1>
      <p>Known products designed from their words alone, reviewed, then scored against what is known about them: size, the parts they cannot do without, the engine's checks, part count, cost to make and tooling.</p></div>
    <div class="act"><select id="only" aria-label="Products to run"><option value="">All products</option></select><button class="btn go" id="run">Run the benchmark</button></div>
  </div>
  <div class="status" id="status" role="status"></div>
  <section class="panel hidden" id="sum"></section>
  <section class="panel hidden" id="table"></section>
  <section class="panel"><details><summary>The reference products</summary><div class="scroll" id="ref"></div></details></section>
  <section class="panel hidden" id="older"></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOKEN=()=>{try{return localStorage.getItem('fb.admin.token')||''}catch{return ''}};
async function api(path,o={}){const r=await fetch(path,{method:o.method||(o.body?'POST':'GET'),headers:{Authorization:'Bearer '+TOKEN(),...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
const money=v=>v==null?'–':'$'+(v>=1000?Math.round(v).toLocaleString():Number(v).toFixed(2)),range=([a,b],f=money)=>`${f(a)}–${f(b)}`;
const tone=s=>s>=80?'ok':s>=60?'warn':'bad',LABEL={size:'Size',must:'Must-have parts',checks:'Engine checks',count:'Part count',unit:'Cost to make',tool:'Tooling'};
const meter=p=>`<span class="meter" aria-hidden="true">${['size','must','checks','count','unit','tool'].map(k=>`<i title="${LABEL[k]} ${Math.round(p[k]*100)}%" style="background:${p[k]>=.8?'var(--ok)':p[k]>=.5?'#d7a43a':'var(--bad)'}"></i>`).join('')}</span>`;
let REF=[],timer=null;
function summary(run){const s=run.summary;if(!s)return '';
  return `<div class="tiles"><div class="tile"><b>${s.after??'–'}</b><span>Average score after the review (${s.before??'–'} before)</span></div>
  <div class="tile"><b>${s.reviewPassed}/${s.done}</b><span>Reached the review's bar of 90</span></div>
  <div class="tile"><b>${s.agreement==null?'–':Math.round(s.agreement*100)+'%'}</b><span>Review verdict agrees with the benchmark (90 on review ↔ 80 here)</span></div>
  <div class="tile"><b>${s.weakest.map(k=>LABEL[k]).join(', ')||'–'}</b><span>Weakest measures</span></div></div>
  <div class="notes">${s.passedButWeak.length?`<div><span class="pill bad">Passed review, weak here</span> ${esc(s.passedButWeak.join(', '))}: the review's 90 is not enough on its own for these.</div>`:''}
  ${s.oftenMissing.length?`<div><span class="pill warn">Often missing</span> ${esc(s.oftenMissing.join(', '))}</div>`:''}
  ${s.failed?`<div><span class="pill bad">Did not finish</span> ${s.failed} product${s.failed>1?'s':''}</div>`:''}
  <div class="mono" style="margin-top:4px">Judges: ${esc((run.judges||[]).join(' + ')||'engine checks only')} · ${new Date(run.started_at).toLocaleString()}</div></div>`}
function rows(run){const items=run.items||[];if(!items.length)return '<p class="status">No product has finished yet.</p>';
  return `<div class="scroll"><table><thead><tr><th>Product</th><th>Score</th><th>Review</th><th>Size, mm</th><th>Parts</th><th>Cost to make</th><th>Tooling</th><th>Missing</th></tr></thead><tbody>${items.map(i=>{if(i.error)return `<tr><td>${esc(i.name)}</td><td colspan="7" class="err">${esc(i.error)}</td></tr>`;const a=i.after,b=i.before,w=i.want;
    return `<tr><td><b>${esc(i.name)}</b><small>${i.secs}s · designed in ${i.compose.rounds} round${i.compose.rounds>1?'s':''}</small></td>
    <td><span class="pill ${tone(a.score)}">${a.score}</span><small>${b.score} before</small>${meter(a.parts)}</td>
    <td>${i.review.score==null?'<small>checks only</small>':`<span class="pill ${i.review.score>=90?'ok':'warn'}">${i.review.score}</span><small>${i.review.changes} change${i.review.changes===1?'':'s'}, ${i.review.rejected} refused</small>`}</td>
    <td>${a.size.join(' × ')}<small>known ${[...w.size].sort((x,y)=>x-y).join(' × ')}</small></td>
    <td>${a.partCount}<small>known ${w.count[0]}–${w.count[1]}</small></td>
    <td>${money(a.unit)}<small>known ${range(w.unit)}</small></td>
    <td>${money(a.toolCost)}<small>known ${range(w.tool)}</small></td>
    <td>${a.missing.length?esc(a.missing.join(', ')):'<small>none</small>'}${a.bad?`<small>${a.bad} engine problem${a.bad>1?'s':''}</small>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
async function load(){
  let d;try{d=await api('/v1/lab/engineering/benchmark')}catch(e){$('#status').innerHTML=`<span class="err">${esc(e.message)}</span>`;return}
  if(!REF.length){REF=d.reference;$('#only').innerHTML+=REF.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
    $('#ref').innerHTML=`<table><thead><tr><th>Product</th><th>Size, mm</th><th>Must have</th><th>Parts</th><th>Cost to make</th><th>Tooling</th></tr></thead><tbody>${REF.map(r=>`<tr><td><b>${esc(r.name)}</b><small>${esc(r.description)}</small></td><td>${r.size.join(' × ')}</td><td>${esc(r.must.join(', '))}</td><td>${r.count[0]}–${r.count[1]}</td><td>${range(r.unit)}</td><td>${range(r.tool)}</td></tr>`).join('')}</tbody></table><p class="status">Ranges for the common products of each kind: sizes from published dimensions, part counts from public teardowns, costs to make at 5,000 a year before margin. Factory quotes narrow the costs over time.</p>`}
  const run=d.runs[0],live=Boolean(d.running);$('#run').disabled=live;
  if(!run){$('#status').textContent='No benchmark has run yet. A full run designs and reviews 12 products and takes about half an hour.';return}
  $('#status').textContent=live?`Running: ${run.items.length} product${run.items.length===1?'':'s'} done so far. The table fills in as each finishes.`:run.status==='failed'?`The last run failed: ${run.error||'unknown error'}`:'';
  $('#sum').classList.toggle('hidden',!run.summary);$('#sum').innerHTML=summary(run);$('#table').classList.remove('hidden');$('#table').innerHTML=rows(run);
  const old=d.runs.slice(1).filter(r=>r.summary);$('#older').classList.toggle('hidden',!old.length);$('#older').innerHTML=`<span class="mono">Earlier runs</span><div class="scroll"><table><thead><tr><th>When</th><th>Products</th><th>After review</th><th>Before</th><th>Passed review</th><th>Agreement</th></tr></thead><tbody>${old.map(r=>`<tr><td>${new Date(r.started_at).toLocaleString()}</td><td>${r.summary.done}</td><td>${r.summary.after??'–'}</td><td>${r.summary.before??'–'}</td><td>${r.summary.reviewPassed}</td><td>${r.summary.agreement==null?'–':Math.round(r.summary.agreement*100)+'%'}</td></tr>`).join('')}</tbody></table></div>`;
  clearTimeout(timer);if(live)timer=setTimeout(load,8000)}
$('#run').addEventListener('click',async()=>{const v=$('#only').value,b=$('#run');b.disabled=true;b.textContent='Starting…';
  try{const r=await api('/v1/lab/engineering/benchmark',{body:v?{only:[v]}:{}});$('#status').textContent=`Started: ${r.products} product${r.products>1?'s':''}, judged by ${r.judges.join(' + ')||'the engine checks only'}.`;await load()}
  catch(e){$('#status').innerHTML=`<span class="err">${esc(e.message)}</span>`;b.disabled=false}finally{b.textContent='Run the benchmark'}});
load();
</script>
<script src="/console-nav.js" defer></script>
</body>
</html>
