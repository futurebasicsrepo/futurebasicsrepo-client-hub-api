<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Future Basics — Operations</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f5f2;color:#141416}header{height:64px;background:#141416;color:white;padding:0 4vw;display:flex;align-items:center;justify-content:space-between}main{padding:42px 4vw;max-width:1400px;margin:auto}h1{font-size:clamp(40px,7vw,90px);letter-spacing:-.06em;margin:0 0 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #ddd;padding:22px}.card h2{margin:8px 0}.meta{font:10px ui-monospace;text-transform:uppercase;letter-spacing:.13em;color:#777}.stats{display:flex;gap:22px;margin-top:25px}.stats b{display:block;font-size:24px}input,select,button{font:inherit;padding:12px;border:1px solid #bbb}button{background:#141416;color:white;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1}.auth{max-width:600px}.hidden{display:none}.head{display:flex;justify-content:space-between;align-items:end;margin:40px 0 14px}.action{padding:14px 0;border-bottom:1px solid #ddd}dialog{width:min(1100px,95vw);max-height:92vh;border:0;padding:0}dialog::backdrop{background:#0008}.modalhead{position:sticky;top:0;background:#141416;color:#fff;padding:20px;display:flex;justify-content:space-between;z-index:2}.modalbody{padding:24px}.product{border-top:1px solid #ddd;padding:22px 0}.product-head{display:flex;justify-content:space-between;gap:20px}.source{background:#eef3ed;border:1px solid #c9d4c6;padding:6px 9px;font:10px ui-monospace;text-transform:uppercase}.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.gate{background:#f4f4f1;border:1px solid #ddd;color:#222;text-align:left;padding:9px}.gate.complete{background:#dfeadd}.gate.current{background:#f2e6bc;border-color:#c3a94b}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tools button,.tools a{font-size:12px;padding:8px 11px}.tools a{border:1px solid #bbb;color:#141416;text-decoration:none}.close{border:0;font-size:24px}@media(max-width:700px){.gates{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><strong>FUTURE BASICS / OPERATIONS</strong><span id="state">secure workspace</span></header><main>
<section id="auth" class="panel auth"><h2>Staff sign in</h2><p>Use your @thefuturebasics.com email.</p><form id="send" class="row"><input id="email" type="email" required placeholder="you@thefuturebasics.com"><button>Send code</button></form><form id="verify" class="row hidden"><input id="code" required maxlength="6" placeholder="6-digit code"><button>Sign in</button></form><p id="msg"></p></section>
<section id="app" class="hidden"><span class="meta">client operations system</span><h1>Work in motion.</h1><div class="head"><h2>Clients</h2><button id="add">+ client</button></div><div id="clients" class="grid"></div><div class="head"><h2>Waiting on approval</h2></div><div id="actions" class="panel"></div></section>
</main><dialog id="clientModal"><div class="modalhead"><div><span class="meta">client room management</span><h2 id="clientTitle"></h2></div><button class="close" onclick="clientModal.close()">×</button></div><div class="modalbody" id="clientBody"></div></dialog><script>
const API=location.protocol==='file:'?'https://futurebasicsrepo-client-hub-api-production-9aec.up.railway.app':location.origin,KEY='fb.admin.token';let token=localStorage.getItem(KEY)||'',activeClient=null;
async function api(p,o={}){o.headers=o.headers||{};if(token)o.headers.Authorization='Bearer '+token;if(o.body)o.headers['Content-Type']='application/json';let r=await fetch(API+p,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
send.onsubmit=async e=>{e.preventDefault();msg.textContent='Sending…';try{await api('/v1/auth/code',{method:'POST',body:JSON.stringify({email:email.value})});verify.classList.remove('hidden');msg.textContent='Code sent.'}catch(x){msg.textContent=x.message}};
verify.onsubmit=async e=>{e.preventDefault();try{let d=await api('/v1/auth/verify',{method:'POST',body:JSON.stringify({email:email.value,code:code.value})});token=d.token;localStorage.setItem(KEY,token);load()}catch(x){msg.textContent=x.message}};
async function load(){try{let d=await api('/v1/admin/dashboard');auth.classList.add('hidden');app.classList.remove('hidden');state.textContent='preview workspace';clients.innerHTML=d.clients.map(c=>`<article class="card"><span class="meta">${c.slug} · ${c.status}</span><h2>${c.name}</h2><div class="stats"><span><b>${c.product_count}</b>products</span><span><b>${c.request_count}</b>requests</span></div><div class="tools"><button onclick="openClient('${c.id}')">Manage room</button><button onclick="addProduct('${c.id}','${c.name.replaceAll("'",'')}')">+ product</button></div></article>`).join('');actions.innerHTML=d.actions.length?d.actions.map(a=>`<div class="action"><strong>${a.client_name}</strong> · ${a.product_title}<br>${a.title}</div>`).join(''):'Nothing is waiting for approval.';return true}catch(e){try{localStorage.removeItem(KEY)}catch{}token='';msg.textContent='Unable to open preview: '+e.message;throw e}}
add.onclick=async()=>{let name=prompt('Client name');if(!name)return;let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');let domains=(prompt('Approved email domains, comma separated')||'').split(',').map(x=>x.trim()).filter(Boolean);await api('/v1/admin/clients',{method:'POST',body:JSON.stringify({name,slug,emailDomains:domains})});load()};
window.addProduct=async(id,name)=>{let title=prompt('New product for '+name);if(!title)return;await api('/v1/admin/clients/'+id+'/products',{method:'POST',body:JSON.stringify({title})});load()};
async function boot(){msg.textContent='Opening preview…';try{let r=await fetch(API+'/v1/dev/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'admin'})}),d=await r.json();if(!r.ok)throw Error(d.error||'Preview session unavailable');token=d.token;if(!token)throw Error('Preview session did not return a token');await load()}catch(e){msg.textContent='Unable to open preview: '+e.message;if(token)load().catch(()=>{})}}
boot();
window.openClient=async id=>{let d=await api('/v1/admin/clients/'+id);activeClient=d;clientTitle.textContent=d.client.name;clientBody.innerHTML=`<div class="panel"><span class="meta">approved domains</span><p>${d.client.email_domains.join(', ')||'None'}</p><div class="tools"><button onclick="editDomains('${id}','${d.client.email_domains.join(',')}')">Edit domains</button><button onclick="addInvoice('${id}')">Record Shopify invoice</button></div></div><h2>Product workflows</h2>`+d.products.map(p=>`<div class="product"><div class="product-head"><div><span class="meta">${p.current_stage} · ${p.risk_level} · brief ${(p.brief&&p.brief.status)||'not started'}</span><h3>${p.title}</h3></div><span class="source">${p.shopify_product_id?'Shopify linked':'Workflow only'}</span></div><div class="gates">${p.milestones.map(m=>`<button class="gate ${m.status}" onclick="gate('${m.id}','${p.id}')"><span class="meta">${m.responsible_party}</span><br>${m.name}</button>`).join('')}</div><div class="tools"><button onclick="brief('${p.id}')">Edit brief</button><button onclick="stage('${p.id}')">Set stage</button><button onclick="quote('${p.id}')">Issue quote</button><button onclick="approval('${p.id}')">Request approval</button><button onclick="linkShopify('${p.id}')">Link Shopify</button>${p.shopify_handle?`<a target="_blank" href="https://thefuturebasics.com/products/${p.shopify_handle}">View Shopify product</a>`:''}</div></div>`).join('')+`<h2>Requests</h2>`+(d.requests.map(r=>`<div class="action"><strong>${r.title}</strong> · ${r.status}<br>${r.details}</div>`).join('')||'No requests.')+`<h2>Shopify invoices & payments</h2>`+(d.invoices.map(i=>`<div class="action"><strong>${i.number}</strong> · $${(i.amount_cents/100).toFixed(2)} · ${i.status}${i.external_url?` · <a target="_blank" href="${i.external_url}">Open in Shopify</a>`:''}</div>`).join('')||'No invoice links recorded.');clientModal.showModal()};
window.editDomains=async(id,current)=>{let v=prompt('Comma-separated email domains',current);if(v===null)return;await api('/v1/admin/clients/'+id,{method:'PATCH',body:JSON.stringify({emailDomains:v.split(',').map(x=>x.trim()).filter(Boolean)})});openClient(id)};
window.stage=async id=>{let stage=prompt('Stage: brief, concept, development, sample, approval, production, quality, delivery');if(stage)await api('/v1/admin/products/'+id,{method:'PATCH',body:JSON.stringify({stage})});};
window.brief=async id=>{let p=activeClient.products.find(x=>x.id===id),b=p.brief||{},objective=prompt('Objective / job to be done',b.objective||'');if(objective===null)return;let audience=prompt('Audience',b.audience||''),quantity=+prompt('Target quantity',b.target_quantity||''),budget=Math.round(+prompt('Total target budget in dollars',b.target_budget_cents?b.target_budget_cents/100:'')*100),delivery=prompt('Required delivery date (YYYY-MM-DD)',b.delivery_date||''),decoration=prompt('Decoration / application',b.decoration||''),packaging=prompt('Packaging',b.packaging||''),fulfillment=prompt('Fulfillment',b.fulfillment||''),notes=prompt('Notes',b.notes||'');await api('/v1/admin/products/'+id+'/brief',{method:'PUT',body:JSON.stringify({objective,audience,targetQuantity:quantity||null,targetBudgetCents:budget||null,deliveryDate:delivery||null,decoration,packaging,fulfillment,notes,status:'ready'})});openClient(activeClient.client.id)};
window.gate=async(id,productId)=>{let p=activeClient.products.find(x=>x.id===productId),m=p.milestones.find(x=>x.id===id),status=prompt('Gate status: upcoming, current, blocked, complete',m.status);if(!status)return;let owner=prompt('Responsible party: future-basics or client',m.responsible_party),due=prompt('Due date (YYYY-MM-DD)',m.due_date||''),notes=prompt('Gate notes',m.notes||'');await api('/v1/admin/milestones/'+id,{method:'PATCH',body:JSON.stringify({status,dueDate:due||null,responsibleParty:owner||null,notes})});openClient(activeClient.client.id)};
window.linkShopify=async id=>{let p=activeClient.products.find(x=>x.id===id),gid=prompt('Shopify product GID',p.shopify_product_id||''),handle=prompt('Shopify product handle',p.shopify_handle||'');if(gid||handle){await api('/v1/admin/products/'+id,{method:'PATCH',body:JSON.stringify({shopifyProductId:gid||null,shopifyHandle:handle||null})});openClient(activeClient.client.id)}};
window.quote=async id=>{let q=+prompt('Quantity'),cost=Math.round(+prompt('Unit cost in dollars')*100),wholesale=Math.round(+prompt('Wholesale price in dollars')*100),srp=Math.round(+prompt('Suggested retail price in dollars')*100),tooling=Math.round(+(prompt('Tooling total in dollars','0')||0)*100),freight=Math.round(+(prompt('Freight estimate in dollars','0')||0)*100);if(q&&cost)await api('/v1/admin/products/'+id+'/quotes',{method:'POST',body:JSON.stringify({quantity:q,unitCostCents:cost,wholesaleCents:wholesale||null,srpCents:srp||null,toolingCents:tooling,freightCents:freight})});};
window.approval=async id=>{let title=prompt('Approval title'),version=prompt('Version','v1');if(title)await api('/v1/admin/products/'+id+'/approvals',{method:'POST',body:JSON.stringify({title,version})});};
window.addInvoice=async id=>{let number=prompt('Shopify order / invoice number'),amount=Math.round(+prompt('Amount in dollars')*100),url=prompt('Shopify invoice or payment URL');if(number&&amount)await api('/v1/admin/clients/'+id+'/invoices',{method:'POST',body:JSON.stringify({number,amountCents:amount,externalUrl:url||null})});openClient(id)};
</script></body></html>
