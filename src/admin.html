<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Future Basics — Operations</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f5f2;color:#141416}header{height:64px;background:#141416;color:white;padding:0 4vw;display:flex;align-items:center;justify-content:space-between}main{padding:42px 4vw;max-width:1400px;margin:auto}h1{font-size:clamp(40px,7vw,90px);letter-spacing:-.06em;margin:0 0 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #ddd;padding:22px}.card h2{margin:8px 0}.meta{font:10px ui-monospace;text-transform:uppercase;letter-spacing:.13em;color:#777}.stats{display:flex;gap:22px;margin-top:25px}.stats b{display:block;font-size:24px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #bbb}button{background:#141416;color:white;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1}.auth{max-width:600px}.hidden{display:none}.head{display:flex;justify-content:space-between;align-items:end;margin:40px 0 14px}.action{padding:14px 0;border-bottom:1px solid #ddd}dialog{width:min(1100px,95vw);max-height:92vh;border:0;padding:0}dialog::backdrop{background:#0008}.modalhead{position:sticky;top:0;background:#141416;color:#fff;padding:20px;display:flex;justify-content:space-between;z-index:2}.modalbody{padding:24px}.product{border-top:1px solid #ddd;padding:22px 0}.product-head{display:flex;justify-content:space-between;gap:20px}.source{background:#eef3ed;border:1px solid #c9d4c6;padding:6px 9px;font:10px ui-monospace;text-transform:uppercase}.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.gate{background:#f4f4f1;border:1px solid #ddd;color:#222;text-align:left;padding:9px}.gate.complete{background:#dfeadd}.gate.current{background:#f2e6bc;border-color:#c3a94b}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tools button,.tools a{font-size:12px;padding:8px 11px}.tools a{border:1px solid #bbb;color:#141416;text-decoration:none}.close{border:0;font-size:24px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor-field{display:grid;gap:6px}.editor-field.full{grid-column:1/-1}.editor-field textarea{min-height:100px;resize:vertical}.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:700px){.gates,.editor-grid{grid-template-columns:1fr 1fr}}</style></head>
<body><header><strong>FUTURE BASICS / OPERATIONS</strong><span id="state">secure workspace</span></header><main>
<section id="auth" class="panel auth"><h2>Staff sign in</h2><p>Use your @thefuturebasics.com email.</p><form id="send" class="row"><input id="email" type="email" required placeholder="you@thefuturebasics.com"><button>Send code</button></form><form id="verify" class="row hidden"><input id="code" required maxlength="6" placeholder="6-digit code"><button>Sign in</button></form><p id="msg"></p></section>
<section id="app" class="hidden"><span class="meta">client operations system</span><h1>Work in motion.</h1><div id="shopifyConnection" class="panel"><span class="meta">commerce system of record</span><h2>Shopify connection</h2><p id="shopifyState">Checking connection…</p><div class="tools"><button onclick="syncCommerce()">Sync payment status</button></div></div><div class="head"><h2>Clients</h2><button id="add">+ client</button></div><div id="clients" class="grid"></div><div class="head"><h2>Waiting on approval</h2></div><div id="actions" class="panel"></div></section>
</main><dialog id="clientModal"><div class="modalhead"><div><span class="meta">client room management</span><h2 id="clientTitle"></h2></div><button class="close" onclick="clientModal.close()">×</button></div><div class="modalbody" id="clientBody"></div></dialog><dialog id="editorModal"><div class="modalhead"><h2 id="editorTitle">Edit workflow</h2><button class="close" type="button" onclick="editorModal.close()">×</button></div><form id="editorForm" class="modalbody"><div id="editorFields" class="editor-grid"></div><p id="editorMessage"></p><div class="editor-actions"><button type="button" onclick="editorModal.close()">Cancel</button><button type="submit">Save</button></div></form></dialog><script>
const API=location.protocol==='file:'?'https://futurebasicsrepo-client-hub-api-production-9aec.up.railway.app':location.origin,KEY='fb.admin.token';let token=localStorage.getItem(KEY)||'',activeClient=null;
async function api(p,o={}){o.headers=o.headers||{};if(token)o.headers.Authorization='Bearer '+token;if(o.body)o.headers['Content-Type']='application/json';let r=await fetch(API+p,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
send.onsubmit=async e=>{e.preventDefault();msg.textContent='Sending…';try{await api('/v1/auth/code',{method:'POST',body:JSON.stringify({email:email.value})});verify.classList.remove('hidden');msg.textContent='Code sent.'}catch(x){msg.textContent=x.message}};
verify.onsubmit=async e=>{e.preventDefault();try{let d=await api('/v1/auth/verify',{method:'POST',body:JSON.stringify({email:email.value,code:code.value})});token=d.token;localStorage.setItem(KEY,token);load()}catch(x){msg.textContent=x.message}};
async function load(){try{let d=await api('/v1/admin/dashboard');auth.classList.add('hidden');app.classList.remove('hidden');state.textContent='preview workspace';clients.innerHTML=d.clients.map(c=>`<article class="card"><span class="meta">${c.slug} · ${c.status}</span><h2>${c.name}</h2><div class="stats"><span><b>${c.product_count}</b>products</span><span><b>${c.request_count}</b>requests</span></div><div class="tools"><button onclick="openClient('${c.id}')">Manage room</button><button onclick="addProduct('${c.id}','${c.name.replaceAll("'",'')}')">+ product</button></div></article>`).join('');actions.innerHTML=d.actions.length?d.actions.map(a=>`<div class="action"><strong>${a.client_name}</strong> · ${a.product_title}<br>${a.title}</div>`).join(''):'Nothing is waiting for approval.';loadShopify();return true}catch(e){try{localStorage.removeItem(KEY)}catch{}token='';msg.textContent='Unable to open preview: '+e.message;throw e}}
add.onclick=async()=>{let name=prompt('Client name');if(!name)return;let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');let domains=(prompt('Approved email domains, comma separated')||'').split(',').map(x=>x.trim()).filter(Boolean);await api('/v1/admin/clients',{method:'POST',body:JSON.stringify({name,slug,emailDomains:domains})});load()};
window.addProduct=async(id,name)=>{let title=prompt('New product for '+name);if(!title)return;await api('/v1/admin/clients/'+id+'/products',{method:'POST',body:JSON.stringify({title})});load()};
async function boot(){msg.textContent='Opening preview…';try{let r=await fetch(API+'/v1/dev/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'admin'})}),d=await r.json();if(!r.ok)throw Error(d.error||'Preview session unavailable');token=d.token;if(!token)throw Error('Preview session did not return a token');await load()}catch(e){msg.textContent='Unable to open preview: '+e.message;if(token)load().catch(()=>{})}}
boot();
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editor(title,fields,save){editorTitle.textContent=title;editorFields.innerHTML=fields.map(f=>`<label class="editor-field ${f.full?'full':''}"><span>${esc(f.label)}</span>${f.type==='textarea'?`<textarea name="${esc(f.name)}">${esc(f.value)}</textarea>`:`<input name="${esc(f.name)}" type="${esc(f.type||'text')}" value="${esc(f.value)}" ${f.required?'required':''}>`}</label>`).join('');editorMessage.textContent='';editorForm.onsubmit=async e=>{e.preventDefault();editorMessage.textContent='Saving…';try{await save(Object.fromEntries(new FormData(editorForm)));editorModal.close();if(activeClient)await openClient(activeClient.client.id)}catch(x){editorMessage.textContent=x.message}};editorModal.showModal()}
async function loadShopify(){try{let s=await api('/v1/admin/shopify/status');shopifyState.textContent=s.connected?`Connected to ${s.storeDomain} · Admin API ${s.apiVersion}`:`Connection ready · add Shopify Admin API credentials in Railway · scopes: ${s.requiredScopes.join(', ')}`;shopifyConnection.dataset.connected=s.connected}catch(e){shopifyState.textContent=e.message}}
window.syncShopify=async id=>{shopifyState.textContent='Syncing Shopify products…';try{let d=await api('/v1/admin/shopify/sync',{method:'POST',body:JSON.stringify({clientId:id})});shopifyState.textContent=`Synced ${d.count} products from Shopify`;await openClient(id)}catch(e){shopifyState.textContent=e.message}};
window.syncCommerce=async()=>{shopifyState.textContent='Syncing draft orders and payments…';try{let d=await api('/v1/admin/shopify/sync-commerce',{method:'POST',body:'{}'});shopifyState.textContent=`Synced ${d.count} commerce records from Shopify`;if(activeClient)await openClient(activeClient.client.id)}catch(e){shopifyState.textContent=e.message}};
window.openClient=async id=>{let d=await api('/v1/admin/clients/'+id);activeClient=d;clientTitle.textContent=d.client.name;clientBody.innerHTML=`<div class="panel"><span class="meta">approved domains</span><p>${d.client.email_domains.join(', ')||'None'}</p><div class="tools"><button onclick="editDomains('${id}','${d.client.email_domains.join(',')}')">Edit domains</button><button onclick="syncShopify('${id}')">Sync Shopify products</button><button onclick="addInvoice('${id}')">Record Shopify invoice</button></div></div><h2>Product workflows</h2>`+d.products.map(p=>{let pq=d.quotes.filter(q=>q.product_id===p.id);return `<div class="product"><div class="product-head"><div><span class="meta">${p.current_stage} · ${p.risk_level} · brief ${(p.brief&&p.brief.status)||'not started'}</span><h3>${p.title}</h3>${p.shopify_synced_at?`<span class="meta">Shopify ${p.shopify_status||''} · inventory ${p.shopify_inventory_total??'—'} · ${(p.shopify_variants||[]).length} variants</span>`:''}</div><span class="source">${p.shopify_product_id?'Shopify linked':'Workflow only'}</span></div><div class="gates">${p.milestones.map(m=>`<button class="gate ${m.status}" onclick="gate('${m.id}','${p.id}')"><span class="meta">${m.responsible_party}</span><br>${m.name}</button>`).join('')}</div><div class="tools"><button onclick="brief('${p.id}')">Edit brief</button><button onclick="stage('${p.id}')">Set stage</button><button onclick="quote('${p.id}')">Issue quote</button><button onclick="approval('${p.id}')">Request approval</button><button onclick="linkShopify('${p.id}')">Link Shopify</button>${p.shopify_handle?`<a target="_blank" href="https://thefuturebasics.com/products/${p.shopify_handle}">View Shopify product</a>`:''}</div>${pq.length?`<div class="action"><span class="meta">commercial</span>${pq.map(q=>`<p><strong>Quote v${q.version}</strong> · ${q.quantity} units · ${q.shopify_draft_order_name||'No Shopify draft order'} · ${q.shopify_financial_status||q.shopify_draft_order_status||q.status}<br><span class="tools">${!q.shopify_draft_order_id?`<button onclick="draftOrder('${p.id}','${q.id}')">Create Shopify draft order</button>`:`<button onclick="sendInvoice('${q.id}')">Send Shopify invoice</button>`}${q.shopify_invoice_url?`<a target="_blank" href="${q.shopify_invoice_url}">Open checkout</a>`:''}</span></p>`).join('')}</div>`:''}</div>`}).join('')+`<h2>Requests</h2>`+(d.requests.map(r=>`<div class="action"><strong>${r.title}</strong> · ${r.status}<br>${r.details}</div>`).join('')||'No requests.')+`<h2>Shopify invoices & payments</h2>`+(d.invoices.map(i=>`<div class="action"><strong>${i.number}</strong> · $${(i.amount_cents/100).toFixed(2)} · ${i.status}${i.external_url?` · <a target="_blank" href="${i.external_url}">Open in Shopify</a>`:''}</div>`).join('')||'No invoice links recorded.');if(!clientModal.open)clientModal.showModal()};
window.editDomains=async(id,current)=>{let v=prompt('Comma-separated email domains',current);if(v===null)return;await api('/v1/admin/clients/'+id,{method:'PATCH',body:JSON.stringify({emailDomains:v.split(',').map(x=>x.trim()).filter(Boolean)})});openClient(id)};
window.stage=id=>{let p=activeClient.products.find(x=>x.id===id);editor('Product status — '+p.title,[{name:'stage',label:'Stage (brief, concept, development, sample, approval, production, quality, delivery)',value:p.current_stage,required:true},{name:'riskLevel',label:'Risk (on-track, attention, blocked)',value:p.risk_level,required:true},{name:'owner',label:'Future Basics owner',value:p.owner},{name:'targetDate',label:'Target date',value:p.target_date,type:'date'}],v=>api('/v1/admin/products/'+id,{method:'PATCH',body:JSON.stringify({...v,targetDate:v.targetDate||null})}))};
window.brief=id=>{let p=activeClient.products.find(x=>x.id===id),b=p.brief||{};editor('Product brief — '+p.title,[{name:'objective',label:'Objective / job to be done',value:b.objective,full:true,type:'textarea',required:true},{name:'audience',label:'Audience',value:b.audience},{name:'targetQuantity',label:'Target quantity',value:b.target_quantity,type:'number'},{name:'targetBudget',label:'Target budget (USD)',value:b.target_budget_cents?b.target_budget_cents/100:'',type:'number'},{name:'deliveryDate',label:'Required delivery date',value:b.delivery_date,type:'date'},{name:'decoration',label:'Decoration / application',value:b.decoration},{name:'packaging',label:'Packaging',value:b.packaging},{name:'fulfillment',label:'Fulfillment',value:b.fulfillment},{name:'notes',label:'Notes',value:b.notes,full:true,type:'textarea'}],v=>api('/v1/admin/products/'+id+'/brief',{method:'PUT',body:JSON.stringify({...v,targetQuantity:+v.targetQuantity||null,targetBudgetCents:Math.round(+v.targetBudget*100)||null,deliveryDate:v.deliveryDate||null,status:'ready'})}))};
window.gate=(id,productId)=>{let p=activeClient.products.find(x=>x.id===productId),m=p.milestones.find(x=>x.id===id);editor(m.name+' gate — '+p.title,[{name:'status',label:'Status (upcoming, current, blocked, complete)',value:m.status,required:true},{name:'responsibleParty',label:'Responsible party',value:m.responsible_party,required:true},{name:'dueDate',label:'Due date',value:m.due_date,type:'date'},{name:'notes',label:'Gate notes',value:m.notes,full:true,type:'textarea'}],v=>api('/v1/admin/milestones/'+id,{method:'PATCH',body:JSON.stringify({...v,dueDate:v.dueDate||null})}))};
window.linkShopify=id=>{let p=activeClient.products.find(x=>x.id===id);editor('Shopify source — '+p.title,[{name:'shopifyProductId',label:'Shopify product GID',value:p.shopify_product_id,full:true},{name:'shopifyHandle',label:'Shopify product handle',value:p.shopify_handle,full:true}],v=>api('/v1/admin/products/'+id,{method:'PATCH',body:JSON.stringify(v)}))};
window.quote=id=>editor('Issue commercial quote',[{name:'quantity',label:'Quantity',type:'number',required:true},{name:'unitCost',label:'Unit cost (USD)',type:'number',required:true},{name:'wholesale',label:'Wholesale (USD)',type:'number'},{name:'srp',label:'Suggested retail (USD)',type:'number'},{name:'tooling',label:'Tooling total (USD)',type:'number',value:'0'},{name:'freight',label:'Freight estimate (USD)',type:'number',value:'0'}],v=>api('/v1/admin/products/'+id+'/quotes',{method:'POST',body:JSON.stringify({quantity:+v.quantity,unitCostCents:Math.round(+v.unitCost*100),wholesaleCents:Math.round(+v.wholesale*100)||null,srpCents:Math.round(+v.srp*100)||null,toolingCents:Math.round(+v.tooling*100)||0,freightCents:Math.round(+v.freight*100)||0})}));
window.approval=id=>editor('Request client approval',[{name:'title',label:'Approval title',required:true,full:true},{name:'kind',label:'Type',value:'artwork'},{name:'version',label:'Version',value:'v1'},{name:'notes',label:'Client-facing notes',type:'textarea',full:true}],v=>api('/v1/admin/products/'+id+'/approvals',{method:'POST',body:JSON.stringify(v)}));
window.draftOrder=(productId,quoteId)=>editor('Create Shopify draft order',[{name:'email',label:'Customer billing email',type:'email',required:true,full:true},{name:'note',label:'Internal Shopify note',value:'Created from Future Basics client hub',type:'textarea',full:true}],v=>api('/v1/admin/products/'+productId+'/shopify-draft-order',{method:'POST',body:JSON.stringify({...v,quoteId})}));
window.sendInvoice=quoteId=>editor('Send Shopify invoice',[{name:'to',label:'Recipient email',type:'email',required:true,full:true},{name:'subject',label:'Email subject',value:'Your Future Basics invoice',full:true},{name:'message',label:'Message',value:'Please review and pay your invoice using the secure Shopify checkout link.',type:'textarea',full:true}],v=>api('/v1/admin/quotes/'+quoteId+'/send-shopify-invoice',{method:'POST',body:JSON.stringify(v)}));
window.addInvoice=id=>editor('Record Shopify invoice',[{name:'number',label:'Shopify order / invoice number',required:true},{name:'amount',label:'Amount (USD)',type:'number',required:true},{name:'externalUrl',label:'Shopify invoice or payment URL',full:true},{name:'dueDate',label:'Due date',type:'date'}],v=>api('/v1/admin/clients/'+id+'/invoices',{method:'POST',body:JSON.stringify({...v,amountCents:Math.round(+v.amount*100),dueDate:v.dueDate||null,externalUrl:v.externalUrl||null})}));
</script></body></html>
