<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Future Basics — Operations</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f5f2;color:#141416}header{height:64px;background:#141416;color:white;padding:0 4vw;display:flex;align-items:center;justify-content:space-between}main{padding:42px 4vw;max-width:1400px;margin:auto}h1{font-size:clamp(40px,7vw,90px);letter-spacing:-.06em;margin:0 0 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #ddd;padding:22px}.card h2{margin:8px 0}.meta{font:10px ui-monospace;text-transform:uppercase;letter-spacing:.13em;color:#777}.stats{display:flex;gap:22px;margin-top:25px}.stats b{display:block;font-size:24px}input,button{font:inherit;padding:12px;border:1px solid #bbb}button{background:#141416;color:white;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1}.auth{max-width:600px}.hidden{display:none}.head{display:flex;justify-content:space-between;align-items:end;margin:40px 0 14px}.action{padding:14px 0;border-bottom:1px solid #ddd}</style></head>
<body><header><strong>FUTURE BASICS / OPERATIONS</strong><span id="state">secure workspace</span></header><main>
<section id="auth" class="panel auth"><h2>Staff sign in</h2><p>Use your @thefuturebasics.com email.</p><form id="send" class="row"><input id="email" type="email" required placeholder="you@thefuturebasics.com"><button>Send code</button></form><form id="verify" class="row hidden"><input id="code" required maxlength="6" placeholder="6-digit code"><button>Sign in</button></form><p id="msg"></p></section>
<section id="app" class="hidden"><span class="meta">client operations system</span><h1>Work in motion.</h1><div class="head"><h2>Clients</h2><button id="add">+ client</button></div><div id="clients" class="grid"></div><div class="head"><h2>Waiting on approval</h2></div><div id="actions" class="panel"></div></section>
</main><script>
const API=location.origin,KEY='fb.admin.token';let token=localStorage.getItem(KEY)||'';
async function api(p,o={}){o.headers=o.headers||{};if(token)o.headers.Authorization='Bearer '+token;if(o.body)o.headers['Content-Type']='application/json';let r=await fetch(API+p,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
send.onsubmit=async e=>{e.preventDefault();msg.textContent='Sending…';try{await api('/v1/auth/code',{method:'POST',body:JSON.stringify({email:email.value})});verify.classList.remove('hidden');msg.textContent='Code sent.'}catch(x){msg.textContent=x.message}};
verify.onsubmit=async e=>{e.preventDefault();try{let d=await api('/v1/auth/verify',{method:'POST',body:JSON.stringify({email:email.value,code:code.value})});token=d.token;localStorage.setItem(KEY,token);load()}catch(x){msg.textContent=x.message}};
async function load(){try{let d=await api('/v1/admin/dashboard');auth.classList.add('hidden');app.classList.remove('hidden');state.textContent='staff authenticated';clients.innerHTML=d.clients.map(c=>`<article class="card"><span class="meta">${c.slug} · ${c.status}</span><h2>${c.name}</h2><div class="stats"><span><b>${c.product_count}</b>products</span><span><b>${c.request_count}</b>requests</span></div><button style="margin-top:20px" onclick="addProduct('${c.id}','${c.name.replaceAll("'",'')}')">+ product room</button></article>`).join('');actions.innerHTML=d.actions.length?d.actions.map(a=>`<div class="action"><strong>${a.client_name}</strong> · ${a.product_title}<br>${a.title}</div>`).join(''):'Nothing is waiting for approval.'}catch(e){localStorage.removeItem(KEY);token=''}}
add.onclick=async()=>{let name=prompt('Client name');if(!name)return;let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');let domains=(prompt('Approved email domains, comma separated')||'').split(',').map(x=>x.trim()).filter(Boolean);await api('/v1/admin/clients',{method:'POST',body:JSON.stringify({name,slug,emailDomains:domains})});load()};
window.addProduct=async(id,name)=>{let title=prompt('New product for '+name);if(!title)return;await api('/v1/admin/clients/'+id+'/products',{method:'POST',body:JSON.stringify({title})});load()};if(token)load();
</script></body></html>
