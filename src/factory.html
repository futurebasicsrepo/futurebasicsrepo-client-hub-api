<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your tech packs · Future Basics</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#141416;--dim:#6f6f76;--line:#d9d8d2;--bg:#f5f4ef;--paper:#fff;--cue:#2edc83;--hot:#d9342b;--warn:#b87d00;--ok:#0b6b3e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Space Grotesk',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}.hidden{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ink);color:#fff}
header .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}header .grow{flex:1}
header button{border:1px solid #555;background:#222;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:22px 14px 70px}
h1{font-size:26px;line-height:1.15;margin:4px 2px 6px;text-wrap:balance}
.lede{color:var(--dim);margin:0 2px 20px;font-size:15px;max-width:60ch}
.list{display:grid;gap:12px}
.pack{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;transition:transform .15s,box-shadow .15s}
.pack:hover,.pack:focus-visible{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,20,22,.08);outline:none}
.pack:focus-visible{border-color:var(--ink)}
.pic{width:96px;height:96px;border-radius:12px;background:#ecebe5 center/cover no-repeat;border:1px solid var(--line)}
.pack b{font-size:18px;display:block;line-height:1.2}
.sub{color:var(--dim);font-size:13px;margin-top:3px}
.state{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;background:#ecebe5}
.state i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.state.quoted i,.state.signed i{background:var(--ok)}.state.closed i{background:#b9b8b0}
.state.needs-quote i,.state.to-review i{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.state i{animation:none!important}.pack{transition:none}}
.empty,.err{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:34px 18px;text-align:center;color:var(--dim)}
.err{color:var(--hot);border-color:var(--hot)}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--dim);font-size:12px}
@media (max-width:420px){.pack{grid-template-columns:78px 1fr}.pic{width:78px;height:78px}}
.invite{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 22px}
.invite h2{margin:0 0 6px;font-size:18px}.invite p{margin:0 0 10px;color:var(--dim);font-size:14px;max-width:56ch}.invite .row{display:flex;gap:8px;flex-wrap:wrap}
.invite input{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfbf8}
.invite button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
#invQr img{display:block;width:120px;height:120px;border-radius:8px;border:1px solid var(--line);padding:4px;background:#fff}
.tagnew{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;background:#fde8e6;color:var(--hot);font-size:11px;font-weight:600}.tagref{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;background:#e6f4ec;color:var(--ok);font-size:11px;font-weight:600}
#action.actionline{display:inline-flex;margin:-8px 2px 18px;border-radius:999px;padding:6px 14px;background:#fde8e6;color:var(--hot);font-weight:600;font-size:14px}
.share h3{margin:14px 0 4px;font-size:15px}.share textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfbf8;resize:vertical;margin:0 0 8px}.share .row{margin:0 0 4px}
h2.lh{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:6px 2px 10px;font-weight:600}
@media (max-width:560px){.invite{grid-template-columns:1fr}#invQr{justify-self:start}}
</style>
</head>
<body>
<header><span class="brand">Future Basics</span><span class="grow"></span><button id="lang" type="button" aria-label="Language">中文</button></header>
<main>
  <h1 id="title">Your tech packs</h1>
  <p class="lede" id="lede"></p>
  <p id="action" class="actionline hidden"></p>
  <section id="invite" class="invite hidden"><div><h2 id="invTitle"></h2><p id="invText"></p><div class="row"><input id="invLink" readonly aria-label="Link"><button id="invCopy" type="button"></button></div><p id="invCount" style="margin:10px 0 0"></p></div><div id="invQr" aria-hidden="true"></div></section>
  <section id="share" class="invite share hidden"><div style="grid-column:1/-1"><h2 id="shTitle"></h2>
    <h3 id="buyH"></h3><p id="buyP"></p><textarea id="buyMsg" readonly rows="5" aria-labelledby="buyH"></textarea><div class="row"><button id="buyCopy" type="button"></button></div>
    <h3 id="fcH"></h3><p id="fcP"></p><textarea id="fcMsg" readonly rows="5" aria-labelledby="fcH"></textarea><div class="row"><button id="fcCopy" type="button"></button></div></div></section>
  <h2 class="lh hidden" id="listHead"></h2>
  <div id="list" class="list"><div class="empty" id="loading">…</div></div>
</main>
<footer id="foot"></footer>
<script src="/qrcode.js"></script>
<script>
const T={
  en:{shTitle:'Bring in more buyers',copyMsg:'Copy message',buyH:'For your buyers, including on Alibaba',buyP:'Paste this into a chat with a buyer. They send a photo or a listing, get a clear tech pack, and you quote from it.',buyMsg:l=>`Hi, so that I quote exactly what you want, I work from a tech pack. Send me your photo or listing here and you get one free, in a few minutes: ${l}`,fcH:'For other factories',fcP:'Send this to a friend or colleague. They get their own page and link, free.',fcMsg:l=>`A free tool that turns a buyer's photo or Alibaba listing into a clear tech pack for the factory, in Chinese, so there are fewer sample rounds: ${l}`,inv:'Your customers',invText:'Send this link to your own customers. They start a tech pack, Future Basics finishes it, and it appears below once it is published, ready for your quote. You see the product and where it stands, never the customer\'s name or email.',copy:'Copy link',copied:'Copied',started:n=>`${n} tech pack${n===1?'':'s'} started through your link so far`,head:'Tech packs for you',fromYou:'From your customer',newmsg:'New message',hello:n=>`${n}: your tech packs`,action:n=>`${n} need${n===1?'s':''} your action`,lede:'Every tech pack Future Basics has sent you is here. Open one to read it, give a price, or confirm you can make it. It is free, and no account is needed.',none:'Nothing is assigned to you yet. When Future Basics sends you a tech pack it appears here.',bad:'This link is not valid any more. Ask Future Basics for a new one.',slow:'Could not load. Check your connection and try again.',v:v=>`Version ${v}`,'needs-quote':'Waiting for your quote','quoted':'Quote sent · open to change it','to-review':'To read and confirm','signed':'Confirmed','closed':'Not needed right now','forquote':'For quotation','toproduce':'To produce',foot:'This page is private to you. Keep the link to yourself.',other:'中文',since:d=>`Sent ${d}`},
  zh:{shTitle:'带来更多买家',copyMsg:'复制消息',buyH:'给您的买家（包括阿里巴巴上的买家）',buyP:'把这段话发给买家。他们发来照片或商品链接，就能得到清楚的技术包，您照此报价。',buyMsg:l=>`您好，为了准确按您的要求报价，我用技术包来沟通。请在这里发来您的照片或商品链接，几分钟就能免费得到一份：${l}`,fcH:'给其他工厂',fcP:'发给朋友或同行。他们免费获得自己的页面和链接。',fcMsg:l=>`一个免费工具：把买家的照片或阿里巴巴链接变成工厂看得懂的中文技术包，减少反复打样：${l}`,inv:'您的客户',invText:'把这个链接发给您自己的客户。他们开始技术包，Future Basics 完善并发布后，会出现在下方，供您报价。您只能看到产品和进度，看不到客户的姓名或邮箱。',copy:'复制链接',copied:'已复制',started:n=>`通过您的链接已开始 ${n} 个技术包`,head:'给您的技术包',fromYou:'来自您的客户',newmsg:'有新消息',hello:n=>`${n}：您的技术包`,action:n=>`${n} 个需要您处理`,lede:'Future Basics 发给您的所有技术包都在这里。打开即可查看、报价或确认能否生产。免费，无需注册账号。',none:'目前没有分配给您的技术包。Future Basics 发给您后会显示在这里。',bad:'此链接已失效，请向 Future Basics 索取新链接。',slow:'无法加载，请检查网络后重试。',v:v=>`版本 ${v}`,'needs-quote':'等待您的报价','quoted':'已报价 · 可点开修改','to-review':'待阅读并确认','signed':'已确认','closed':'暂不需要','forquote':'询价','toproduce':'生产',foot:'此页面仅供您本人使用，请勿转发链接。',other:'English',since:d=>`发送于 ${d}`}
};
const token=location.pathname.split('/')[2]||'';
let lang=(()=>{try{const s=localStorage.getItem('fb.factory.lang');if(s==='en'||s==='zh')return s}catch{}return /^zh/i.test(navigator.language||'')?'zh':'en'})();
let data=null,failed='';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
  const t=T[lang];document.documentElement.lang=lang==='zh'?'zh-Hans':'en';$('lang').textContent=t.other;$('lede').textContent=t.lede;$('foot').textContent=t.foot;
  if(failed){$('title').textContent='Future Basics';$('list').innerHTML=`<div class="err">${esc(t[failed])}</div>`;$('lede').textContent='';return}
  if(!data){return}
  $('title').textContent=t.hello(data.factory);
  $('action').textContent=t.action(data.needsAction||0);$('action').classList.toggle('hidden',!data.needsAction);document.title=(data.needsAction?`(${data.needsAction}) `:'')+`${data.factory} · Future Basics`;
  $('invite').classList.toggle('hidden',!data.startLink);$('listHead').classList.toggle('hidden',!data.startLink);
  if(data.startLink){$('invTitle').textContent=t.inv;$('invText').textContent=t.invText;$('invLink').value=data.startLink;$('invCopy').textContent=t.copy;$('invCount').textContent=t.started(data.started||0);$('listHead').textContent=t.head;
    if(window.qrcode&&$('invQr').dataset.for!==data.startLink){try{const qr=qrcode(0,'M');qr.addData(data.startLink);qr.make();$('invQr').innerHTML=qr.createImgTag(5,6,'QR code');$('invQr').dataset.for=data.startLink}catch{}}}
  const sh=Boolean(data.startLink||data.fairLink);$('share').classList.toggle('hidden',!sh);
  if(sh){$('shTitle').textContent=t.shTitle;$('buyH').textContent=t.buyH;$('buyP').textContent=t.buyP;$('fcH').textContent=t.fcH;$('fcP').textContent=t.fcP;$('buyCopy').textContent=t.copyMsg;$('fcCopy').textContent=t.copyMsg;
    $('buyMsg').value=data.startLink?T.en.buyMsg(data.startLink):'';$('fcMsg').value=data.fairLink?t.fcMsg(data.fairLink):'';
    $('buyH').classList.toggle('hidden',!data.startLink);$('buyP').classList.toggle('hidden',!data.startLink);$('buyMsg').classList.toggle('hidden',!data.startLink);$('buyCopy').classList.toggle('hidden',!data.startLink)}
  $('list').innerHTML=data.packs.length?data.packs.map(p=>`<a class="pack" href="${esc(p.href)}"><div class="pic" style="background-image:url('${esc(p.image)}')" role="img" aria-label="${esc(p.title)}"></div><div><b>${esc(p.title)}${p.origin==='referral'?`<span class="tagref">${esc(t.fromYou)}</span>`:''}${p.unread?`<span class="tagnew">${esc(t.newmsg)}</span>`:''}</b><div class="sub">${esc(t.v(p.version))} · ${esc(p.kind==='quote'?t.forquote:t.toproduce)}${p.client?' · '+esc(p.client):''}</div><span class="state ${esc(p.state)}"><i></i>${esc(t[p.state]||p.state)}</span></div></a>`).join(''):`<div class="empty">${esc(t.none)}</div>`;
}
$('invCopy').onclick=()=>{const v=$('invLink').value,done=()=>{$('invCopy').textContent=T[lang].copied;setTimeout(()=>$('invCopy').textContent=T[lang].copy,1600)};try{navigator.clipboard.writeText(v).then(done).catch(()=>{$('invLink').select();document.execCommand('copy');done()})}catch{$('invLink').select();document.execCommand('copy');done()}};
const copyFrom=(btn,box)=>{btn.onclick=()=>{const done=()=>{btn.textContent=T[lang].copied;setTimeout(()=>btn.textContent=T[lang].copyMsg,1600)};box.select();try{navigator.clipboard.writeText(box.value).then(done).catch(()=>{document.execCommand('copy');done()})}catch{document.execCommand('copy');done()}}};
copyFrom($('buyCopy'),$('buyMsg'));copyFrom($('fcCopy'),$('fcMsg'));
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('fb.factory.lang',lang)}catch{}draw()};
async function load(){
  try{
    const r=await fetch(`/v1/factory/${encodeURIComponent(token)}`);
    if(r.status===404){failed='bad'}else if(!r.ok){failed='slow'}else{data=await r.json();failed=''}
  }catch{failed='slow'}
  draw();
}
draw();load();
</script>
</body>
</html>
