async function api(p,o={}){o.headers=o.headers||{};if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;if(o.body&&typeof o.body==='string')o.headers['Content-Type']='application/json';const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||'Request failed');e.status=r.status;throw e}return d}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}

const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';

function getIn(o,p){return p.reduce((a,k)=>a==null?undefined:a[k],o)}
function setIn(o,p,v){let a=o;for(let i=0;i<p.length-1;i++){if(a[p[i]]==null)a[p[i]]=typeof p[i+1]==='number'?[]:{};a=a[p[i]]}a[p[p.length-1]]=v}
const P=(...p)=>esc(JSON.stringify(p));
function F(p,opts={}){const v=getIn(S.pack,p)??'';if(RO||S.preview)return `<div class="ro">${esc(v)}</div>`;const attrs=`class="t" data-path='${P(...p)}' ${opts.ph?`placeholder="${esc(opts.ph)}"`:''}`;if(opts.area)return `<textarea ${attrs}>${esc(v)}</textarea>`;if(opts.options)return `<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${attrs} value="${esc(v)}" ${opts.type?`type="${opts.type}"`:''} ${opts.step?`step="${opts.step}"`:''}>`}
function L(label,p,opts={}){return `<label class="${opts.full?'full':''}"><span>${esc(label)}</span>${F(p,opts)}</label>`}

function rowActs(sec,i,len,extra=''){return EDIT()?`<div class="rowacts"><button type="button" title="Move up" data-act="up" data-sec="${sec}" data-i="${i}" ${extra} ${i===0?'disabled':''}>↑</button><button type="button" title="Move down" data-act="down" data-sec="${sec}" data-i="${i}" ${extra} ${i===len-1?'disabled':''}>↓</button><button type="button" title="Remove" data-act="rm" data-sec="${sec}" data-i="${i}" ${extra}>✕</button></div>`:''}

const verification=()=>MODE==='admin'?S.techPack?.verification:S.view?.techPack?.verification;

// ---- images ----
function readImage(file,max=1600){return new Promise((resolve,reject)=>{if(file.type==='image/svg+xml'){const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Could not read that SVG'));r.readAsDataURL(file);return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);const x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);let out=file.type==='image/png'||file.type==='image/webp'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86);const cap=max<=600?600_000:2_400_000;if(out.length>cap)out=cv.toDataURL('image/jpeg',.78);if(out.length>cap){const cv2=document.createElement('canvas');cv2.width=Math.round(cv.width*.7);cv2.height=Math.round(cv.height*.7);cv2.getContext('2d').drawImage(cv,0,0,cv2.width,cv2.height);out=cv2.toDataURL('image/jpeg',.76)}URL.revokeObjectURL(url);resolve(out)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('That file is not a readable image'))};img.src=url})}
const hexOf=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const rgbOf=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function nearestName(hex){const c=rgbOf(hex);let best=NAMED[0],bd=1e9;for(const n of NAMED){const d=dist(c,rgbOf(n[1]));if(d<bd){bd=d;best=n}}return best[0]}
// Dominant-colour extraction: quantise a small render, drop transparent and near-white background, merge near-duplicates.
function extractPantones(dataUrl){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const s=72,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');x.drawImage(img,0,0,s,s);const d=x.getImageData(0,0,s,s).data,bins=new Map();for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2];if(r>244&&g>244&&b>244)continue;const k=((r>>4)<<8)|((g>>4)<<4)|(b>>4);const e=bins.get(k)||{n:0,r:0,g:0,b:0};e.n++;e.r+=r;e.g+=g;e.b+=b;bins.set(k,e)}const sorted=[...bins.values()].sort((a,b)=>b.n-a.n).map(e=>[Math.round(e.r/e.n),Math.round(e.g/e.n),Math.round(e.b/e.n),e.n]);const out=[];for(const c of sorted){if(out.some(o=>dist(o,c)<42))continue;out.push(c);if(out.length>=6)break}const total=sorted.reduce((s,c)=>s+c[3],0)||1;resolve(out.filter(c=>c[3]/total>=0.02).map(c=>{const h=hexOf(c[0],c[1],c[2]);return{hex:h,name:nearestName(h),code:''}}))};img.onerror=()=>resolve([]);img.src=dataUrl})}

// ---- renderers ----
function cover(){const p=S.pack,pr=S.product,tp=S.techPack,ver=S.view?.techPack;const stamp=MODE==='admin'?(S.preview?`Published v${tp?.version} · ${fmtDate(tp?.publishedAt)}`:(tp?.version?`Draft · v${tp.version} published ${fmtDate(tp.publishedAt)}`:'Draft · not yet published')):`Version ${ver?.version} · issued ${fmtDate(ver?.publishedAt)}${ver?.lockedAt?' · locked':''}`;
  return `<div class="cover"><div><span class="stamp">Tech pack · ${esc(stamp)}</span><span class="meta" style="display:block;margin-top:10px">${esc(pr.clientName||pr.client_name||'')}${(pr.projectName||pr.project_name)?' · '+esc(pr.projectName||pr.project_name):''}</span><h1>${esc(p.style.styleName||pr.title)}</h1><div class="kv"><span><b>${esc(p.style.styleNumber||'—')}</b><small>Style no.</small></span><span><b>${esc(p.style.season||'—')}</b><small>Season</small></span><span><b>${esc(p.style.category||'—')}</b><small>Category</small></span><span><b>${esc(p.style.sampleSize||'—')}</b><small>Sample size</small></span><span><b>${esc(p.sizes.join(' · ')||'—')}</b><small>Size run</small></span><span><b>${esc(p.style.designer||'Future Basics')}</b><small>Designer</small></span></div></div>${(pr.imageUrl||pr.shopify_image_url)?`<img src="${esc(pr.imageUrl||pr.shopify_image_url)}" alt="${esc(pr.imageAlt||pr.shopify_image_alt||pr.title)}">`:''}</div>`}
function head(no,eyebrow,title,sub='',tools=''){return `<div class="block-head"><div><span class="meta">${no} · ${esc(eyebrow)}</span><h2>${title}</h2>${sub?`<span class="meta sub">${sub}</span>`:''}</div>${tools?`<div class="tools">${tools}</div>`:''}</div>`}
function panelStyle(){const revs=(S.techPack?.revisions||S.view?.techPack?.revisions||[]).slice().reverse();return `<div class="panel ${S.tab==='style'?'on':''}" data-panel="style">${cover()}<section class="block">${head('01','style summary','Style')}<div class="fields">${L('Style number',['style','styleNumber'],{ph:'FB-0001'})}${L('Style name',['style','styleName'])}${L('Season',['style','season'],{ph:'FW26'})}${L('Category',['style','category'],{ph:'Outerwear'})}${L('Designer',['style','designer'])}${L('Fit block / base pattern',['style','fitBlock'],{ph:'Regular fit, drop shoulder'})}${L('Sample size',['style','sampleSize'])}${L('Fabric summary',['style','fabricSummary'],{ph:'12oz cotton canvas, enzyme wash'})}${L('Description',['style','description'],{area:true,full:true,ph:'What this product is, who it is for, and what must be true about it.'})}</div></section><section class="block">${head('09','revision history','Revisions')}<div class="revs">${revs.map(r=>`<div class="rev"><b>v${esc(r.version)}</b><span>${esc(r.note||'Published')}</span><span class="meta">${fmtDate(r.publishedAt)} ${fmtTime(r.publishedAt)}${r.by?' · '+esc(r.by):''}</span></div>`).join('')||'<p class="meta">Not yet published.</p>'}</div></section></div>`}

function stage(sk,si,{overlays=''}={}){const pins=sk.callouts.map((c,ci)=>c.x==null?'':`<div class="pin ${ackFor(sk,c)?'ok':''} ${S.sel&&S.sel.si===si&&S.sel.ci===ci?'sel':''}" style="left:${c.x*100}%;top:${c.y*100}%" data-pin data-si="${si}" data-ci="${ci}">${c.photo?`<img class="ph" src="${c.photo}" alt="">`:''}<span class="n">${c.n}</span>${c.label?`<span class="lb">${esc(c.label)}</span>`:''}</div>`).join('');
  return `<div class="stage ${S.placing?'placing':''}" data-stage data-si="${si}">${sk.image?`<img class="base" src="${sk.image}" alt="${esc(sk.label||sk.view)}">`:`<div class="empty"><b>${EDIT()?'Drop or click to add the '+sk.view+' mockup':'No '+sk.view+' mockup'}</b>${EDIT()?'PNG, JPG or WebP · flat sketch or garment photo':''}</div>`}${EDIT()&&!sk.image?`<input type="file" accept="image/png,image/jpeg,image/webp" data-act="sketchimg" data-si="${si}">`:''}${pins}${overlays}</div>`}
function panelCalls(){const p=S.pack;if(S.sk>=p.sketches.length)S.sk=Math.max(0,p.sketches.length-1);const sk=p.sketches[S.sk];const r=readiness();
  const tabs=`<div class="viewtabs">${p.sketches.map((s,i)=>`<button type="button" class="sbtn ${i===S.sk?'on':''}" data-act="sk" data-i="${i}">${esc(s.view)}${s.label?' · '+esc(s.label):''}</button>`).join('')}${EDIT()?`<button type="button" class="sbtn" data-act="addsk">+ View</button>${sk?`<button type="button" class="sbtn ${S.placing?'on':''}" data-act="placing">${S.placing?'Click the garment to place…':'+ Callout on garment'}</button>`:''}`:''}<span class="hint">${EDIT()?'Drag pins to reposition · tap a pin to edit':(MODE==='factory'?'Acknowledge each callout below':'')}</span></div>`;
  const skFields=sk&&EDIT()?`<div class="fields" style="margin-top:10px">${L('View',['sketches',S.sk,'view'],{options:SKETCH_VIEWS})}${L('Label',['sketches',S.sk,'label'],{ph:'Front — flat'})}${L('Garment width in this image (in)',['sketches',S.sk,'garmentWidthIn'],{type:'number',step:'0.01',ph:'e.g. 22'})}<div class="f"><span>Image</span><div class="addrow" style="margin:0"><label class="sbtn" style="position:relative;overflow:hidden">Replace image<input type="file" accept="image/png,image/jpeg,image/webp" data-act="sketchimg" data-si="${S.sk}" style="position:absolute;inset:0;opacity:0"></label><button type="button" class="sbtn danger" data-act="rmsk" data-i="${S.sk}">Remove view</button></div></div></div>`:'';
  const pant=`<div class="pantones"><div class="ph"><span>Fabric Pantones · ${p.colorways.length}</span>${EDIT()?`<button type="button" class="sbtn" data-act="add" data-sec="colorways">+ Add</button>`:''}</div>${p.colorways.map((c,i)=>`<div class="pt"><div class="sw" style="background:${c.swatch||'#e6e6e2'}">${EDIT()?`<input type="color" value="${c.swatch||'#e6e6e2'}" data-path='${P('colorways',i,'swatch')}'>`:''}</div>${F(['colorways',i,'name'],{ph:'Colour name'})}${F(['colorways',i,'code'],{ph:'TCX / ref'})}${rowActs('colorways',i,p.colorways.length)}</div>`).join('')||'<div class="pt"><span class="ro" style="grid-column:1/-1">No fabric Pantones yet.</span></div>'}<div class="ph" style="border-top:1px solid var(--line);border-bottom:0;font-size:8.5px;color:var(--dim)">Black outlines = construction only</div></div>`;
  const cos=sk?`<div class="callouts">${sk.callouts.map((c,ci)=>{const ack=ackFor(sk,c);return `<div class="co ${ack?'ok':''} ${S.sel&&S.sel.si===S.sk&&S.sel.ci===ci?'sel':''}" data-co data-si="${S.sk}" data-ci="${ci}"><span class="n">${c.n}</span><div><div class="body"><div class="fields">${L('Callout',['sketches',S.sk,'callouts',ci,'label'],{ph:'Collar'})}${L('Spec',['sketches',S.sk,'callouts',ci,'spec'],{ph:'95/5 cotton spandex 1x1 rib · DTM · $0.15/unit'})}${L('Note to factory',['sketches',S.sk,'callouts',ci,'note'],{area:!RO,full:true,ph:'Bar tack both corners; match sample'})}</div><div class="thumb">${c.photo?`<img src="${c.photo}" alt="">`:(EDIT()?'Add detail photo':'No photo')}${EDIT()?`<input type="file" accept="image/png,image/jpeg,image/webp" data-act="cophoto" data-si="${S.sk}" data-ci="${ci}">`:''}</div></div><div class="foot">${MODE==='factory'?`<button type="button" class="ackbtn ${ack?'done':''}" data-act="ack" data-key="${esc(sk.id+':'+c.n)}" ${S.view?.techPack?.lockedAt?'disabled':''}>${ack?'✓ Acknowledged':'Acknowledge'}</button>`:`<span class="ack ${ack?'ok':''}">${ack?'✓ Acknowledged by '+esc(ack.by)+' · '+fmtDate(ack.at):'Awaiting factory acknowledgement'}</span>`}${EDIT()?`<span class="rowacts">${c.x==null?`<button type="button" title="Place on garment" data-act="pinit" data-si="${S.sk}" data-ci="${ci}">⌖</button>`:''}<button type="button" title="Remove" data-act="rmco" data-si="${S.sk}" data-ci="${ci}">✕</button></span>`:''}</div></div></div>`}).join('')||`<p class="meta">No callouts on this view yet.${EDIT()?' Use “+ Callout on garment”.':''}</p>`}${EDIT()?`<div class="addrow"><button type="button" class="sbtn" data-act="addco" data-si="${S.sk}">+ Callout (place later)</button></div>`:''}</div>`:'';
  return `<div class="panel ${S.tab==='calls'?'on':''}" data-panel="calls"><section class="block">${head('02','callouts','Callouts',r?`${r.callouts.length-r.pendingCalloutKeys.length} of ${r.callouts.length} acknowledged by factory · v${r.version}`:'')}${tabs}${sk?stage(sk,S.sk):`<div class="stage"><div class="empty"><b>No garment views yet</b>${EDIT()?'Add a front and a back view to start placing callouts.':''}</div></div>`}${skFields}${pant}${cos}</section></div>`}
function panelPoms(){const p=S.pack,sample=p.style.sampleSize;return `<div class="panel ${S.tab==='poms'?'on':''}" data-panel="poms"><section class="block">${head('03','measurements','Points of Measure',`Sample size ${esc(sample||'—')} · all in inches`,EDIT()?`<label class="f" style="min-width:240px"><span>Size run (comma separated)</span><input class="t" id="sizesInput" value="${esc(p.sizes.join(', '))}"></label>`:'')}<div class="tablewrap"><table class="tp"><thead><tr><th>Code</th><th style="min-width:160px">POM</th><th style="min-width:180px">How to measure</th>${p.sizes.map(s=>`<th class="${s===sample?'sample':''}">${s===sample?'Spec ('+esc(s)+')':esc(s)}</th>`).join('')}<th>Tolerance</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.pom.map((r,i)=>`<tr><td class="num">${F(['pom',i,'code'])}</td><td>${F(['pom',i,'name'])}</td><td>${F(['pom',i,'how'],{area:!RO})}</td>${p.sizes.map(s=>`<td class="num ${s===sample?'sample':''}">${F(['pom',i,'values',s])}</td>`).join('')}<td class="num">${F(['pom',i,'tolerance'],{ph:'±0.5'})}</td>${EDIT()?`<td>${rowActs('pom',i,p.pom.length)}</td>`:''}</tr>`).join('')||`<tr><td colspan="${5+p.sizes.length}" class="meta" style="padding:14px">No measurements yet.</td></tr>`}</tbody></table></div>${addBtn('pom','Measurement')}</section></div>`}
function panelArt(){const p=S.pack;if(S.artSk>=p.sketches.length)S.artSk=0;const sk=p.sketches[S.artSk];

  const overlays=sk?p.artwork.flatMap((a,ai)=>a.placements.map((pl,pi)=>pl.sketchId!==sk.id?'':`<div class="art-overlay" style="left:${pl.x*100}%;top:${pl.y*100}%;width:${pl.widthIn&&sk.garmentWidthIn?Math.min(100,pl.widthIn/sk.garmentWidthIn*100):25}%" data-ov data-ai="${ai}" data-pi="${pi}"><img src="${a.image}" alt=""><span class="tag">${esc(a.name||'art')} · ${inch(pl.widthIn)}</span></div>`)).join(''):'';
  const placements=sk?p.artwork.flatMap((a,ai)=>a.placements.map((pl,pi)=>pl.sketchId!==sk.id?'':`<div class="placement"><span class="meta">${esc(a.name||'Artwork')} on ${esc(sk.view)}</span>${EDIT()?`<div class="fields" style="grid-template-columns:1fr 1fr">${L('Width (in)',['artwork',ai,'placements',pi,'widthIn'],{type:'number',step:'0.01',ph:'3.5'})}${L('Label',['artwork',ai,'placements',pi,'label'],{ph:'Left chest'})}</div>`:`<strong>${esc(pl.label||'Placement')}</strong>`}<span class="meta">Width ${inch(pl.widthIn)}${sk.garmentWidthIn?` · ${inch(pl.x*sk.garmentWidthIn)} from left · ${inch(pl.y*sk.garmentWidthIn*(stageRatio(sk)))} from top`:' · set garment width on the view for true scale'}</span>${EDIT()?`<div class="rowacts"><button type="button" data-act="rmpl" data-ai="${ai}" data-pi="${pi}" title="Remove placement">✕</button></div>`:''}</div>`)).join(''):'';
  return `<div class="panel ${S.tab==='art'?'on':''}" data-panel="art"><section class="block">${head('04','artwork & colour','Pantone Extraction','Dominant colours are pulled from each file · add TCX codes to lock the match')}${EDIT()?`<label class="upload"><b>Upload artwork</b><span class="meta">PNG, JPG, SVG or WebP · 300 DPI recommended</span><input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-act="artfile" multiple></label>`:''}<div class="arts" style="margin-top:12px">${cards||'<p class="meta">No artwork uploaded yet.</p>'}</div></section><section class="block">${head('05','placement','Position on Garment',sk?`True scale · garment width ${sk.garmentWidthIn?inch(sk.garmentWidthIn):'not set'} (${esc(sk.view)})`:'Add a garment view first')}${p.sketches.length?`<div class="viewtabs">${p.sketches.map((s,i)=>`<button type="button" class="sbtn ${i===S.artSk?'on':''}" data-act="artsk" data-i="${i}">${esc(s.view)}</button>`).join('')}<span class="hint">${EDIT()?'Drag artwork to position · set width in inches':''}</span></div><div class="place">${stage(sk,S.artSk,{overlays})}<div class="side">${placements||'<p class="meta">No artwork placed on this view.'+(EDIT()?' Use “Place on …” on an artwork card.':'')+'</p>'}</div></div>`:''}</section></div>`}
function stageRatio(sk){const img=document.querySelector(`.stage[data-si] img.base`);return img&&img.naturalWidth?img.naturalHeight/img.naturalWidth:1}
function panelBom(){const p=S.pack;return `<div class="panel ${S.tab==='bom'?'on':''}" data-panel="bom"><section class="block">${head('06','bill of materials','Materials & Trims')}<div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:140px">Component</th><th style="min-width:140px">Material</th><th style="min-width:160px">Spec</th><th>Supplier</th><th>Ref</th><th>Color</th><th>Placement</th><th>Qty</th><th>Unit</th><th style="min-width:120px">Notes</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.bom.map((r,i)=>`<tr>${['component','material','spec','supplier','ref','color','placement','qty','unit','notes'].map(k=>`<td class="${k==='qty'||k==='unit'?'num':''}">${F(['bom',i,k],{area:!RO&&(k==='spec'||k==='notes')})}</td>`).join('')}${EDIT()?`<td>${rowActs('bom',i,p.bom.length)}</td>`:''}</tr>`).join('')||'<tr><td colspan="11" class="meta" style="padding:14px">No materials yet.</td></tr>'}</tbody></table></div>${addBtn('bom','Material / trim')}</section><section class="block">${head('07','construction','Construction')}<div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:150px">Area</th><th>Detail — stitch, seam, thread, SPI, finish</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.construction.map((r,i)=>`<tr><td>${F(['construction',i,'area'],{ph:'Side seams'})}</td><td>${F(['construction',i,'detail'],{area:!RO,ph:'Flat-felled, 12 SPI, tex 40 poly-core'})}</td>${EDIT()?`<td>${rowActs('construction',i,p.construction.length)}</td>`:''}</tr>`).join('')||'<tr><td colspan="3" class="meta" style="padding:14px">No construction details yet.</td></tr>'}</tbody></table></div>${addBtn('construction','Construction detail')}</section><section class="block">${head('08','labels, packaging & care','Labels, Packaging & Care')}<div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:140px">Label / item</th><th>Spec</th><th style="min-width:150px">Placement</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.labels.map((r,i)=>`<tr><td>${F(['labels',i,'item'])}</td><td>${F(['labels',i,'spec'],{area:!RO})}</td><td>${F(['labels',i,'placement'])}</td>${EDIT()?`<td>${rowActs('labels',i,p.labels.length)}</td>`:''}</tr>`).join('')||'<tr><td colspan="4" class="meta" style="padding:14px">No labels yet.</td></tr>'}</tbody></table></div>${addBtn('labels','Label')}<h3 style="margin:20px 0 8px;font-weight:500">Packaging</h3><div class="fields">${L('Fold',['packaging','fold'])}${L('Polybag',['packaging','polybag'])}${L('Carton',['packaging','carton'])}${L('Units per carton',['packaging','unitsPerCarton'])}${L('Packaging notes',['packaging','notes'],{area:true,full:true})}</div><h3 style="margin:20px 0 8px;font-weight:500">Care &amp; compliance</h3><div class="fields">${L('Fiber content',['care','fiber'])}${L('Country of origin',['care','countryOfOrigin'])}${L('Care instructions',['care','instructions'],{area:true,full:true,ph:'Machine wash cold, inside out. Tumble dry low. Do not bleach. Cool iron.'})}${L('Compliance / testing',['care','compliance'],{area:true,full:true,ph:'CPSIA, Prop 65, RN number, testing requirements'})}</div><h3 style="margin:20px 0 8px;font-weight:500">Notes to factory</h3>${F(['notes'],{area:true,ph:'Sampling requests, approvals required before bulk, packaging of samples, shipping marks.'})}</section></div>`}
function panelSign(){const r=readiness(),v=verification(),tp=S.techPack,locked=Boolean(MODE==='admin'?tp?.lockedAt:S.view?.techPack?.lockedAt),published=MODE==='admin'?Boolean(tp?.publishedAt):true,draftEdits=MODE==='admin'&&tp?.publishedAt&&(S.dirty||new Date(tp.updatedAt)>new Date(tp.publishedAt));
  const checks=r?`<div class="checks">${r.checks.map(c=>`<div class="check ${c.ok?'ok':'no'}"><span class="box">${c.ok?'✓':'✕'}</span><span><b>${esc(c.label)}</b><small>${esc(c.detail)}</small></span></div>`).join('')}</div>`:`<p class="note">Publish the tech pack to start the readiness check and the factory acknowledgement chain.</p>`;
  const brand=v?.brandSign,factory=v?.factorySign;
  const brandBox=`<div class="sig"><div class="sh"><span class="meta">Approval 01</span><b>Future Basics (Design)</b></div><div class="sb"><p>By signing, Future Basics confirms the tech pack is complete and accurate. The factory may begin sample production.</p>${brand?`<div class="sigline done">${esc(brand.name)}<small>Signed ${fmtDate(brand.at)} ${fmtTime(brand.at)}${brand.by?' · '+esc(brand.by):''}</small></div>`:MODE==='admin'&&published?`<div class="sigline">Awaiting signature</div><form id="brandSign" class="fields" style="grid-template-columns:minmax(0,1fr) auto"><input class="t" name="name" required placeholder="Type your full name"><button class="sbtn dark">Sign as Future Basics</button></form>`:'<div class="sigline">Awaiting signature</div>'}</div></div>`;
  const pending=r?r.pendingCalloutKeys.length:0;
  const factoryBox=`<div class="sig factory"><div class="sh"><span class="meta">Approval 02 · Factory countersign</span><b>${esc(factory?.by||S.view?.shareLabel||'Factory')}</b></div><div class="sb"><p>By signing, the factory confirms it can produce this style to spec. Once both signatures are in, the tech pack locks — changes require a new version.</p>${factory?`<div class="sigline done">${esc(factory.name)}<small>Countersigned ${fmtDate(factory.at)} ${fmtTime(factory.at)}${factory.by?' · '+esc(factory.by):''}</small></div>`:MODE==='factory'?`<div class="sigline">Awaiting your countersignature</div>${pending?`<p class="note">Acknowledge all callouts first — ${pending} still pending in the Calls tab.</p>`:''}<form id="factorySign" class="fields" style="grid-template-columns:minmax(0,1fr) auto"><input class="t" name="name" required placeholder="Type your full name" ${pending?'disabled':''}><button class="sbtn dark" ${pending?'disabled':''}>Countersign as ${esc(S.view?.shareLabel||'factory')}</button></form>`:'<div class="sigline">Awaiting factory countersignature</div>'}</div></div>`;
  const access=MODE==='admin'?`<section class="block noprint">${head('11','access','Who can see this')}<p><strong>Client:</strong> ${published?`${esc(S.product.client_name)} can open v${tp.version} from their hub.`:'Not visible to the client until you publish.'}</p><p><strong>Factories:</strong> private links to the published version. The factory acknowledges callouts and countersigns through its link. Revoke any link at any time.</p><div class="shares">${S.shares.map(s=>`<div class="share ${s.active?'':'off'}"><span><b>${esc(s.label)}${s.email?' · '+esc(s.email):''}</b><small>Created ${fmtDate(s.createdAt)} · ${s.expiresAt?'expires '+fmtDate(s.expiresAt):'no expiry'} · ${s.viewCount} view${s.viewCount===1?'':'s'}${s.lastViewedAt?', last '+fmtDate(s.lastViewedAt):''}${s.revokedAt?' · revoked':(!s.active?' · expired':'')}</small></span>${s.active?`<button type="button" class="sbtn danger" data-act="revoke" data-id="${s.id}">Revoke</button>`:''}</div>`).join('')||'<p class="meta">No factory links yet.</p>'}</div>${published?`<form class="newlink" id="shareForm"><label class="f"><span>Label (factory name)</span><input class="t" name="label" required placeholder="Mill A — Guangzhou"></label><label class="f"><span>Contact email (optional)</span><input class="t" name="email" type="email" placeholder="production@factory.com"></label><label class="f"><span>Expires</span><select class="t" name="expiresDays"><option value="0">Never</option><option value="30">30 days</option><option value="90" selected>90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></label><button class="sbtn dark">Create factory link</button></form><div id="linkOut"></div>`:'<p class="meta">Publish first to create factory links.</p>'}</section>`:'';
  return `<div class="panel ${S.tab==='sign'?'on':''}" data-panel="sign"><section class="block">${head('10','sign-off','Tech Pack Sign-Off',r?`Version ${r.version} · both signatures required to lock the tech pack for production`:'Both signatures required to lock the tech pack for production')}${locked?`<div class="lock">✓ Locked for production — v${r?.version} signed by both parties${draftEdits?'. Your draft has unpublished edits; publishing creates v'+(tp.version+1)+' and restarts the chain.':''}</div>`:draftEdits?`<p class="note">Readiness reflects published v${tp.version}. Your draft has unpublished edits — publish to send them to the factory (this restarts acknowledgements).</p>`:''}<span class="meta" style="display:block;margin-bottom:8px">Readiness check</span>${checks}${brandBox}${factoryBox}</section>${access}</div>`}
function render(){$('#sheet').innerHTML=panelStyle()+panelCalls()+panelPoms()+panelArt()+panelBom()+panelSign();renderTabs();renderActs();
  const p=S.pack;$('#printHeader').innerHTML=`Future Basics · Tech pack · ${esc(p.style.styleNumber||'')} ${esc(p.style.styleName||S.product.title)} · ${esc(p.style.season||'')} · ${MODE==='admin'?(S.preview?'v'+S.techPack?.version:'DRAFT'):'v'+S.view?.techPack?.version} · printed ${fmtDate(new Date())}`}
function renderTabs(){const r=readiness();const badge={calls:r&&r.pendingCalloutKeys.length?'●':'',sign:r?.locked?'✓':''};$('#tabs').innerHTML=TABS.map(([k,l,d])=>`<button type="button" class="${S.tab===k?'on':''}" data-tab="${k}"><svg viewBox="0 0 24 24"><path d="${d}" stroke-linecap="round" stroke-linejoin="round"/></svg><b>${esc(l)}${badge[k]?' '+badge[k]:''}</b></button>`).join('')}
function showTab(k){S.tab=k;document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('on',el.dataset.panel===k));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));scrollTo({top:0,behavior:'auto'})}
function renderActs(){const a=$('#acts');const p=S.pack;
  if(MODE==='admin'){const tp=S.techPack,edits=tp?.publishedAt&&(S.dirty||new Date(tp.updatedAt)>new Date(tp.publishedAt));a.innerHTML=`<span class="status ${tp?.lockedAt?'locked':tp?.publishedAt?(edits?'edits':'live'):''}">${tp?.lockedAt?`v${tp.version} locked`:tp?.publishedAt?(edits?`v${tp.version} live · edits`:`v${tp.version} live`):'draft'}${S.saving?' · saving…':S.dirty?' · unsaved':''}</span>${tp?.publishedAt?`<button class="btn" data-act="preview">${S.preview?'Edit draft':'Preview v'+tp.version}</button>`:''}<button class="btn" data-act="print">PDF</button><button class="btn" data-act="save" ${S.preview?'disabled':''}>Save</button><button class="btn primary" data-act="publish" ${S.preview?'disabled':''}>${tp?.publishedAt?'Publish v'+(tp.version+1):'Publish'}</button><a class="btn" href="${esc(S.workHubUrl||'')}/clients/${esc(S.product.client_id)}">← Room</a>`}
  else if(MODE==='client')a.innerHTML=`<span class="status ${S.view.techPack.lockedAt?'locked':'live'}">v${S.view.techPack.version}${S.view.techPack.lockedAt?' · locked':''}</span><button class="btn" data-act="print">PDF</button><a class="btn" href="/">← Projects</a>`;
  else a.innerHTML=`<span class="status ${S.view.techPack.lockedAt?'locked':'live'}">v${S.view.techPack.version}${S.view.techPack.lockedAt?' · locked':''}</span><button class="btn" data-act="print">PDF</button>`;
  $('#crumb').textContent=`Working on: ${p.style.styleNumber?p.style.styleNumber+' · ':''}${S.product.title}${MODE==='factory'&&S.view.shareLabel?' · for '+S.view.shareLabel:''}`}

// ---- mutations ----
function markDirty(){if(!EDIT())return;S.dirty=true;renderActs();clearTimeout(saveTimer);saveTimer=setTimeout(save,1400)}
async function save(){if(!EDIT()||S.saving)return;clearTimeout(saveTimer);S.saving=true;renderActs();try{const d=await api(`/v1/admin/products/${S.product.id}/tech-pack`,{method:'PUT',body:JSON.stringify({data:S.pack})});S.techPack=d.techPack;S.pack=d.techPack.data;S.completeness=d.completeness;S.dirty=false;S.lastSaved=new Date()}catch(e){toast('Save failed — '+e.message);S.dirty=true}finally{S.saving=false;renderActs()}}
function rerender(){render();}
function newRow(sec){const sizes=S.pack.sizes;return{pom:{code:'',name:'',how:'',tolerance:'±0.5',values:Object.fromEntries(sizes.map(s=>[s,'']))},bom:{component:'',material:'',spec:'',supplier:'',ref:'',color:'',placement:'',qty:'',unit:'',notes:''},construction:{area:'',detail:''},colorways:{name:'',code:'',swatch:'#8a9a5b',notes:''},labels:{item:'',spec:'',placement:''}}[sec]}
function newSketch(){const views=S.pack.sketches.map(s=>s.view);return{id:Math.random().toString(36).slice(2,10),view:!views.includes('front')?'front':!views.includes('back')?'back':'detail',label:'',image:'',garmentWidthIn:null,callouts:[]}}
function nextN(sk){return sk.callouts.reduce((m,c)=>Math.max(m,c.n),0)+1}
function applySizes(text){const sizes=[...new Set(String(text).split(',').map(s=>s.trim()).filter(Boolean))].slice(0,14);if(!sizes.length)return;S.pack.sizes=sizes;S.pack.pom.forEach(r=>{r.values=Object.fromEntries(sizes.map(s=>[s,r.values?.[s]||'']))});if(!sizes.includes(S.pack.style.sampleSize))S.pack.style.sampleSize=sizes[Math.floor(sizes.length/2)];rerender();markDirty()}
async function publish(){if(S.preview)return;const c=S.completeness||{missing:[]};const msg=(S.techPack?.publishedAt?`Publish v${S.techPack.version+1}? The client and every factory link move to it, and the acknowledgement chain restarts.`:'Publish this tech pack? The client will be able to open it from their hub, and you can create factory links.')+(c.missing?.length?`\n\nStill missing: ${c.missing.join(', ')}. You can publish anyway.`:'');if(!confirm(msg))return;const note=prompt('Revision note (what changed):','')??'';try{if(S.dirty||!S.techPack)await save();const d=await api(`/v1/admin/products/${S.product.id}/tech-pack/publish`,{method:'POST',body:JSON.stringify({note})});S.techPack=d.techPack;toast(`Published v${d.techPack.version}`);rerender()}catch(e){toast(e.message)}}
async function brandSign(form){const name=new FormData(form).get('name');try{const d=await api(`/v1/admin/products/${S.product.id}/tech-pack/sign`,{method:'POST',body:JSON.stringify({name})});S.techPack=d.techPack;toast(d.techPack.lockedAt?'Signed — tech pack is locked for production':'Signed as Future Basics');rerender()}catch(e){toast(e.message)}}
async function factoryAct(pathSuffix,body){try{const v=await api(`/v1/tp/${encodeURIComponent(tokenMatch[1])}/${pathSuffix}`,{method:'POST',body:JSON.stringify(body)});S.view=v;S.pack=v.techPack.data;rerender();return v}catch(e){toast(e.message);return null}}
async function createShare(form){const fd=new FormData(form),btn=form.querySelector('button');btn.disabled=true;try{const d=await api(`/v1/admin/products/${S.product.id}/tech-pack/shares`,{method:'POST',body:JSON.stringify({label:fd.get('label'),email:fd.get('email'),expiresDays:Number(fd.get('expiresDays'))})});S.shares.unshift(d.share);rerender();showTab('sign');$('#linkOut').innerHTML=`<div class="linkout"><span class="meta">Factory link for ${esc(d.share.label)} — copy it now, it is only shown once</span><div class="row"><input class="t" id="shareUrl" readonly value="${esc(d.url)}"><button type="button" class="sbtn" data-act="copy">Copy</button></div></div>`}catch(e){toast(e.message);btn.disabled=false}}
async function revoke(id){if(!confirm('Revoke this factory link? Anyone with it loses access immediately.'))return;try{const d=await api(`/v1/admin/tech-pack-shares/${id}`,{method:'DELETE'});S.shares=S.shares.map(s=>s.id===id?d.share:s);rerender();showTab('sign');toast('Link revoked')}catch(e){toast(e.message)}}
async function addArtwork(files){for(const file of files){try{const image=await readImage(file,1800);const art={id:Math.random().toString(36).slice(2,10),name:file.name.replace(/\.[^.]+$/,'').slice(0,120),image,pantones:[],placements:[]};art.pantones=await extractPantones(image);S.pack.artwork.push(art)}catch(e){toast(e.message)}}rerender();showTab('art');markDirty()}

// ---- pointer: drag pins and artwork overlays; click to place ----
let drag=null;
function stageXY(stageEl,e){const r=stageEl.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}}
document.addEventListener('pointerdown',e=>{if(!EDIT())return;const pin=e.target.closest('[data-pin]'),ov=e.target.closest('[data-ov]');const el=pin||ov;if(!el)return;e.preventDefault();drag={el,stage:el.closest('[data-stage]'),moved:false,kind:pin?'pin':'ov'};el.classList.add('dragging');el.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;const {x,y}=stageXY(drag.stage,e);drag.moved=true;drag.el.style.left=x*100+'%';drag.el.style.top=y*100+'%';drag.x=x;drag.y=y});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;d.el.classList.remove('dragging');if(d.moved&&d.x!=null){if(d.kind==='pin'){const c=S.pack.sketches[+d.el.dataset.si].callouts[+d.el.dataset.ci];c.x=d.x;c.y=d.y}else{const pl=S.pack.artwork[+d.el.dataset.ai].placements[+d.el.dataset.pi];pl.x=d.x;pl.y=d.y}markDirty();if(d.kind==='ov')rerender()}else if(d.kind==='pin'){S.sel={si:+d.el.dataset.si,ci:+d.el.dataset.ci};rerender();document.querySelector('.co.sel')?.scrollIntoView({behavior:'smooth',block:'center'})}});

// ---- events ----
document.addEventListener('input',e=>{const el=e.target,raw=el.getAttribute('data-path');if(!raw||!EDIT())return;const p=JSON.parse(raw);let v=el.value;if(el.type==='number')v=v===''?null:Number(v);setIn(S.pack,p,v);if(p[0]==='colorways'&&p[2]==='swatch')el.parentElement.style.background=el.value;markDirty()});
document.addEventListener('change',async e=>{const el=e.target,act=el.dataset.act;if(el.id==='sizesInput'){applySizes(el.value);return}if(!EDIT())return;
  if(act==='sketchimg'){const f=el.files?.[0];if(!f)return;try{S.pack.sketches[+el.dataset.si].image=await readImage(f,1600);rerender();markDirty()}catch(x){toast(x.message)}}
  if(act==='cophoto'){const f=el.files?.[0];if(!f)return;try{S.pack.sketches[+el.dataset.si].callouts[+el.dataset.ci].photo=await readImage(f,480);rerender();markDirty()}catch(x){toast(x.message)}}
  if(act==='artfile'){const files=[...(el.files||[])];if(files.length)addArtwork(files)}
  if(el.closest('[data-path]')&&(el.type==='number')){/* handled by input */}
});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){showTab(tab.dataset.tab);return}
  const b=e.target.closest('[data-act]');
  // click on a stage while placing → new callout at that point
  const st=e.target.closest('[data-stage]');if(st&&S.placing&&!b&&!e.target.closest('[data-pin],[data-ov]')){const {x,y}=stageXY(st,e);const sk=S.pack.sketches[+st.dataset.si];sk.callouts.push({n:nextN(sk),label:'',spec:'',note:'',photo:'',x,y});S.placing=false;S.sel={si:+st.dataset.si,ci:sk.callouts.length-1};rerender();markDirty();setTimeout(()=>{document.querySelector('.co.sel input.t')?.focus()},0);return}
  if(!b)return;const act=b.dataset.act,sec=b.dataset.sec,i=Number(b.dataset.i);
  if(act==='print'){window.print();return}
  if(act==='save'){save();return}
  if(act==='publish'){publish();return}
  if(act==='preview'){S.preview=!S.preview;S.pack=S.preview?S.techPack.publishedData:S.techPack.data;rerender();return}
  if(act==='revoke'){revoke(b.dataset.id);return}
  if(act==='copy'){const inp=$('#shareUrl');navigator.clipboard?.writeText(inp.value).then(()=>toast('Link copied')).catch(()=>{inp.select();document.execCommand('copy');toast('Link copied')});return}
  if(act==='sk'){S.sk=i;S.sel=null;S.placing=false;rerender();showTab('calls');return}
  if(act==='artsk'){S.artSk=i;rerender();showTab('art');return}
  if(act==='ack'){factoryAct('ack',{key:b.dataset.key,acknowledged:!b.classList.contains('done')}).then(v=>{if(v)showTab('calls')});return}
  if(!EDIT())return;
  const arr=sec?S.pack[sec]:null;
  if(act==='add'){arr.push(newRow(sec));rerender();showTab(S.tab);markDirty();setTimeout(()=>{const last=document.querySelector(`.panel.on table tbody tr:last-child input.t, .panel.on .pt:last-child input.t`);last?.focus()},0);return}
  if(act==='rm'){arr.splice(i,1);rerender();showTab(S.tab);markDirty();return}
  if(act==='up'&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];rerender();showTab(S.tab);markDirty();return}
  if(act==='down'&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];rerender();showTab(S.tab);markDirty();return}
  if(act==='addsk'){S.pack.sketches.push(newSketch());S.sk=S.pack.sketches.length-1;rerender();showTab('calls');markDirty();return}
  if(act==='rmsk'){const sk=S.pack.sketches[i];if(!confirm(`Remove the ${sk.view} view and its ${sk.callouts.length} callout${sk.callouts.length===1?'':'s'}?`))return;S.pack.artwork.forEach(a=>{a.placements=a.placements.filter(p=>p.sketchId!==sk.id)});S.pack.sketches.splice(i,1);S.sk=0;rerender();showTab('calls');markDirty();return}
  if(act==='placing'){if(!S.pack.sketches[S.sk]?.image){toast('Add the garment image first');return}S.placing=!S.placing;rerender();showTab('calls');return}
  if(act==='addco'){const sk=S.pack.sketches[+b.dataset.si];sk.callouts.push({n:nextN(sk),label:'',spec:'',note:'',photo:'',x:null,y:null});S.sel={si:+b.dataset.si,ci:sk.callouts.length-1};rerender();showTab('calls');markDirty();setTimeout(()=>document.querySelector('.co.sel input.t')?.focus(),0);return}
  if(act==='pinit'){const sk=S.pack.sketches[+b.dataset.si],c=sk.callouts[+b.dataset.ci];c.x=0.5;c.y=0.5;S.sel={si:+b.dataset.si,ci:+b.dataset.ci};rerender();showTab('calls');markDirty();toast('Pin placed at centre — drag it into position');return}
  if(act==='rmco'){const sk=S.pack.sketches[+b.dataset.si];sk.callouts.splice(+b.dataset.ci,1);sk.callouts.forEach((c,k)=>c.n=k+1);S.sel=null;rerender();showTab('calls');markDirty();return}
  if(act==='extract'){const a=S.pack.artwork[+b.dataset.ai];extractPantones(a.image).then(p=>{a.pantones=p;rerender();showTab('art');markDirty();toast(p.length?`${p.length} colours extracted`:'No colours found — is the artwork transparent or white?')});return}
  if(act==='rmpt'){const a=S.pack.artwork[+b.dataset.ai];a.pantones.splice(+b.dataset.pi,1);rerender();showTab('art');markDirty();return}
  if(act==='rmart'){if(!confirm('Remove this artwork and its placements?'))return;S.pack.artwork.splice(+b.dataset.ai,1);rerender();showTab('art');markDirty();return}
  if(act==='placeart'){const a=S.pack.artwork[+b.dataset.ai],sk=S.pack.sketches[S.artSk];if(!sk?.image){toast('Add the garment image for this view first');return}a.placements.push({sketchId:sk.id,x:0.5,y:0.4,widthIn:sk.garmentWidthIn?Math.round(sk.garmentWidthIn*0.18*100)/100:null,label:''});rerender();showTab('art');markDirty();document.querySelector('.place')?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(act==='rmpl'){S.pack.artwork[+b.dataset.ai].placements.splice(+b.dataset.pi,1);rerender();showTab('art');markDirty();return}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='shareForm'){e.preventDefault();createShare(f)}if(f.id==='brandSign'){e.preventDefault();brandSign(f)}if(f.id==='factorySign'){e.preventDefault();const name=new FormData(f).get('name');if(!confirm(`Countersign as ${S.view?.shareLabel}? This confirms you can produce to spec and locks v${S.view?.techPack?.version}.`))return;factoryAct('sign',{name}).then(v=>{if(v){toast(v.techPack.lockedAt?'Countersigned — tech pack locked for production':'Countersigned');showTab('sign')}})}});
window.addEventListener('beforeunload',e=>{if(S.dirty&&!RO){e.preventDefault();e.returnValue=''}});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'&&MODE==='admin'){e.preventDefault();save()}if(e.key==='Escape'&&S.placing){S.placing=false;rerender()}});

// ---- boot ----
async function boot(){
  if(MODE==='none')return gate('Tech pack not found','This link does not point at a tech pack.','/','Open the hub');
  try{
    if(MODE==='admin'){
      if(!TOKEN)return gate('Sign in to the work console','Tech packs are built from the Future Basics work console.','/','Sign in');
      const d=await api(`/v1/admin/products/${productMatch[1]}/tech-pack`);S.product=d.product;S.techPack=d.techPack;S.pack=d.techPack?d.techPack.data:d.seed;S.seed=d.seed;S.shares=d.shares;S.completeness=d.completeness;S.workHubUrl=d.workHubUrl;S.clientHubUrl=d.clientHubUrl;
      document.title=`Tech pack — ${S.product.title}`;render();if(!d.techPack)toast('Draft generated from the product configuration — edit anything to save it');
    }else if(MODE==='client'){
      if(!TOKEN)return gate('Sign in to view this tech pack','Open your client hub, sign in, then come back to this link.','/','Open the client hub');
      const v=await api(`/v1/products/${productMatch[1]}/tech-pack`);S.view=v;S.product=v.product;S.pack=v.techPack.data;document.title=`Tech pack — ${S.product.title}`;render();
    }else{
      const v=await api(`/v1/tp/${encodeURIComponent(tokenMatch[1])}`);S.view=v;S.product=v.product;S.pack=v.techPack.data;document.title=`Tech pack — ${S.product.title}`;render();
      $('#noteSlot').innerHTML=`<p class="note noprint">Prepared by Future Basics for <strong>${esc(v.shareLabel||'your factory')}</strong> · version ${v.techPack.version}, issued ${fmtDate(v.techPack.publishedAt)}. Acknowledge each callout in <strong>Calls</strong>, download artwork from <strong>Art</strong>, then countersign in <strong>Sign</strong>.</p>`;
      if(!v.techPack.lockedAt&&v.techPack.readiness?.pendingCalloutKeys.length)S.tab='calls';
      render();
    }
  }catch(e){
    if(e.status===401)return gate('Session expired','Sign in again, then reopen this tech pack.','/','Sign in');
    if(e.status===410)return gate('This link is no longer active',e.message,'https://thefuturebasics.com','Future Basics');
    gate('Tech pack unavailable',e.message,'/','Open the hub');
  }
}
boot();
})();
</script></body></html>
