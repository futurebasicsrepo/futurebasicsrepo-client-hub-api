<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Basics — Tech Pack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap');
:root{--ink:#141416;--paper:#fff;--fog:#f5f5f2;--dim:#717177;--line:rgba(20,20,22,.14);--cue:#4bff9a;--warn:#ffed90;--bad:#9a2419;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html{background:var(--fog)}body{margin:0;color:var(--ink);font:400 14px/1.5 'Space Grotesk',system-ui,sans-serif;background:var(--fog);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
.meta{font:500 10px/1.35 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.hidden{display:none!important}
/* chrome */
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,3vw,40px);background:rgba(20,20,22,.97);color:#fff;backdrop-filter:blur(14px)}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}.top .brand b{font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.top .brand .meta{color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:9px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:transparent;color:#fff;cursor:pointer;white-space:nowrap;transition:.2s var(--ease)}.btn:hover{background:#fff;color:var(--ink)}.btn.primary{background:var(--cue);border-color:var(--cue);color:var(--ink);font-weight:500}.btn.primary:hover{background:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.dark .btn{border-color:var(--line);color:var(--ink)}.dark .btn:hover{background:var(--ink);color:#fff}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid rgba(255,255,255,.28);border-radius:999px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#ddd;white-space:nowrap}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}.status.live:before{background:var(--cue)}.status.edits:before{background:var(--warn)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:24px clamp(16px,3vw,40px) 120px}
.rail{position:sticky;top:88px;align-self:start;display:grid;gap:4px}.rail a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:999px;text-decoration:none;font-size:13px;border:1px solid transparent}.rail a:hover{border-color:var(--line);background:#fff}.rail a .meta{font-size:9px}.rail .ok{color:#23784b}.rail .todo{color:var(--dim)}
.savebar{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:12px;color:var(--dim)}.savebar b{display:block;color:var(--ink);font-weight:500}
/* the sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.cover{padding:clamp(24px,4vw,48px);background:var(--ink);color:#fff;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr);gap:28px;align-items:end}.cover .meta{color:#aaa}.cover h1{font-size:clamp(34px,5vw,64px);line-height:.92;letter-spacing:-.04em;font-weight:500;margin:10px 0 18px}.cover .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cover .kv span{display:block;padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(255,255,255,.06);min-width:0}.cover .kv b{display:block;font-weight:500;overflow-wrap:anywhere}.cover .kv small{font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#aaa}.cover img{width:100%;max-height:300px;object-fit:cover;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:#222}.cover .stamp{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--cue)}
section.block{padding:clamp(20px,3vw,36px);border-top:1px solid var(--line)}section.block:first-of-type{border-top:0}
.block-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px}.block-head h2{font-size:clamp(22px,2.4vw,30px);font-weight:500;letter-spacing:-.03em;margin:4px 0 0}.block-head .tools{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:12px}.sbtn:hover{border-color:var(--ink)}.sbtn.danger{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.fields label,.f{display:grid;gap:6px}.fields label>span,.f>span{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.fields .full{grid-column:1/-1}
input.t,select.t,textarea.t{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(75,255,154,.35)}textarea.t{min-height:84px;resize:vertical}
.ro{padding:10px 12px;border:1px solid transparent;border-bottom-color:var(--line);min-height:40px;white-space:pre-wrap;overflow-wrap:anywhere}.ro:empty:before{content:"—";color:var(--dim)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
table.tp{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:640px}table.tp th{position:sticky;top:0;text-align:left;padding:10px 9px;font:500 8.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:var(--fog);border-bottom:1px solid var(--line);white-space:nowrap}table.tp td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:top}table.tp tr:last-child td{border-bottom:0}
table.tp td input.t,table.tp td textarea.t,table.tp td select.t{padding:8px 9px;border-radius:10px;min-width:70px}table.tp td textarea.t{min-height:40px}table.tp td .ro{padding:8px 9px;min-height:36px;border:0}
table.tp td.num{width:64px}table.tp td.num input.t{min-width:56px;text-align:center;font-family:'IBM Plex Mono',monospace}table.tp .sample th,table.tp td.sample{background:rgba(75,255,154,.16)}
.rowacts{display:flex;gap:3px;white-space:nowrap}.rowacts button{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;line-height:1}.rowacts button:hover{border-color:var(--ink)}
.addrow{margin-top:10px}
.sketches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.sk{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;display:grid;grid-template-rows:auto auto 1fr}.sk .img{position:relative;aspect-ratio:4/3;background:repeating-conic-gradient(#f0f0ec 0 25%,#fff 0 50%) 0 0/20px 20px;display:grid;place-items:center;overflow:hidden}.sk .img img{width:100%;height:100%;object-fit:contain}.sk .img .drop{text-align:center;padding:20px;color:var(--dim);font-size:12px}.sk .img .drop b{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}.sk .img input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}.sk .sk-head{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}.sk .callouts{padding:8px 12px 12px;display:grid;gap:5px}.sk .co{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:6px;align-items:center}.sk .co .n{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--ink);border-radius:50%;font:500 10px 'IBM Plex Mono',monospace}
.colorways{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.cw{border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}.cw .sw{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);position:relative;overflow:hidden}.cw .sw input{position:absolute;inset:-10px;width:80px;height:80px;border:0;padding:0;cursor:pointer;background:none}.cw .cw-fields{display:grid;gap:6px}
.revs{display:grid;gap:8px}.rev{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;align-items:center}.rev b{font:500 12px 'IBM Plex Mono',monospace}
.shares{display:grid;gap:8px;margin-top:14px}.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;align-items:center}.share.off{opacity:.55}.share b{display:block}.share small{color:var(--dim)}
.newlink{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 150px auto;gap:8px;align-items:end;padding:14px;border:1px dashed var(--line);border-radius:18px;background:var(--fog);margin-top:14px}
.linkout{margin-top:12px;padding:14px;border:2px solid var(--cue);border-radius:18px;background:#fff}.linkout .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}.linkout input{font-family:'IBM Plex Mono',monospace;font-size:12px}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chk{padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;background:#fff}.chk.ok{border-color:#b5d7c1;background:#eefbf3}.chk.todo{color:var(--dim)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 18px 40px rgba(20,22,28,.28);opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:50;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
.gate{max-width:560px;margin:10vh auto;padding:36px;background:#fff;border:1px solid var(--line);border-radius:28px;text-align:center}.gate h1{font-size:30px;font-weight:500;margin:6px 0 10px}.gate p{color:var(--dim)}.gate a.btn{display:inline-block;margin-top:14px}
.factory-note{margin:0 0 18px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--dim);font-size:13px}
@media(max-width:960px){.layout{grid-template-columns:1fr}.rail{position:static;display:flex;flex-wrap:wrap}.rail a{padding:7px 10px}.savebar{width:100%}.cover{grid-template-columns:1fr}.newlink{grid-template-columns:1fr 1fr}.top{height:auto;padding:12px 16px;flex-wrap:wrap}.top .acts{width:100%;justify-content:flex-start}}
@media(max-width:560px){.cover .kv{grid-template-columns:1fr 1fr}.newlink{grid-template-columns:1fr}.rev{grid-template-columns:1fr}.share{grid-template-columns:1fr}}
/* print: the sheet becomes the document */
@page{size:letter landscape;margin:11mm}
@media print{html,body{background:#fff}.top,.rail,.savebar,.noprint,.toast,.rowacts,.addrow,.sk input[type=file],.sk .drop{display:none!important}.layout{display:block;padding:0;max-width:none}.sheet{border:0;border-radius:0}.cover{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}section.block{break-inside:auto;padding:14px 0}section.block.pb{break-before:page}table.tp{min-width:0;font-size:10.5px}table.tp th{position:static}.tablewrap{border-radius:0;overflow:visible}input.t,select.t,textarea.t{border:0;padding:4px 6px;border-radius:0;background:transparent;min-height:0;resize:none;box-shadow:none!important}textarea.t{height:auto;min-height:0}.ro{border:0;padding:4px 6px;min-height:0}.sketches{grid-template-columns:repeat(2,1fr)}.sk{break-inside:avoid;border-radius:6px}.sk .img{aspect-ratio:auto;max-height:120mm}.cw{break-inside:avoid}.status,.status.live{color:#000;border-color:#000}.top{display:none}.print-header{display:block!important}}
.print-header{display:none;padding:0 0 8px;border-bottom:1px solid #000;margin-bottom:10px;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body>
<header class="top"><div class="brand"><b>Future Basics</b><span class="meta" id="crumb">Tech pack</span></div><div class="acts" id="acts"></div></header>
<div id="gate" class="gate hidden"><span class="meta">Future Basics</span><h1 id="gateTitle">Sign in to view this tech pack</h1><p id="gateBody">This tech pack is private.</p><a id="gateLink" class="btn dark" href="/">Open the hub</a></div>
<div class="layout" id="layout">
  <nav class="rail noprint" id="rail"></nav>
  <div>
    <div class="print-header" id="printHeader"></div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=location.pathname,params=new URLSearchParams(location.search),host=location.hostname.toLowerCase();
const tokenMatch=path.match(/^\/tp\/([^/]+)/),productMatch=path.match(/^\/tech-packs\/([^/]+)/);
const isWork=host.startsWith('work.')||params.get('as')==='work'||((host==='localhost'||host==='127.0.0.1')&&localStorage.getItem('fb.admin.token')&&params.get('as')!=='client');
const MODE=tokenMatch?'factory':productMatch?(isWork?'admin':'client'):'none';
const TOKEN=MODE==='admin'?localStorage.getItem('fb.admin.token')||'':MODE==='client'?localStorage.getItem('fb.client.token')||'':'';
const RO=MODE!=='admin';
const SECTIONS=[['style','Style'],['sketches','Sketches'],['pom','Measurements'],['bom','Bill of materials'],['construction','Construction'],['colorways','Colorways'],['labels','Labels, packaging & care'],['notes','Notes'],['revisions','Revisions']];
const SKETCH_VIEWS=['front','back','side','detail','flat','other'];
let S={product:null,pack:null,techPack:null,shares:[],seed:null,view:null,completeness:null,dirty:false,saving:false,preview:false,lastSaved:null,workHubUrl:'',clientHubUrl:''};
let saveTimer=null,toastTimer=null;

async function api(p,o={}){o.headers=o.headers||{};if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;if(o.body&&typeof o.body==='string')o.headers['Content-Type']='application/json';const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||'Request failed');e.status=r.status;throw e}return d}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function gate(title,body,link,label){$('#layout').classList.add('hidden');$('#gate').classList.remove('hidden');$('#gateTitle').textContent=title;$('#gateBody').textContent=body;const a=$('#gateLink');a.href=link||'/';a.textContent=label||'Open the hub'}
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
const fmtTime=v=>v?new Date(v).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'';

// ---- state helpers: inputs carry a JSON path so keystrokes update state without re-rendering ----
function getIn(o,p){return p.reduce((a,k)=>a==null?undefined:a[k],o)}
function setIn(o,p,v){let a=o;for(let i=0;i<p.length-1;i++){if(a[p[i]]==null)a[p[i]]=typeof p[i+1]==='number'?[]:{};a=a[p[i]]}a[p[p.length-1]]=v}
const P=(...p)=>esc(JSON.stringify(p));
function F(p,opts={}){const v=getIn(S.pack,p)??'';if(RO)return `<div class="ro">${esc(v)}</div>`;const attrs=`class="t" data-path='${P(...p)}' ${opts.ph?`placeholder="${esc(opts.ph)}"`:''}`;if(opts.area)return `<textarea ${attrs}>${esc(v)}</textarea>`;if(opts.options)return `<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${attrs} value="${esc(v)}" ${opts.type?`type="${opts.type}"`:''}>`}
function L(label,p,opts={}){return `<label class="${opts.full?'full':''}"><span>${esc(label)}</span>${F(p,opts)}</label>`}
function rowActs(sec,i,len){return RO?'':`<div class="rowacts"><button type="button" title="Move up" data-act="up" data-sec="${sec}" data-i="${i}" ${i===0?'disabled':''}>↑</button><button type="button" title="Move down" data-act="down" data-sec="${sec}" data-i="${i}" ${i===len-1?'disabled':''}>↓</button><button type="button" title="Remove" data-act="rm" data-sec="${sec}" data-i="${i}">✕</button></div>`}
function addBtn(sec,label){return RO?'':`<div class="addrow"><button type="button" class="sbtn" data-act="add" data-sec="${sec}">+ ${esc(label)}</button></div>`}

// ---- renderers ----
function renderCover(){const p=S.pack,pr=S.product,tp=S.techPack,ver=S.view?S.view.techPack:null;const stamp=MODE==='admin'?(S.preview?`Published v${tp?.version} · ${fmtDate(tp?.publishedAt)}`:(tp?.version?`Draft · v${tp.version} published ${fmtDate(tp.publishedAt)}`:'Draft · not yet published')):`Version ${ver?.version} · issued ${fmtDate(ver?.publishedAt)}`;
  return `<div class="cover"><div><span class="stamp">Tech pack · ${esc(stamp)}</span><span class="meta" style="display:block;margin-top:10px">${esc(pr.clientName||pr.client_name||'')}${(pr.projectName||pr.project_name)?' · '+esc(pr.projectName||pr.project_name):''}</span><h1>${esc(p.style.styleName||pr.title)}</h1><div class="kv"><span><b>${esc(p.style.styleNumber||'—')}</b><small>Style no.</small></span><span><b>${esc(p.style.season||'—')}</b><small>Season</small></span><span><b>${esc(p.style.category||'—')}</b><small>Category</small></span><span><b>${esc(p.style.sampleSize||'—')}</b><small>Sample size</small></span><span><b>${esc(p.sizes.join(' · ')||'—')}</b><small>Size run</small></span><span><b>${esc(p.style.designer||'Future Basics')}</b><small>Designer</small></span></div></div>${(pr.imageUrl||pr.shopify_image_url)?`<img src="${esc(pr.imageUrl||pr.shopify_image_url)}" alt="${esc(pr.imageAlt||pr.shopify_image_alt||pr.title)}">`:''}</div>`}
function renderStyle(){return `<section class="block" id="sec-style"><div class="block-head"><div><span class="meta">01 · style summary</span><h2>Style</h2></div></div><div class="fields">${L('Style number',['style','styleNumber'],{ph:'FB-0001'})}${L('Style name',['style','styleName'])}${L('Season',['style','season'],{ph:'FW26'})}${L('Category',['style','category'],{ph:'Outerwear'})}${L('Designer',['style','designer'])}${L('Fit block / base pattern',['style','fitBlock'],{ph:'Regular fit, drop shoulder'})}${L('Sample size',['style','sampleSize'])}${L('Fabric summary',['style','fabricSummary'],{ph:'12oz cotton canvas, enzyme wash'})}${L('Description',['style','description'],{area:true,full:true,ph:'What this product is, who it is for, and what must be true about it.'})}</div></section>`}
function renderSketches(){const p=S.pack;return `<section class="block pb" id="sec-sketches"><div class="block-head"><div><span class="meta">02 · technical sketches</span><h2>Sketches &amp; callouts</h2></div>${RO?'':'<div class="tools"><button type="button" class="sbtn" data-act="add" data-sec="sketches">+ Sketch</button></div>'}</div><div class="sketches">${p.sketches.map((s,i)=>`<article class="sk"><div class="img">${s.image?`<img src="${s.image}" alt="${esc(s.label||s.view)}">`:`<div class="drop"><b>${RO?'No image':'Drop or click to add'}</b>${RO?'':'PNG, JPG or WebP · flat sketch or reference'}</div>`}${RO?'':`<input type="file" accept="image/png,image/jpeg,image/webp" data-act="image" data-i="${i}" title="Replace image">`}</div><div class="sk-head">${F(['sketches',i,'view'],{options:SKETCH_VIEWS})}${F(['sketches',i,'label'],{ph:'Label, e.g. Front — flat'})}${rowActs('sketches',i,p.sketches.length)}</div><div class="callouts">${s.callouts.map((c,j)=>`<div class="co"><span class="n">${esc(c.n)}</span>${F(['sketches',i,'callouts',j,'note'],{ph:'Callout detail'})}${RO?'':`<div class="rowacts"><button type="button" data-act="rmco" data-i="${i}" data-j="${j}" title="Remove callout">✕</button></div>`}</div>`).join('')}${RO?'':`<div><button type="button" class="sbtn" data-act="addco" data-i="${i}">+ Callout</button></div>`}</div></article>`).join('')||`<p class="meta">No sketches yet.</p>`}</div></section>`}
function renderPOM(){const p=S.pack,sample=p.style.sampleSize;return `<section class="block pb" id="sec-pom"><div class="block-head"><div><span class="meta">03 · points of measure</span><h2>Measurements</h2></div>${RO?'':`<div class="tools"><label class="f" style="min-width:260px"><span>Size run (comma separated)</span><input class="t" id="sizesInput" value="${esc(p.sizes.join(', '))}"></label></div>`}</div><div class="tablewrap"><table class="tp"><thead><tr><th>Code</th><th style="min-width:180px">Point of measure</th><th style="min-width:200px">How to measure</th><th>Tol.</th>${p.sizes.map(s=>`<th class="${s===sample?'sample':''}">${esc(s)}</th>`).join('')}${RO?'':'<th></th>'}</tr></thead><tbody>${p.pom.map((r,i)=>`<tr><td class="num">${F(['pom',i,'code'])}</td><td>${F(['pom',i,'name'])}</td><td>${F(['pom',i,'how'],{area:!RO})}</td><td class="num">${F(['pom',i,'tolerance'],{ph:'±1/2'})}</td>${p.sizes.map(s=>`<td class="num ${s===sample?'sample':''}">${F(['pom',i,'values',s])}</td>`).join('')}${RO?'':`<td>${rowActs('pom',i,p.pom.length)}</td>`}</tr>`).join('')||`<tr><td colspan="${5+p.sizes.length}" class="meta" style="padding:14px">No measurements yet.</td></tr>`}</tbody></table></div>${addBtn('pom','Measurement')}<p class="meta" style="margin-top:10px">Inches unless noted · sample size highlighted</p></section>`}
function renderBOM(){const p=S.pack;return `<section class="block pb" id="sec-bom"><div class="block-head"><div><span class="meta">04 · bill of materials</span><h2>Materials &amp; trims</h2></div></div><div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:150px">Component</th><th style="min-width:150px">Material</th><th style="min-width:180px">Spec / construction</th><th>Supplier</th><th>Ref / article</th><th>Color</th><th>Placement</th><th>Qty</th><th>Unit</th><th style="min-width:140px">Notes</th>${RO?'':'<th></th>'}</tr></thead><tbody>${p.bom.map((r,i)=>`<tr>${['component','material','spec','supplier','ref','color','placement','qty','unit','notes'].map(k=>`<td class="${k==='qty'||k==='unit'?'num':''}">${F(['bom',i,k],{area:!RO&&(k==='spec'||k==='notes')})}</td>`).join('')}${RO?'':`<td>${rowActs('bom',i,p.bom.length)}</td>`}</tr>`).join('')||'<tr><td colspan="11" class="meta" style="padding:14px">No materials yet.</td></tr>'}</tbody></table></div>${addBtn('bom','Material / trim')}</section>`}
function renderConstruction(){const p=S.pack;return `<section class="block" id="sec-construction"><div class="block-head"><div><span class="meta">05 · construction</span><h2>Construction details</h2></div></div><div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:160px">Area</th><th>Detail — stitch, seam, thread, SPI, finish</th>${RO?'':'<th></th>'}</tr></thead><tbody>${p.construction.map((r,i)=>`<tr><td>${F(['construction',i,'area'],{ph:'Side seams'})}</td><td>${F(['construction',i,'detail'],{area:!RO,ph:'Flat-felled, 12 SPI, tex 40 poly-core, contrast thread'})}</td>${RO?'':`<td>${rowActs('construction',i,p.construction.length)}</td>`}</tr>`).join('')||'<tr><td colspan="3" class="meta" style="padding:14px">No construction details yet.</td></tr>'}</tbody></table></div>${addBtn('construction','Construction detail')}</section>`}
function renderColorways(){const p=S.pack;return `<section class="block" id="sec-colorways"><div class="block-head"><div><span class="meta">06 · colorways</span><h2>Colorways</h2></div>${RO?'':'<div class="tools"><button type="button" class="sbtn" data-act="add" data-sec="colorways">+ Colorway</button></div>'}</div><div class="colorways">${p.colorways.map((c,i)=>`<div class="cw"><div class="sw" style="background:${c.swatch||'#e6e6e2'}">${RO?'':`<input type="color" value="${c.swatch||'#e6e6e2'}" data-path='${P('colorways',i,'swatch')}'>`}</div><div class="cw-fields">${F(['colorways',i,'name'],{ph:'Colorway name'})}${F(['colorways',i,'code'],{ph:'Pantone / ref'})}${F(['colorways',i,'notes'],{ph:'Component color notes',area:!RO})}${rowActs('colorways',i,p.colorways.length)}</div></div>`).join('')||'<p class="meta">No colorways yet.</p>'}</div></section>`}
function renderLabels(){const p=S.pack;return `<section class="block pb" id="sec-labels"><div class="block-head"><div><span class="meta">07 · labels, packaging &amp; care</span><h2>Labels, packaging &amp; care</h2></div></div><div class="tablewrap"><table class="tp"><thead><tr><th style="min-width:150px">Label / item</th><th>Spec</th><th style="min-width:160px">Placement</th>${RO?'':'<th></th>'}</tr></thead><tbody>${p.labels.map((r,i)=>`<tr><td>${F(['labels',i,'item'])}</td><td>${F(['labels',i,'spec'],{area:!RO})}</td><td>${F(['labels',i,'placement'])}</td>${RO?'':`<td>${rowActs('labels',i,p.labels.length)}</td>`}</tr>`).join('')||'<tr><td colspan="4" class="meta" style="padding:14px">No labels yet.</td></tr>'}</tbody></table></div>${addBtn('labels','Label')}<h3 style="margin:22px 0 10px;font-weight:500">Packaging</h3><div class="fields">${L('Fold',['packaging','fold'])}${L('Polybag',['packaging','polybag'])}${L('Carton',['packaging','carton'])}${L('Units per carton',['packaging','unitsPerCarton'])}${L('Packaging notes',['packaging','notes'],{area:true,full:true})}</div><h3 style="margin:22px 0 10px;font-weight:500">Care &amp; compliance</h3><div class="fields">${L('Fiber content',['care','fiber'])}${L('Country of origin',['care','countryOfOrigin'])}${L('Care instructions',['care','instructions'],{area:true,full:true,ph:'Machine wash cold, inside out. Tumble dry low. Do not bleach. Cool iron.'})}${L('Compliance / testing',['care','compliance'],{area:true,full:true,ph:'CPSIA, Prop 65, RN number, testing requirements'})}</div></section>`}
function renderNotes(){return `<section class="block" id="sec-notes"><div class="block-head"><div><span class="meta">08 · notes</span><h2>Notes to factory</h2></div></div>${F(['notes'],{area:true,ph:'Anything the factory must know that does not fit above: sampling requests, approvals required before bulk, packaging of samples, shipping marks.'})}</section>`}
function renderRevisions(){const revs=(S.techPack?.revisions||S.view?.techPack?.revisions||[]).slice().reverse();return `<section class="block" id="sec-revisions"><div class="block-head"><div><span class="meta">09 · revision history</span><h2>Revisions</h2></div></div><div class="revs">${revs.map(r=>`<div class="rev"><b>v${esc(r.version)}</b><span>${esc(r.note||'Published')}</span><span class="meta">${fmtDate(r.publishedAt)} ${fmtTime(r.publishedAt)}${r.by?' · '+esc(r.by):''}</span></div>`).join('')||'<p class="meta">Not yet published.</p>'}</div></section>`}
function renderAccess(){if(MODE!=='admin')return '';const published=Boolean(S.techPack?.publishedAt);return `<section class="block noprint" id="sec-access"><div class="block-head"><div><span class="meta">10 · access</span><h2>Who can see this</h2></div></div><p><strong>Client:</strong> ${published?`${esc(S.product.client_name)} can open v${S.techPack.version} from their hub.`:'Not visible to the client until you publish.'}</p><p><strong>Factories:</strong> private links to the published version. Revoke any link at any time.</p><div class="shares">${S.shares.map(s=>`<div class="share ${s.active?'':'off'}"><span><b>${esc(s.label)}${s.email?' · '+esc(s.email):''}</b><small>Created ${fmtDate(s.createdAt)} · ${s.expiresAt?'expires '+fmtDate(s.expiresAt):'no expiry'} · ${s.viewCount} view${s.viewCount===1?'':'s'}${s.lastViewedAt?', last '+fmtDate(s.lastViewedAt):''}${s.revokedAt?' · revoked':(!s.active?' · expired':'')}</small></span>${s.active?`<button type="button" class="sbtn danger" data-act="revoke" data-id="${s.id}">Revoke</button>`:''}</div>`).join('')||'<p class="meta">No factory links yet.</p>'}</div>${published?`<form class="newlink" id="shareForm"><label class="f"><span>Label (factory name)</span><input class="t" name="label" required placeholder="Mill A — Guangzhou"></label><label class="f"><span>Contact email (optional)</span><input class="t" name="email" type="email" placeholder="production@factory.com"></label><label class="f"><span>Expires</span><select class="t" name="expiresDays"><option value="0">Never</option><option value="30">30 days</option><option value="90" selected>90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></label><button class="sbtn" style="background:var(--ink);color:#fff;border-color:var(--ink)">Create factory link</button></form><div id="linkOut"></div>`:'<p class="meta">Publish first to create factory links.</p>'}</section>`}
function renderSheet(){const p=S.pack;$('#sheet').innerHTML=renderCover()+renderStyle()+renderSketches()+renderPOM()+renderBOM()+renderConstruction()+renderColorways()+renderLabels()+renderNotes()+renderRevisions()+renderAccess();
  $('#printHeader').innerHTML=`Future Basics · Tech pack · ${esc(p.style.styleNumber||'')} ${esc(p.style.styleName||S.product.title)} · ${esc(p.style.season||'')} · ${MODE==='admin'?(S.preview?'v'+S.techPack?.version:'DRAFT'):'v'+S.view?.techPack?.version} · printed ${fmtDate(new Date())}`;
  renderRail();}
function renderRail(){const c=S.completeness?.checks||[];const okFor=key=>{const k={style:'style',sketches:'sketches',pom:'pom',bom:'bom',construction:'construction',colorways:'colorways',labels:'labels'}[key];const chk=c.find(x=>x.key===k);return chk?chk.ok:null};
  $('#rail').innerHTML=SECTIONS.concat(MODE==='admin'?[['access','Access']]:[]).map(([k,label])=>{const ok=okFor(k);return `<a href="#sec-${k}">${esc(label)}${ok==null?'':`<span class="meta ${ok?'ok':'todo'}">${ok?'done':'todo'}</span>`}</a>`}).join('')+(MODE==='admin'?`<div class="savebar" id="savebar"></div>`:'');renderSaveBar()}
function renderSaveBar(){const el=$('#savebar');if(!el)return;el.innerHTML=S.saving?'<b>Saving…</b>':S.dirty?'<b>Unsaved changes</b>autosaves in a moment':S.lastSaved?`<b>Saved</b>${fmtTime(S.lastSaved)}`:S.techPack?`<b>Up to date</b>last edit ${fmtDate(S.techPack.updatedAt)}`:'<b>Generated draft</b>edit anything to save it'}
function renderActs(){const a=$('#acts');if(MODE==='admin'){const tp=S.techPack,edits=tp?.publishedAt&&(S.dirty||new Date(tp.updatedAt)>new Date(tp.publishedAt));a.innerHTML=`<span class="status ${tp?.publishedAt?(edits?'edits':'live'):''}">${tp?.publishedAt?(edits?`v${tp.version} live · unpublished edits`:`v${tp.version} live`):'draft'}</span>${tp?.publishedAt?`<button class="btn" data-act="preview">${S.preview?'Back to editor':'Preview published'}</button>`:''}<button class="btn" data-act="print">Export PDF</button><button class="btn" data-act="save" ${S.preview?'disabled':''}>Save</button><button class="btn primary" data-act="publish" ${S.preview?'disabled':''}>${tp?.publishedAt?'Publish update':'Publish to client'}</button><a class="btn" href="${esc(S.workHubUrl||'')}/clients/${esc(S.product.client_id)}">← Client room</a>`}
  else if(MODE==='client')a.innerHTML=`<span class="status live">v${S.view.techPack.version} · ${fmtDate(S.view.techPack.publishedAt)}</span><button class="btn" data-act="print">Download PDF</button><a class="btn" href="/">← Your projects</a>`;
  else a.innerHTML=`<span class="status live">v${S.view.techPack.version} · ${fmtDate(S.view.techPack.publishedAt)}</span><button class="btn" data-act="print">Download PDF</button>`;
  $('#crumb').textContent=`Tech pack · ${S.product.title}${MODE==='factory'&&S.view.shareLabel?' · for '+S.view.shareLabel:''}`}

// ---- mutations (admin) ----
function markDirty(){if(RO||S.preview)return;S.dirty=true;renderSaveBar();renderActs();clearTimeout(saveTimer);saveTimer=setTimeout(save,1400)}
async function save(){if(RO||S.preview||S.saving)return;clearTimeout(saveTimer);S.saving=true;renderSaveBar();try{const d=await api(`/v1/admin/products/${S.product.id}/tech-pack`,{method:'PUT',body:JSON.stringify({data:S.pack})});S.techPack=d.techPack;S.pack=d.techPack.data;S.completeness=d.completeness;S.dirty=false;S.lastSaved=new Date();renderRail();renderActs()}catch(e){toast('Save failed — '+e.message);S.dirty=true}finally{S.saving=false;renderSaveBar()}}
function newRow(sec){const sizes=S.pack.sizes;return{sketches:{id:Math.random().toString(36).slice(2,10),view:'front',label:'',image:'',callouts:[]},pom:{code:'',name:'',how:'',tolerance:'',values:Object.fromEntries(sizes.map(s=>[s,'']))},bom:{component:'',material:'',spec:'',supplier:'',ref:'',color:'',placement:'',qty:'',unit:'',notes:''},construction:{area:'',detail:''},colorways:{name:'',code:'',swatch:'',notes:''},labels:{item:'',spec:'',placement:''}}[sec]}
function applySizes(text){const sizes=[...new Set(String(text).split(',').map(s=>s.trim()).filter(Boolean))].slice(0,14);if(!sizes.length)return;S.pack.sizes=sizes;S.pack.pom.forEach(r=>{r.values=Object.fromEntries(sizes.map(s=>[s,r.values?.[s]||'']))});if(!sizes.includes(S.pack.style.sampleSize))S.pack.style.sampleSize=sizes[Math.floor(sizes.length/2)];renderSheet();markDirty()}
function readImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const max=1600,r=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);const x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);let out=file.type==='image/png'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86);if(out.length>2_400_000)out=cv.toDataURL('image/jpeg',.78);if(out.length>2_400_000){const cv2=document.createElement('canvas');cv2.width=Math.round(cv.width*.7);cv2.height=Math.round(cv.height*.7);cv2.getContext('2d').drawImage(cv,0,0,cv2.width,cv2.height);out=cv2.toDataURL('image/jpeg',.78)}URL.revokeObjectURL(url);resolve(out)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('That file is not a readable image'))};img.src=url})}
async function publish(){if(S.preview)return;const c=S.completeness||{missing:[]};const msg=(S.techPack?.publishedAt?`Publish an update? This becomes v${S.techPack.version+1} for the client and every factory link.`:'Publish this tech pack? The client will be able to open it from their hub.')+(c.missing?.length?`\n\nStill missing: ${c.missing.join(', ')}. You can publish anyway.`:'');if(!confirm(msg))return;const note=prompt('Revision note (what changed):','')??'';try{if(S.dirty||!S.techPack)await save();const d=await api(`/v1/admin/products/${S.product.id}/tech-pack/publish`,{method:'POST',body:JSON.stringify({note})});S.techPack=d.techPack;toast(`Published v${d.techPack.version}`);renderSheet();renderActs()}catch(e){toast(e.message)}}
async function createShare(form){const fd=new FormData(form),btn=form.querySelector('button');btn.disabled=true;try{const d=await api(`/v1/admin/products/${S.product.id}/tech-pack/shares`,{method:'POST',body:JSON.stringify({label:fd.get('label'),email:fd.get('email'),expiresDays:Number(fd.get('expiresDays'))})});S.shares.unshift(d.share);const access=$('#sec-access');access.outerHTML=renderAccess();$('#linkOut').innerHTML=`<div class="linkout"><span class="meta">Factory link for ${esc(d.share.label)} — copy it now, it is only shown once</span><div class="row"><input class="t" id="shareUrl" readonly value="${esc(d.url)}"><button type="button" class="sbtn" data-act="copy">Copy</button></div></div>`}catch(e){toast(e.message);btn.disabled=false}}
async function revoke(id){if(!confirm('Revoke this factory link? Anyone with it loses access immediately.'))return;try{const d=await api(`/v1/admin/tech-pack-shares/${id}`,{method:'DELETE'});S.shares=S.shares.map(s=>s.id===id?d.share:s);$('#sec-access').outerHTML=renderAccess();toast('Link revoked')}catch(e){toast(e.message)}}

// ---- events ----
document.addEventListener('input',e=>{const el=e.target,raw=el.getAttribute('data-path');if(!raw||RO||S.preview)return;const p=JSON.parse(raw);setIn(S.pack,p,el.value);if(p[0]==='colorways'&&p[2]==='swatch')el.parentElement.style.background=el.value;markDirty()});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='sizesInput'){applySizes(el.value);return}if(el.dataset.act==='image'){const file=el.files?.[0];if(!file)return;const i=Number(el.dataset.i);readImage(file).then(data=>{S.pack.sketches[i].image=data;renderSheet();markDirty()}).catch(err=>toast(err.message))}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,sec=b.dataset.sec,i=Number(b.dataset.i);
  if(act==='print'){window.print();return}
  if(act==='save'){save();return}
  if(act==='publish'){publish();return}
  if(act==='preview'){S.preview=!S.preview;S.pack=S.preview?S.techPack.publishedData:S.techPack.data;document.body.classList.toggle('preview',S.preview);renderSheet();renderActs();return}
  if(act==='revoke'){revoke(b.dataset.id);return}
  if(act==='copy'){const inp=$('#shareUrl');navigator.clipboard?.writeText(inp.value).then(()=>toast('Link copied')).catch(()=>{inp.select();document.execCommand('copy');toast('Link copied')});return}
  if(RO||S.preview)return;
  const arr=sec?S.pack[sec]:null;
  if(act==='add'){arr.push(newRow(sec));renderSheet();markDirty();setTimeout(()=>{const last=$(`#sec-${sec} tbody tr:last-child input.t, #sec-${sec} .sk:last-child input.t, #sec-${sec} .cw:last-child input.t`);last?.focus()},0);return}
  if(act==='rm'){if(sec==='sketches'&&arr[i].image&&!confirm('Remove this sketch?'))return;arr.splice(i,1);renderSheet();markDirty();return}
  if(act==='up'&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];renderSheet();markDirty();return}
  if(act==='down'&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];renderSheet();markDirty();return}
  if(act==='addco'){const s=S.pack.sketches[i];s.callouts.push({n:s.callouts.length+1,note:''});renderSheet();markDirty();setTimeout(()=>$(`#sec-sketches .sk:nth-child(${i+1}) .co:last-child input`)?.focus(),0);return}
  if(act==='rmco'){const s=S.pack.sketches[i];s.callouts.splice(Number(b.dataset.j),1);s.callouts.forEach((c,k)=>c.n=k+1);renderSheet();markDirty();return}
});
document.addEventListener('submit',e=>{if(e.target.id==='shareForm'){e.preventDefault();createShare(e.target)}});
window.addEventListener('beforeunload',e=>{if(S.dirty&&!RO){e.preventDefault();e.returnValue=''}});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'&&MODE==='admin'){e.preventDefault();save()}});

// ---- boot ----
async function boot(){
  if(MODE==='none')return gate('Tech pack not found','This link does not point at a tech pack.','/','Open the hub');
  try{
    if(MODE==='admin'){
      if(!TOKEN)return gate('Sign in to the work console','Tech packs are built from the Future Basics work console.','/','Sign in');
      const d=await api(`/v1/admin/products/${productMatch[1]}/tech-pack`);S.product=d.product;S.techPack=d.techPack;S.pack=d.techPack?d.techPack.data:d.seed;S.seed=d.seed;S.shares=d.shares;S.completeness=d.completeness;S.workHubUrl=d.workHubUrl;S.clientHubUrl=d.clientHubUrl;
      document.title=`Tech pack — ${S.product.title}`;renderSheet();renderActs();if(!d.techPack)toast('Draft generated from the product configuration — edit anything to save it');
    }else if(MODE==='client'){
      if(!TOKEN)return gate('Sign in to view this tech pack','Open your client hub, sign in, then come back to this link.','/','Open the client hub');
      const v=await api(`/v1/products/${productMatch[1]}/tech-pack`);S.view=v;S.product=v.product;S.pack=v.techPack.data;document.title=`Tech pack — ${S.product.title}`;renderSheet();renderActs();
    }else{
      const v=await api(`/v1/tp/${encodeURIComponent(tokenMatch[1])}`);S.view=v;S.product=v.product;S.pack=v.techPack.data;document.title=`Tech pack — ${S.product.title}`;renderSheet();renderActs();
      $('#sheet').insertAdjacentHTML('beforebegin',`<p class="factory-note noprint">Prepared by Future Basics for ${esc(v.shareLabel||'your factory')}. This is version ${v.techPack.version}, issued ${fmtDate(v.techPack.publishedAt)}. Reply to the Future Basics contact who sent this link with questions or sample updates.</p>`);
    }
  }catch(e){
    if(e.status===401)return gate('Session expired','Sign in again, then reopen this tech pack.','/','Sign in');
    if(e.status===410)return gate('This link is no longer active',e.message,'https://thefuturebasics.com','Future Basics');
    gate('Tech pack unavailable',e.message,'/','Open the hub');
  }
}
boot();
})();
</script></body></html>
