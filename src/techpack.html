<body>
<header class="top"><div class="brand"><b id="brandName">Future Basics · Tech pack</b><nav class="crumbs" id="crumb" aria-label="Breadcrumb"></nav></div><div class="acts" id="acts"></div></header>
<nav class="tabs" id="tabs"></nav>
<div id="gate" class="gate hidden"><span class="meta">Future Basics</span><h1 id="gateTitle">Sign in to view this tech pack</h1><p id="gateBody">This tech pack is private.</p><a id="gateLink" class="btn" href="/">Open the hub</a></div>
<div class="wrap" id="wrap"><div class="print-header" id="printHeader"></div><div id="noteSlot"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="/tp-i18n.js"></script>
<script src="/tp-units.js"></script>
<script src="/pantone-c.js"></script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=location.pathname,params=new URLSearchParams(location.search),host=location.hostname.toLowerCase();
const tokenMatch=path.match(/^\/tp\/([^/]+)/),productMatch=path.match(/^\/tech-packs\/([^/]+)/);
const isWork=host.startsWith('work.')||params.get('as')==='work'||((host==='localhost'||host==='127.0.0.1')&&localStorage.getItem('fb.admin.token')&&params.get('as')!=='client');
const MODE=tokenMatch?'factory':productMatch?(isWork?'admin':'client'):'none';
let TOKEN=MODE==='admin'?localStorage.getItem('fb.admin.token')||'':MODE==='client'?localStorage.getItem('fb.client.token')||'':'';
let RO=MODE!=='admin';
const TABS=[['style','Style','M4 6h16M4 12h10M4 18h7'],['calls','Calls','M12 3a5 5 0 0 1 5 5c0 4-5 9-5 9S7 12 7 8a5 5 0 0 1 5-5zM12 8h.01'],['poms','POMs','M3 12h18M6 8v8M12 6v12M18 8v8'],['art','Art','M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-2 0-3 3 0 4-1c2-2 0-6-6-12zM8 10h.01M12 7h.01M16 10h.01'],['bom','BOM','M4 5h16v14H4zM4 10h16M9 10v9'],['sign','Sign','M4 17c3-4 5-6 7-6s1 4 3 4 3-4 6-4M4 21h16']];
const SKETCH_VIEWS=['front','back','side','lateral','medial','top','outsole','heel','detail','flat','other'];
const NAMED=[['Black','#000000'],['White','#ffffff'],['Charcoal','#36454f'],['Slate Grey','#708090'],['Silver','#c0c0c0'],['Ivory','#fffff0'],['Cream','#fffdd0'],['Beige','#f5f5dc'],['Tan','#d2b48c'],['Sand','#c2b280'],['Khaki','#c3b091'],['Camel','#c19a6b'],['Brown','#8b4513'],['Dark Brown','#3b2f2f'],['Chocolate','#7b3f00'],['Rust','#b7410e'],['Burnt Orange','#cc5500'],['Orange','#ff7f00'],['Amber','#ffbf00'],['Gold','#d4af37'],['Mustard','#e1ad01'],['Yellow','#ffd700'],['Olive Green','#556b2f'],['Army Green','#4b5320'],['Moss','#8a9a5b'],['Sage','#9caf88'],['Forest Green','#228b22'],['Green','#2e8b57'],['Mint','#98ff98'],['Teal','#008080'],['Navy','#1f2a44'],['Royal Blue','#4169e1'],['Cobalt','#0047ab'],['Sky Blue','#87ceeb'],['Denim','#1560bd'],['Purple','#6a0dad'],['Lavender','#b57edc'],['Burgundy','#800020'],['Maroon','#5c0a1e'],['Red','#d62828'],['Coral','#ff7f50'],['Pink','#ffb6c1'],['Hot Pink','#ff69b4'],['Peach','#ffdab9'],['Heather Grey','#9a9a9a']];
let S={lang:'en',translations:{},translating:false,product:null,pack:null,techPack:null,view:null,shares:[],seed:null,completeness:null,tab:'style',sk:0,placing:false,sel:null,artSk:0,preview:false,dirty:false,saving:false,lastSaved:null,workHubUrl:'',clientHubUrl:''};
let saveTimer=null,toastTimer=null;

// A session that ended while this page was open (the /start session stops working once the owner signs in with a code) is not the end of
// the road: another tab may already hold a newer one, so use it and try once more. Otherwise say what to do; the edits stay on the page.
async function api(p,o={}){try{return await apiOnce(p,{...o,headers:{...(o.headers||{})}})}catch(e){if(e.status!==401||(MODE!=='client'&&MODE!=='admin'))throw e;let fresh='';try{fresh=localStorage.getItem(MODE==='admin'?'fb.admin.token':'fb.client.token')||''}catch{}
  if(fresh&&fresh!==TOKEN){TOKEN=fresh;return await apiOnce(p,{...o,headers:{...(o.headers||{})}})}
  if(S.dirty)e.message='Your session ended. Your edits are still on this page. Sign in again in another tab, then come back here and they will save.';throw e}}
async function apiOnce(p,o={}){o.headers=o.headers||{};if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;if(o.body&&typeof o.body==='string')o.headers['Content-Type']='application/json';let r;try{r=await fetch(p,o)}catch{const e=new Error('No connection — check your internet and try again. What you typed is still on this page.');e.status=0;throw e}let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||({413:'That is too large to save — try a smaller image.',429:'Too many tries — wait a few minutes.',502:'Future Basics is restarting for a moment — try again in a few seconds.',503:'Future Basics is restarting for a moment — try again in a few seconds.',504:'That took too long — try again.'})[r.status]||'Request failed');e.status=r.status;e.body=d;throw e}return d}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function gate(title,body,link,label){$('#wrap').classList.add('hidden');$('#tabs').classList.add('hidden');$('#gate').classList.remove('hidden');$('#gateTitle').textContent=title;$('#gateBody').textContent=body;const a=$('#gateLink');a.href=link||'/';a.textContent=label||'Open the hub'}
const LOC=()=>S.lang==='en'?undefined:I18N.langs[S.lang]?.html; // dates and times follow the page's language
const fmtDate=v=>v?new Date(v).toLocaleDateString(LOC(),{year:'numeric',month:'short',day:'numeric'}):'';
const fmtTime=v=>v?new Date(v).toLocaleTimeString(LOC(),{hour:'numeric',minute:'2-digit'}):'';
// Inches are what the pack stores; the page shows centimetres (lengths) and millimetres (tolerances) beside them. See /tp-units.js.
const {inch,metricOf}=window.FBTP_UNITS;
const metricSpan=(x,kind)=>`<span class="metric" data-k="${kind}">${metricOf(x,kind)}</span>`;

// ---- state helpers ----
function getIn(o,p){return p.reduce((a,k)=>a==null?undefined:a[k],o)}
function setIn(o,p,v){let a=o;for(let i=0;i<p.length-1;i++){if(a[p[i]]==null)a[p[i]]=typeof p[i+1]==='number'?[]:{};a=a[p[i]]}a[p[p.length-1]]=v}
const P=(...p)=>esc(JSON.stringify(p));
function F(p,opts={}){const v=getIn(S.pack,p)??'';if(RO||S.preview||S.lang!=='en')return `<div class="ro">${esc(v)}</div>`;const attrs=`class="t" data-path='${P(...p)}' ${opts.ph?`placeholder="${esc(opts.ph)}"`:''}`;if(opts.area)return `<textarea ${attrs}>${esc(v)}</textarea>`;if(opts.options)return `<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input ${attrs} value="${esc(v)}" ${opts.type?`type="${opts.type}"`:''} ${opts.step?`step="${opts.step}"`:''}>`}
function L(label,p,opts={}){return `<label class="${opts.full?'full':''}"><span>${esc(label)}</span>${F(p,opts)}</label>`}
const EDIT=()=>!RO&&!S.preview&&S.lang==='en';/* .phone-only elements exist for ≤700px layouts */const isPhone=()=>matchMedia('(max-width:700px)').matches;
function rowActs(sec,i,len,extra=''){return EDIT()?`<div class="rowacts"><button type="button" title="Move up" data-act="up" data-sec="${sec}" data-i="${i}" ${extra} ${i===0?'disabled':''}>↑</button><button type="button" title="Move down" data-act="down" data-sec="${sec}" data-i="${i}" ${extra} ${i===len-1?'disabled':''}>↓</button><button type="button" title="Remove" data-act="rm" data-sec="${sec}" data-i="${i}" ${extra}>✕</button></div>`:''}
function addBtn(sec,label){return EDIT()?`<div class="addrow"><button type="button" class="sbtn" data-act="add" data-sec="${sec}">+ ${esc(label)}</button></div>`:''}
const verification=()=>MODE==='admin'?S.techPack?.verification:S.view?.techPack?.verification;
const readiness=()=>MODE==='admin'?S.techPack?.readiness:S.view?.techPack?.readiness;
const ackFor=(sk,co)=>{const v=verification();return v?.acks?.[`${sk.id}:${co.n}`]||null};

// ---- images ----
function readImage(file,max=1600){return new Promise((resolve,reject)=>{if(file.type==='image/svg+xml'){const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Could not read that SVG'));r.readAsDataURL(file);return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);const x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);let out=file.type==='image/png'||file.type==='image/webp'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86);const cap=max<=600?600_000:2_400_000;if(out.length>cap)out=cv.toDataURL('image/jpeg',.78);if(out.length>cap){const cv2=document.createElement('canvas');cv2.width=Math.round(cv.width*.7);cv2.height=Math.round(cv.height*.7);cv2.getContext('2d').drawImage(cv,0,0,cv2.width,cv2.height);out=cv2.toDataURL('image/jpeg',.76)}URL.revokeObjectURL(url);resolve(out)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('That file is not a readable image'))};img.src=url})}
const hexOf=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const rgbOf=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function nearestName(hex){const c=rgbOf(hex);let best=NAMED[0],bd=1e9;for(const n of NAMED){const d=dist(c,rgbOf(n[1]));if(d<bd){bd=d;best=n}}return best[0]}
// Dominant-colour extraction: quantise a small render, drop transparent and near-white background, merge near-duplicates.
// Fills the Pantone C code on every colourway and artwork colour that has none (a C code that is already there is kept, a TCX one is replaced). Returns how many were set, or -1 if the list has not loaded.
function matchPantoneC(){
  if(!window.FBPantone)return -1;let n=0;
  const fill=(o,hex,hint)=>{if(!hex||FBPantone.isC(o.code))return;const c=FBPantone.code(hex,{hint});if(c&&c!==o.code){o.code=c;n++}};
  S.pack.colorways.forEach(c=>fill(c,c.swatch,`${c.name||''} ${c.notes||''}`));S.pack.artwork.forEach(a=>a.pantones.forEach(pt=>fill(pt,pt.hex,pt.name||'')));
  return n;
}
// A pack someone is editing that still has TCX or blank colour codes gets Pantone C codes the moment it opens (the codes save with the pack).
function autoPantoneC(){
  if(!EDIT()||S.techPack?.lockedAt||!S.pack)return;
  const n=matchPantoneC();if(n>0){rerender();markDirty();toast(`${n} colour${n===1?'':'s'} matched to Pantone C`)}
}
function extractPantones(dataUrl){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const s=72,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');x.drawImage(img,0,0,s,s);const d=x.getImageData(0,0,s,s).data,bins=new Map();for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2];if(r>244&&g>244&&b>244)continue;const k=((r>>4)<<8)|((g>>4)<<4)|(b>>4);const e=bins.get(k)||{n:0,r:0,g:0,b:0};e.n++;e.r+=r;e.g+=g;e.b+=b;bins.set(k,e)}const sorted=[...bins.values()].sort((a,b)=>b.n-a.n).map(e=>[Math.round(e.r/e.n),Math.round(e.g/e.n),Math.round(e.b/e.n),e.n]);const out=[];for(const c of sorted){if(out.some(o=>dist(o,c)<42))continue;out.push(c);if(out.length>=6)break}const total=sorted.reduce((s,c)=>s+c[3],0)||1;resolve(out.filter(c=>c[3]/total>=0.02).map(c=>{const h=hexOf(c[0],c[1],c[2]);return{hex:h,name:nearestName(h),code:(window.FBPantone?FBPantone.code(h,{hint:nearestName(h)}):'')}}))};img.onerror=()=>resolve([]);img.src=dataUrl})}

// ---- renderers ----
function cover(){const p=S.pack,pr=S.product,tp=S.techPack,ver=S.view?.techPack;const stamp=S.draft?(tp?.status==='submitted'?`Draft · submitted to Future Basics ${fmtDate(tp.submittedAt)}`:'Draft · started by you · not yet submitted'):MODE==='admin'?(S.preview?`Published v${tp?.version} · ${fmtDate(tp?.publishedAt)}`:(tp?.version?`Draft · v${tp.version} published ${fmtDate(tp.publishedAt)}`:tp?.initiatedBy==='client'?(tp.status==='submitted'?`Client draft · submitted ${fmtDate(tp.submittedAt)} · publish v1 when ready`:'Client draft · still being written by the client'):'Draft · not yet published')):`Version ${ver?.version} · issued ${fmtDate(ver?.publishedAt)}${ver?.lockedAt?' · locked':''}`;
  return `<div class="cover"><div><span class="stamp">Tech pack · ${esc(stamp)}</span><span class="meta" style="display:block;margin-top:10px">${esc(pr.clientName||pr.client_name||'')}${(pr.projectName||pr.project_name)?' · '+esc(pr.projectName||pr.project_name):''}</span><h1>${esc(p.style.styleName||pr.title)}</h1><div class="kv"><span><b>${esc(p.style.styleNumber||'—')}</b><small>Style no.</small></span><span><b>${esc(p.style.season||'—')}</b><small>Season</small></span><span><b>${esc(p.style.category||'—')}</b><small>Category</small></span><span><b>${esc(p.style.sampleSize||'—')}</b><small>Sample size</small></span><span><b>${esc(p.sizes.join(' · ')||'—')}</b><small>Size run</small></span><span><b>${esc(p.style.designer||'Future Basics')}</b><small>Designer</small></span></div></div>${p.renderings?.[0]?.image?`<figure class="hero"><img src="${p.renderings[0].image}" alt="${esc(p.renderings[0].name||'Colour rendering')}"><figcaption>${esc(p.renderings[0].name||'Colour rendering')}${p.renderings[0].note?' · '+esc(p.renderings[0].note):''}</figcaption></figure>`:p.sketches.find(s=>s.image)?`<figure class="hero"><img src="${p.sketches.find(s=>s.image).image}" alt="${esc(p.sketches.find(s=>s.image).label||'Reference photo')}"><figcaption>${esc(p.sketches.find(s=>s.image).label||'Reference photo')}${p.renderings.length?'':' · colour rendering to follow'}</figcaption></figure>`:(pr.imageUrl||pr.shopify_image_url)?`<img src="${esc(pr.imageUrl||pr.shopify_image_url)}" alt="${esc(pr.imageAlt||pr.shopify_image_alt||pr.title)}">`:''}</div>`}
function head(no,eyebrow,title,sub='',tools=''){return `<div class="block-head"><div><span class="meta">${no} · ${esc(eyebrow)}</span><h2>${title}</h2>${sub?`<span class="meta sub">${sub}</span>`:''}</div>${tools?`<div class="tools">${tools}</div>`:''}</div>`}
const partsLegend=parts=>parts&&parts.length?`<ul class="cwparts">${parts.map(x=>`<li class="${x.changed===false?'same':''}"><i style="background:${esc(x.hex||'#ccc')}"></i><span>${esc(x.label)}</span><span class="meta">${esc(x.code||x.name||'')}${x.changed===false?' · unchanged':''}</span></li>`).join('')}</ul>`:'';
const partsTable=parts=>parts&&parts.length?`<table class="ptab"><thead><tr><th>Part</th><th class="hide-s">Material</th><th>Colour as drawn</th><th>Pantone C</th></tr></thead><tbody>${parts.map(x=>`<tr><td>${esc(x.label)}${x.where?`<br><span class="meta">${esc(x.where)}</span>`:''}</td><td class="hide-s">${esc(x.material||'')}</td><td><i style="background:${esc(x.hex||'#ccc')}"></i>${esc(x.name||x.hex||'')}</td><td>${esc(x.code||'')}</td></tr>`).join('')}</tbody></table>`:'';
const cwProgress=r=>{const p=r?.progress||{};return p.stage==='parts'?'Breaking the product up into its parts…':p.stage==='check'?`Checking ${esc(p.name||'')} against the plan…`:p.stage==='colourway'?`Drawing ${esc(p.name||'')} (${(p.done||0)+1} of ${p.total||'?'})…`:'Starting…'};
function renderingsBlock(){const p=S.pack,canEdit=EDIT()&&!S.draft,canTile=EDIT()&&p.colorways.some(c=>c.swatch)&&p.sketches.some(k=>k.image);if(!p.renderings.length&&!canEdit&&!canTile)return '';const cards=p.renderings.map((r,ri)=>`<article class="rend"><div class="img"><img src="${r.image}" alt="${esc(r.name||'Rendering')}"></div><div class="body">${canEdit?`<div class="fields" style="grid-template-columns:1fr"><label><span>Name</span>${F(['renderings',ri,'name'],{ph:'Colour rendering — Bone / White'})}</label><label><span>Note</span>${F(['renderings',ri,'note'],{ph:'Lead colourway · Pantone C as listed'})}</label></div>`:`<strong>${esc(r.name||'Colour rendering')}</strong>${r.note?`<span class="meta">${esc(r.note)}</span>`:''}`}${canEdit?`<div class="addrow" style="margin-top:6px">${ri>0?`<button type="button" class="sbtn" data-act="rendfirst" data-ri="${ri}">Use as cover</button>`:'<span class="meta">Shown on the cover</span>'}<button type="button" class="sbtn danger" data-act="rmrend" data-ri="${ri}">Remove</button></div>`:''}</div>${partsLegend(r.parts)}</article>`).join('');
  return `<section class="block">${head('00','colour renderings','Colour Renderings','Design intent without callouts · colours per the Pantone selects in this pack')}${canEdit?`<label class="upload"><b>Upload rendering</b><span class="meta">PNG, JPG or WebP · one per colourway · the first is shown on the cover</span><input type="file" accept="image/png,image/jpeg,image/webp" data-act="rendfile" multiple></label>`:''}${canTile?`<div class="addrow" style="margin-top:10px">${S.cutoutEnabled?`<button type="button" class="sbtn" data-act="cutout">Remove the background</button>`:''}<button type="button" class="sbtn" data-act="cwtiles" ${S.cwRun?.running?'disabled':''}>${S.cwRun?.running?'Drawing…':'Draw the colourways'}</button><span class="meta">${S.cwRun?.running?cwProgress(S.cwRun):'Each part of the product is told apart and coloured on its own · concept visuals for the client, not a factory reference'}</span></div>`:''}${p.parts&&p.parts.length?`<h3 class="chk-h">The product, part by part</h3>${partsTable(p.parts)}`:''}<div class="rends" style="margin-top:12px">${cards||'<p class="meta">No renderings yet.</p>'}</div></section>`}
function panelStyle(){const revs=(S.techPack?.revisions||S.view?.techPack?.revisions||[]).slice().reverse();return `<div class="panel ${S.tab==='style'?'on':''}" data-panel="style">${cover()}${renderingsBlock()}<section class="block">${head('01','style summary','Style')}<div class="fields">${L('Style number',['style','styleNumber'],{ph:'FB-0001'})}${L('Style name',['style','styleName'])}${L('Season',['style','season'],{ph:'FW26'})}${L('Category',['style','category'],{ph:'Outerwear'})}${L('Designer',['style','designer'])}${L('Fit block / base pattern',['style','fitBlock'],{ph:'Regular fit, drop shoulder'})}${L('Sample size',['style','sampleSize'])}${L('Fabric summary',['style','fabricSummary'],{ph:'12oz cotton canvas, enzyme wash'})}${L('Description',['style','description'],{area:true,full:true,ph:'What this product is, who it is for, and what must be true about it.'})}</div></section>${S.draft&&!revs.length?'':`<section class="block">${head('09','revision history','Revisions')}<div class="revs">${revs.map(r=>`<div class="rev"><b>v${esc(r.version)}</b><span>${esc(r.note||'Published')}</span><span class="meta">${fmtDate(r.publishedAt)} ${fmtTime(r.publishedAt)}${r.by?' · '+esc(r.by):''}</span></div>`).join('')||'<p class="meta">Not yet published.</p>'}</div></section>`}</div>`}

function stage(sk,si,{overlays=''}={}){const pins=sk.callouts.map((c,ci)=>c.x==null?'':`<div class="pin ${ackFor(sk,c)?'ok':''} ${S.sel&&S.sel.si===si&&S.sel.ci===ci?'sel':''}" style="left:${c.x*100}%;top:${c.y*100}%" data-pin data-si="${si}" data-ci="${ci}">${c.photo?`<img class="ph" src="${c.photo}" alt="">`:''}<span class="n">${c.n}</span>${c.label?`<span class="lb">${esc(c.label)}</span>`:''}</div>`).join('');
  return `<div class="stage ${S.placing?'placing':''}" data-stage data-si="${si}">${sk.image?`<img class="base" src="${sk.image}" alt="${esc(sk.label||sk.view)}">${EDIT()?`<button type="button" class="imgx noprint" data-act="rmimg" data-i="${si}" title="Remove this photo and add another" aria-label="Remove this photo">✕</button>`:''}`:`<div class="empty"><b>${EDIT()?'Drop or click to add the '+sk.view+' mockup':'No '+sk.view+' mockup'}</b>${EDIT()?'PNG, JPG or WebP · flat sketch or garment photo':''}</div>`}${EDIT()&&!sk.image?`<input type="file" accept="image/png,image/jpeg,image/webp" data-act="sketchimg" data-si="${si}">`:''}${pins}${overlays}</div>`}
function panelCalls(){const p=S.pack;if(S.sk>=p.sketches.length)S.sk=Math.max(0,p.sketches.length-1);const sk=p.sketches[S.sk];const r=readiness();
  const tabs=`<div class="viewtabs">${p.sketches.map((s,i)=>`<button type="button" class="sbtn ${i===S.sk?'on':''}" data-act="sk" data-i="${i}">${esc(s.view)}${s.label?' · '+esc(s.label):''}</button>`).join('')}${EDIT()?`<button type="button" class="sbtn" data-act="addsk">+ View</button>${sk?`<button type="button" class="sbtn ${S.placing?'on':''}" data-act="placing">${S.placing?'Click the garment to place…':'+ Callout on garment'}</button>`:''}`:''}<span class="hint">${EDIT()?'Drag pins to reposition · tap a pin to edit':(MODE==='factory'?'Acknowledge each callout below':'')}</span></div>`;
  const skFields=sk&&EDIT()?`<details class="more" ${isPhone()?'':'open'}><summary>View settings · ${esc(sk.view)}${sk.label?' · '+esc(sk.label):''}</summary><div class="fields">${L('View',['sketches',S.sk,'view'],{options:SKETCH_VIEWS})}${L('Label',['sketches',S.sk,'label'],{ph:'Front — flat'})}${L('Garment width in this image (in)',['sketches',S.sk,'garmentWidthIn'],{type:'number',step:'0.01',ph:'e.g. 22'})}<div class="f"><span>Image</span><div class="addrow" style="margin:0"><label class="sbtn" style="position:relative;overflow:hidden">Replace image<input type="file" accept="image/png,image/jpeg,image/webp" data-act="sketchimg" data-si="${S.sk}" style="position:absolute;inset:0;opacity:0"></label><button type="button" class="sbtn danger" data-act="rmsk" data-i="${S.sk}">Remove view</button></div></div></div></details>`:'';
  const pant=`<div class="pantones"><div class="ph"><span>Fabric Pantones · ${p.colorways.length}</span>${EDIT()?`<span><button type="button" class="sbtn" data-act="matchc" title="Fill every colour's Pantone C code from its colour">Match Pantone C</button> <button type="button" class="sbtn" data-act="add" data-sec="colorways">+ Add</button></span>`:''}</div>${p.colorways.map((c,i)=>`<div class="pt"><div class="sw" style="background:${c.swatch||'#e6e6e2'}">${EDIT()?`<input type="color" value="${c.swatch||'#e6e6e2'}" data-path='${P('colorways',i,'swatch')}'>`:''}</div>${F(['colorways',i,'name'],{ph:'Colour name'})}${F(['colorways',i,'code'],{ph:'Pantone C'})}${rowActs('colorways',i,p.colorways.length)}</div>`).join('')||'<div class="pt"><span class="ro" style="grid-column:1/-1">No fabric Pantones yet.</span></div>'}<div class="ph" style="border-top:1px solid var(--line);border-bottom:0;font-size:8.5px;color:var(--dim)">Pantone C = the nearest chip to the colour, confirm against the Pantone Formula Guide (Solid Coated) · Black outlines = construction only</div></div>`;
  const cos=sk?`<div class="callouts">${sk.callouts.map((c,ci)=>{const ack=ackFor(sk,c);return `<div class="co ${ack?'ok':''} ${S.sel&&S.sel.si===S.sk&&S.sel.ci===ci?'sel':''}" data-co data-si="${S.sk}" data-ci="${ci}"><span class="n">${c.n}</span><div><div class="sum"><b>${esc(c.label)||'Untitled callout'}</b><span>${esc(c.spec)}</span></div><div class="body"><div class="fields">${L('Callout',['sketches',S.sk,'callouts',ci,'label'],{ph:'Collar'})}${L('Spec',['sketches',S.sk,'callouts',ci,'spec'],{ph:'95/5 cotton spandex 1x1 rib · DTM · $0.15/unit'})}${L('Note to factory',['sketches',S.sk,'callouts',ci,'note'],{area:!RO,full:true,ph:'Bar tack both corners; match sample'})}</div><div class="thumb">${c.photo?`<img src="${c.photo}" alt="">`:(EDIT()?'Add detail photo':'No photo')}${EDIT()?`<input type="file" accept="image/png,image/jpeg,image/webp" data-act="cophoto" data-si="${S.sk}" data-ci="${ci}">`:''}</div></div><div class="foot">${MODE==='factory'&&S.view?.quoteMode?'':MODE==='factory'?`<button type="button" class="ackbtn ${ack?'done':''}" data-act="ack" data-key="${esc(sk.id+':'+c.n)}" ${S.view?.techPack?.lockedAt?'disabled':''}>${ack?'✓ Acknowledged':'Acknowledge'}</button>`:`<span class="ack ${ack?'ok':''}">${ack?'✓ Acknowledged by '+esc(ack.by)+' · '+fmtDate(ack.at):'Awaiting factory acknowledgement'}</span>`}${EDIT()?`<span class="rowacts">${c.x==null?`<button type="button" title="Place on garment" data-act="pinit" data-si="${S.sk}" data-ci="${ci}">⌖</button>`:''}<button type="button" title="Remove" data-act="rmco" data-si="${S.sk}" data-ci="${ci}">✕</button></span>`:''}</div></div></div>`}).join('')||`<p class="meta">No callouts on this view yet.${EDIT()?' Use “+ Callout on garment”.':''}</p>`}${EDIT()?`<div class="addrow"><button type="button" class="sbtn" data-act="addco" data-si="${S.sk}">+ Callout (place later)</button></div>`:''}</div>`:'';
  return `<div class="panel ${S.tab==='calls'?'on':''}" data-panel="calls"><section class="block">${head('02','callouts','Callouts',r?`${r.callouts.length-r.pendingCalloutKeys.length} of ${r.callouts.length} acknowledged by factory · v${r.version}`:'')}${tabs}${sk?stage(sk,S.sk):`<div class="stage"><div class="empty"><b>No garment views yet</b>${EDIT()?'Add a front and a back view to start placing callouts.':''}</div></div>`}${skFields}${pant}${cos}</section></div>`}
function panelPoms(){const p=S.pack,sample=p.style.sampleSize;return `<div class="panel ${S.tab==='poms'?'on':''}" data-panel="poms"><section class="block">${head('03','measurements','Points of Measure',`<span>Sample size ${esc(sample||'—')}</span> · <span>all in inches</span> · <span>metric shown beneath</span>`,EDIT()?`<label class="f" style="min-width:240px"><span>Size run (comma separated)</span><input class="t" id="sizesInput" value="${esc(p.sizes.join(', '))}"></label>`:'')}<div class="tablewrap"><table class="tp" data-tbl="pom"><thead><tr><th>Code</th><th style="min-width:160px">POM</th><th style="min-width:180px">How to measure</th>${p.sizes.map(s=>`<th class="${s===sample?'sample':''}">${s===sample?'Spec ('+esc(s)+')':esc(s)}</th>`).join('')}<th>Tolerance</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.pom.map((r,i)=>`<tr><td class="num" data-l="Code">${F(['pom',i,'code'])}</td><td data-l="Point of measure">${F(['pom',i,'name'])}</td><td data-l="How to measure">${F(['pom',i,'how'],{area:!RO})}</td>${p.sizes.map(s=>`<td class="num ${s===sample?'sample':''}" data-l="${s===sample?'Spec '+esc(s):esc(s)}">${F(['pom',i,'values',s])}${metricSpan(p.pom[i].values?.[s],'len')}</td>`).join('')}<td class="num tol" data-l="Tolerance">${F(['pom',i,'tolerance'],{ph:'±0.5'})}${metricSpan(p.pom[i].tolerance,'tol')}</td>${EDIT()?`<td>${rowActs('pom',i,p.pom.length)}</td>`:''}</tr>`).join('')||`<tr><td colspan="${5+p.sizes.length}" class="meta" style="padding:14px">No measurements yet.</td></tr>`}</tbody></table></div>${addBtn('pom','Measurement')}</section></div>`}
function panelArt(){const p=S.pack;if(S.artSk>=p.sketches.length)S.artSk=0;const sk=p.sketches[S.artSk];
  const cards=p.artwork.map((a,ai)=>`<article class="art"><div class="img">${a.image?`<img src="${a.image}" alt="${esc(a.name)}">`:'<span class="meta">No file</span>'}</div><div class="body">${EDIT()?F(['artwork',ai,'name'],{ph:'Artwork name'}):`<strong>${esc(a.name||'Artwork')}</strong>`}<div class="chips">${a.pantones.map((pt,pi)=>`<span class="chip"><i style="background:${pt.hex}"></i>${esc(pt.name||pt.hex)}${pt.code?' · '+esc(pt.code):''}${EDIT()?`<button type="button" class="rowacts" style="display:inline;border:0;background:none;padding:0 0 0 4px;cursor:pointer" title="Remove" data-act="rmpt" data-ai="${ai}" data-pi="${pi}">✕</button>`:''}</span>`).join('')||'<span class="meta">No Pantone references</span>'}</div>${EDIT()?`<div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${a.pantones.map((pt,pi)=>`<label><span>${esc(pt.name||pt.hex)} · Pantone C</span>${F(['artwork',ai,'pantones',pi,'code'],{ph:'PANTONE 186 C'})}</label>`).join('')}</div>`:''}<div class="addrow" style="margin-top:2px">${a.image?`<a class="sbtn" href="${a.image}" download="${esc((a.name||'artwork').replace(/[^a-z0-9_-]+/gi,'-'))}.${a.image.startsWith('data:image/svg')?'svg':a.image.startsWith('data:image/png')?'png':'jpg'}">↓ Download</a>`:''}${EDIT()?`<button type="button" class="sbtn" data-act="extract" data-ai="${ai}">Re-extract Pantones</button>${sk?`<button type="button" class="sbtn" data-act="placeart" data-ai="${ai}">Place on ${esc(sk.view)}</button>`:''}<button type="button" class="sbtn danger" data-act="rmart" data-ai="${ai}">Remove</button>`:''}</div></div></article>`).join('');
  const overlays=sk?p.artwork.flatMap((a,ai)=>a.placements.map((pl,pi)=>pl.sketchId!==sk.id?'':`<div class="art-overlay" style="left:${pl.x*100}%;top:${pl.y*100}%;width:${pl.widthIn&&sk.garmentWidthIn?Math.min(100,pl.widthIn/sk.garmentWidthIn*100):25}%" data-ov data-ai="${ai}" data-pi="${pi}"><img src="${a.image}" alt=""><span class="tag">${esc(a.name||'art')} · ${inch(pl.widthIn)}</span></div>`)).join(''):'';
  const placements=sk?p.artwork.flatMap((a,ai)=>a.placements.map((pl,pi)=>pl.sketchId!==sk.id?'':`<div class="placement"><span class="meta">${esc(a.name||'Artwork')} on ${esc(sk.view)}</span>${EDIT()?`<div class="fields" style="grid-template-columns:1fr 1fr">${L('Width (in)',['artwork',ai,'placements',pi,'widthIn'],{type:'number',step:'0.01',ph:'3.5'})}${L('Label',['artwork',ai,'placements',pi,'label'],{ph:'Left chest'})}</div>`:`<strong>${esc(pl.label||'Placement')}</strong>`}<span class="meta"><span>Width ${inch(pl.widthIn)}</span>${sk.garmentWidthIn?` · <span>${inch(pl.x*sk.garmentWidthIn)} from left</span> · <span>${inch(pl.y*sk.garmentWidthIn*(stageRatio(sk)))} from top</span>`:' · <span>set garment width on the view for true scale</span>'}</span>${EDIT()?`<div class="rowacts"><button type="button" data-act="rmpl" data-ai="${ai}" data-pi="${pi}" title="Remove placement">✕</button></div>`:''}</div>`)).join(''):'';
  return `<div class="panel ${S.tab==='art'?'on':''}" data-panel="art"><section class="block">${head('04','artwork & colour','Pantone Extraction','Dominant colours are pulled from each file · Pantone C codes are matched, check them against a swatch book')}${EDIT()?`<label class="upload"><b>Upload artwork</b><span class="meta">PNG, JPG, SVG or WebP · 300 DPI recommended</span><input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-act="artfile" multiple></label>`:''}<div class="arts" style="margin-top:12px">${cards||'<p class="meta">No artwork uploaded yet.</p>'}</div></section><section class="block">${head('05','placement','Position on Garment',sk?`<span>True scale</span> · <span>garment width ${sk.garmentWidthIn?inch(sk.garmentWidthIn):'not set'} (${esc(sk.view)})</span>`:'Add a garment view first')}${p.sketches.length?`<div class="viewtabs">${p.sketches.map((s,i)=>`<button type="button" class="sbtn ${i===S.artSk?'on':''}" data-act="artsk" data-i="${i}">${esc(s.view)}</button>`).join('')}<span class="hint">${EDIT()?'Drag artwork to position · set width in inches':''}</span></div><div class="place">${stage(sk,S.artSk,{overlays})}<div class="side">${placements||'<p class="meta">No artwork placed on this view.'+(EDIT()?' Use “Place on …” on an artwork card.':'')+'</p>'}</div></div>`:''}</section></div>`}

function panelBom(){const p=S.pack;return `<div class="panel ${S.tab==='bom'?'on':''}" data-panel="bom"><section class="block">${head('06','bill of materials','Materials & Trims')}<div class="tablewrap"><table class="tp" data-tbl="bom"><thead><tr><th style="min-width:140px">Component</th><th style="min-width:140px">Material</th><th style="min-width:160px">Spec</th><th>Supplier</th><th>Ref</th><th>Color</th><th>Placement</th><th>Qty</th><th>Unit</th><th style="min-width:120px">Notes</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.bom.map((r,i)=>`<tr>${['component','material','spec','supplier','ref','color','placement','qty','unit','notes'].map(k=>`<td class="${k==='qty'||k==='unit'?'num':''} ${['component','material','spec'].includes(k)?'':'extra'}" data-l="${k==='ref'?'Ref':k[0].toUpperCase()+k.slice(1)}">${F(['bom',i,k],{area:!RO&&(k==='spec'||k==='notes')})}</td>`).join('')}<td class="morecell phone-only"><button type="button" class="sbtn" data-act="morerow" data-n="${[r.supplier,r.ref,r.color,r.placement,r.qty,r.unit,r.notes].filter(Boolean).length} more details">${[r.supplier,r.ref,r.color,r.placement,r.qty,r.unit,r.notes].filter(Boolean).length} more details</button></td>${EDIT()?`<td>${rowActs('bom',i,p.bom.length)}</td>`:''}</tr>`).join('')||'<tr><td colspan="11" class="meta" style="padding:14px">No materials yet.</td></tr>'}</tbody></table></div>${addBtn('bom','Material / trim')}</section><section class="block">${head('07','construction','Construction')}<div class="tablewrap"><table class="tp" data-tbl="construction"><thead><tr><th style="min-width:150px">Area</th><th>Detail — stitch, seam, thread, SPI, finish</th>${EDIT()?'<th></th>':''}</tr></thead><tbody>${p.construction.map((r,i)=>`<tr><td data-l="Area">${F(['construction',i,'area'],{ph:'Side seams'})}</td><td data-l="Detail">${F(['construction',i,'detail'],{area:!RO,ph:'Flat-felled, 12 SPI, tex 40 poly-core'})}</td>${EDIT()?`<td>${rowActs('construction',i,p.construction.length)}</td>`:''}</tr>`).joi function xBubble(e){

  else body=`<p>${esc(e.text)}${e.kind==='verdict'&&e.score!=null?`<span class="xchip">${e.score}/100</span>`:''}</p>`;

function xScore(el,n,start){

  const t0=performance.now(),dur=matchMedia('(prefers-reduced-motion:reduce)').matches?1:1100;const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);num.textContent=Math.round(from+(n-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);

function xUpdate(st){
  const el=X.el;if(!el)return;const feed=el.querySelector('.xchg-feed'),running=st.status==='running',stage=running?st.stage:'done';
  const idx=Math.max(0,XSTEPS.findIndex(s=>s[0]===stage));el.querySelector('.xchg-rail').style.setProperty('--p',String(idx/(XSTEPS.length-1)));
  el.querySelectorAll('.xchg-rail li').forEach((li,i)=>{li.classList.toggle('ok',i<idx||(!running&&i===idx));li.classList.toggle('on',running&&i===idx)});
  const bar=st.bar||90,needs=!running&&st.status!=='failed'&&st.outcome==='needs-review';X.bar=bar;
  const title=!running&&st.status==='failed'?'Your draft is ready':needs?'Not ready: needs a person':XTITLE[stage]||'';
  if(title!==X.title){X.title=title;el.querySelector('.xchg-title').innerHTML=`<span>${esc(title)}</span>`}
  const speaker=running?(XWHO[stage]||'design'):null;el.querySelectorAll('.xag').forEach(a=>a.classList.toggle('act',running&&a.dataset.who===speaker));
  const evs=st.events||[],last=evs.at(-1);if(last&&last.agent!=='system')el.dataset.dir=last.agent==='design'?'fwd':'back';else if(speaker)el.dataset.dir=speaker==='design'?'fwd':'back';

// Waits for the assistant's draft, then for the exchange with the developer assistant, with the pop-up showing each step as it happens.
async function watchAiDraft(){
  clearTimeout(aiWatch);document.querySelectorAll('.ai-banner').forEach(b=>b.remove());const slot=$('#noteSlot');
  const hold=S.draft&&!RO;if(hold){RO=true;rerender()}
  const prevLoop=S.techPack?.loop?.id||null,url=S.draft?`/v1/products/${S.product.id}/tech-pack/draft`:`/v1/admin/products/${S.product.id}/tech-pack`;
  const banner=document.createElement('div');banner.className='note noprint ai-banner';
  xOpen();xUpdate({stage:'draft',events:[],status:'running'});
  const started=Date.now();let applied=false,doneAt=0;
  const say=html=>{banner.innerHTML=html;if(!banner.isConnected)slot.prepend(banner)};
  const land=(d,tp)=>{if(hold)RO=false;if(!S.dirty&&!S.saving){S.techPack=tp;S.pack=tp.data;S.completeness=d.completeness;if(d.product)S.product={...S.product,...d.product};if(d.translations)S.translations=d.translations;rerender();toast('Draft written from the photo — check every value')}else{S.techPack=tp;rerender();toast('Draft landed — save to merge it with your edits')}};
  const tick=async()=>{try{
    const d=await api(url),tp=d.techPack,st=tp?.aiStatus,lp=tp?.loop&&tp.loop.id!==prevLoop?tp.loop:null;
    if(X.hidden&&X.open&&!banner.isConnected)say('<span class="spin"></span><strong>The assistants are still going over this pack.</strong> <button type="button" class="sbtn" data-act="xshow">Show</button>');
    if(st==='pending'){
      if(Date.now()-started>300000){if(hold){RO=false;rerender()}xClose();say('<strong>Still working.</strong> You can edit now — the draft will merge in when it lands, and anything you type is kept.');aiWatch=setTimeout(tick,10000);return}
      xUpdate({stage:'draft',events:[],status:'running'});aiWatch=setTimeout(tick,1500);return}
    if(st==='done'){
      if(!applied){applied=true;land(d,tp)}
      if(!doneAt)doneAt=Date.now();

        say(AI_BANNERS.done+(lp.finalScore!=null?` <strong>Tested by the developer assistant: ${lp.finalScore}/100</strong>${lp.changes.some(c=>!c.undone)?` after ${lp.changes.filter(c=>!c.undone).length} change${lp.changes.filter(c=>!c.undone).length===1?'':'s'} by the design assistant${MODE==='admin'?' (see the Check tab to undo)':''}`:''}.`:'')+(lp.outcome==='needs-review'?` <strong>That is below the bar of ${lp.bar||90}, so it is not ready: ${MODE==='admin'?'it needs a person to go through what is still open (Check tab)':'Future Basics will go through what is still open before it is built'}.</strong>`:''));if(X.hidden)xClose();return}
      xClose();say(AI_BANNERS.done);return}
    xClose();if(hold){RO=false;rerender()}S.techPack=tp;say(st==='failed'?aiFailedHtml(tp):st==='locked'?lockedHtml(tp,d.pricing):(AI_BANNERS[st]||AI_BANNERS.failed));
  }catch(e){aiWatch=setTimeout(tick,4000)}};aiWatch=setTimeout(tick,1200)}
// "Hand it back": the developer assistant tests the pack again and the two go through the findings (staff).

async function clientChanges(notes){try{const v=await api(`/v1/products/${productMatch[1]}/tech-pack/changes`,{method:'POST',body:JSON.stringify({notes})});S.view=v;S.pack=v.techPack.data;rerender();showTab('sign');toast('Change request sent to Future Basics')}catch(e){toast(e.message)}}
async function clientApprove(name){try{const v=await api(`/v1/products/${productMatch[1]}/tech-pack/approve`,{method:'POST',body:JSON.stringify({name})});S.view=v;S.pack=v.techPack.data;rerender();showTab('sign');toast(`Approved v${v.techPack.version} — Future Basics has been notified`)}catch(e){toast(e.message)}}
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='quoteLinkForm'){e.preventDefault();createQuoteLink(f)}if(f.id==='shareForm'){e.preventDefault();createShare(f)}if(f.id==='clientApprove'){e.preventDefault();const name=new FormData(f).get('name');if(!confirm(`Approve tech pack v${S.view?.techPack?.version} as ${name}? This confirms the design, measurements and materials and releases it to Future Basics and the factory.`))return;clientApprove(name)}if(f.id==='clientChanges'){e.preventDefault();const notes=String(new FormData(f).get('notes')||'').trim();if(notes)clientChanges(notes)}if(f.id==='brandSign'){e.preventDefault();brandSign(f)}if(f.id==='factorySign'){e.preventDefault();const name=new FormData(f).get('name');if(!confirm(`Countersign as ${S.view?.shareLabel}? This confirms you can produce to spec and locks v${S.view?.techPack?.version}.`))return;factoryAct('sign',{name}).then(v=>{if(v){toast(v.techPack.lockedAt?'Countersigned — tech pack locked for production':'Countersigned');showTab('sign')}})}});
window.addEventListener('beforeunload',e=>{if(S.dirty&&!RO){e.preventDefault();e.returnValue=''}});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'&&MODE==='admin'){e.preventDefault();save()}if(e.key==='Escape'&&S.placing){S.placing=false;rerender()}});

// ---- boot ----
async function boot(){
  if(MODE==='none')return gate('Tech pack not found','This link does not point at a tech pack.','/','Open the hub');
  try{
    if(MODE==='admin'){
      if(!TOKEN)return gate('Sign in to the work console','Tech packs are built from the Future Basics work console.','/','Sign in');
      const d=await api(`/v1/admin/products/${productMatch[1]}/tech-pack`);S.product=d.product;S.cutoutEnabled=Boolean(d.cutoutEnabled);S.techPack=d.techPack;S.pack=d.techPack?d.techPack.data:d.seed;S.seed=d.seed;S.shares=d.shares;S.completeness=d.completeness;S.workHubUrl=d.workHubUrl;S.clientHubUrl=d.clientHubUrl;S.translations=d.translations||{};S.aiEnabled=Boolean(d.aiEnabled);
      document.title=`Tech pack — ${S.product.title}`;render();autoPantoneC();if(!d.techPack)toast('Draft generated from the product configuration — edit anything to save it');
      if(d.techPack?.aiStatus==='pending')watchAiDraft();else if(d.techPack?.aiStatus==='failed')aiBanner('failed',d.techPack);else if(d.techPack?.aiStatus==='skipped')$('#noteSlot').insertAdjacentHTML('afterbegin',`<div class="note noprint ai-banner"><strong>Assistant draft was skipped</strong> — the client edited before it finished and the old rule kept their version. <button type="button" class="sbtn dark" data-act="airun" style="margin-left:6px">Run assistant now</button> (their edits are kept).</div>`);
    }else if(MODE==='client'){
      if(!TOKEN)return gate('Sign in to view this tech pack','Open your client hub, sign in, then come back to this link.','/','Open the client hub');
      let v=null;try{v=await api(`/v1/products/${productMatch[1]}/tech-pack`)}catch(e){if(e.status!==404)throw e}
      if(v){S.view=v;S.product=v.product;S.pack=v.techPack.data;if(location.hash==='#sign')S.tab='sign';document.title=`Tech pack — ${S.product.title}`;render();loadStudio(true)}
      else{const d=await api(`/v1/products/${productMatch[1]}/tech-pack/draft`);S.draft=true;S.product=d.product;S.cutoutEnabled=Boolean(d.cutoutEnabled);S.techPack=d.techPack;S.pack=d.techPack.data;S.completeness=d.completeness;S.clientHubUrl=d.clientHubUrl;S.pricing=d.pricing||null;RO=!d.editable;document.body.classList.add('draft-mode');
        document.title=`Tech pack draft — ${S.product.title}`;render();autoPantoneC();loadStudio(true);
        $('#noteSlot').innerHTML=d.editable?`<details class="note noprint" ${isPhone()?'':'open'}><summary><strong>Your draft</strong> · saves as you go</summary><p>Add sketches and callouts, measurements, materials and colours — everything saves as you go. When it describes the product you want made, <strong>submit it to Future Basics</strong>; we finish the pack, publish v1, and send it back for your approval before anything goes to a factory.</p></details>`:`<p class="note noprint">Submitted to Future Basics ${fmtDate(d.techPack.submittedAt)} ${fmtTime(d.techPack.submittedAt)}. We are reviewing it and will publish v1 for your approval. Need to change something? Message us in the project thread and we will reopen the draft.</p>`;
        const fromStart=(()=>{try{const v=sessionStorage.getItem('fb.start.ai');sessionStorage.removeItem('fb.start.ai');return v==='1'}catch{return false}})();if(d.techPack.aiStatus==='pending')watchAiDraft();else if(d.techPack.aiStatus==='failed'&&d.editable)aiBanner('failed',d.techPack);else if(d.techPack.aiStatus==='locked'&&d.editable){aiBanner('locked',d.techPack);if(d.techPack.checkoutUrl)watchUnlock()}else if(fromStart&&d.techPack.aiStatus)aiBanner(d.techPack.aiStatus,d.techPack)}
    }else{
      const v=await api(`/v1/tp/${encodeURIComponent(tokenMatch[1])}`);S.view=v;S.product=v.product;S.pack=v.techPack.data;S.translations=v.techPack.translations||{};const pref=(()=>{try{const u=new URLSearchParams(location.search).get('lang');if(u==='en'||S.translations[u])return u;const st=localStorage.getItem('fb.tp.lang.'+tokenMatch[1]);if(st==='en'||S.translations[st])return st}catch{}return Object.keys(S.translations).sort((a,b)=>String(S.translations[b].at).localeCompare(String(S.translations[a].at)))[0]||'en'})();setLang(pref);document.title=factoryTitle();render();
      factoryHead();
      if(!v.techPack.lockedAt&&v.techPack.readiness?.pendingCalloutKeys.length)S.tab='calls';
      render();
    }
  }catch(e){
    if(e.status===401)return gate('Session expired','Sign in again, then reopen this tech pack.','/','Sign in');
    if(e.status===410)return gate('This link is no longer active',e.message,'https://thefuturebasics.com','Future Basics');
    gate('Tech pack unavailable',e.message,'/','Open the hub');
  }
}
boot();
})();
</script></body></html>
